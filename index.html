<style>
  *{ box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: radial-gradient(circle at 50% 0%, #2b2f42 0%, #14151c 45%, #0a0b0f 100%);
    color: #fff;
    display: grid;
    place-items: center;
    padding: 24px;
    min-height: 100vh;
  }

  /* ============================================================
     MODO MÓVIL
     ============================================================ */
  body.is-mobile {
    display: block !important;
    padding: 0 !important;
    background: #fff !important;
    color: #000;
  }
  body.is-mobile .phone {
    width: 100% !important;
    height: 100vh !important;
    min-height: 100vh !important;
    border-radius: 0 !important;
    padding: 0 !important;
    background: #fff !important;
    box-shadow: none !important;
  }
  body.is-mobile .glass  { border-radius: 0 !important; }
  body.is-mobile .safari { top: 0 !important; }
  body.is-mobile .btn,
  body.is-mobile .notch,
  body.is-mobile .status,
  body.is-mobile .safari-bottom,
  body.is-mobile .home-bar { display: none !important; }
  body.is-mobile .lienzo {
    width: 100% !important;
    height: 100vh !important;
    max-height: 100vh !important;
  }

  /* ============================================================
     LIENZO
     ============================================================ */
  .lienzo-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ============================================================
     ÁREA DE CONTENIDO — degradado + color heredable
     ============================================================ */
  .area-contenido {
    flex: 1 1 auto;
    min-height: 0;

    background: #e5e7eb;
    color: #1f2937;

    display: flex;
    flex-direction: column;

    transition: background 0.35s ease;
  }

  /* ============================================================
     CTA · Reservar cupo / Consultar fechas
     Alineado a la izquierda, mismo margen que el contenido
     (26px izquierda) y misma reserva derecha (60px para los
     íconos flotantes). Ancho = 100% - 86px.
     ============================================================ */
  .cta-reservar {
    flex-shrink: 0;

    width: calc(100% - 86px);
    margin: 4px 60px 16px 26px;
    padding: 14px 22px;

    border: none;
    border-radius: 999px;

    background: #f97316;
    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

    box-shadow: 0 8px 20px rgba(249, 115, 22, 0.32),
                0 3px 8px rgba(15, 23, 42, 0.10);

    transition: transform 0.15s ease, background-color 0.2s ease,
                box-shadow 0.2s ease;
  }

  .cta-reservar:active {
    transform: scale(0.97);
    background: #ea580c;
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35),
                0 2px 4px rgba(15, 23, 42, 0.10);
  }

  .cta-reservar-texto {
    flex: 1;
    text-align: left;
  }

  .cta-reservar-icono {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
  }

  .cta-reservar-icono svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ============================================================
     CTA · estado deshabilitado
     ============================================================ */
  .cta-reservar:disabled {
    background: #fdba74;
    box-shadow: 0 6px 16px rgba(249, 115, 22, 0.18),
                0 2px 6px rgba(15, 23, 42, 0.06);
    cursor: not-allowed;
  }

  .cta-reservar:disabled:active {
    transform: none;
    background: #fdba74;
    box-shadow: 0 6px 16px rgba(249, 115, 22, 0.18),
                0 2px 6px rgba(15, 23, 42, 0.06);
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 360px) {
    .cta-reservar {
      width: calc(100% - 74px);
      margin: 4px 52px 16px 22px;
      padding: 13px 18px;
      font-size: 14px;

</style>

<style>
  /* ============================================================
     WRAP · contenedor chips + botones
     V2.1: border-top que separa la barra de ciudad de los chips.
     ============================================================ */
  .filtros-wrap {
    flex-shrink: 0;
    width: 100%;
    padding: 8px 0 4px;
    border-top: 1px solid rgba(15,23,42,.06);

    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ============================================================
     FILTROS · tira de chips
     ============================================================ */
  .filtros {
    flex: 1 1 auto;
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 18px;
    overflow-x: auto;
    padding: 0 4px 0 20px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .filtros::-webkit-scrollbar { display: none; }

  /* ============================================================
     CHIP · texto plano, sin cápsula
     ============================================================ */
  .chip {
    position: relative;

    flex: 0 0 auto;
    padding: 6px 0 6px;

    border: none;
    background: transparent;

    font-family: inherit;
    font-size: 21px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.01em;
    white-space: nowrap;

    color: #8e8e93;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

    transition: color 0.18s ease, font-weight 0.18s ease;
  }

  .chip:active { opacity: 0.7; }

  /* ============================================================
     CHIP ACTIVO
     ============================================================ */
  .chip.activo {
    color: #1f2937;
    font-weight: 700;
  }

  /* ============================================================
     LÍNEA BAJO EL ACTIVO
     ============================================================ */
  .chip.activo::after {
    content: '';

    position: absolute;
    left: 0;
    bottom: 2px;

    width: 24px;
    height: 2px;

    background: #1f2937;
    border-radius: 1px;
  }

  /* ============================================================
     BOTÓN MENÚ GLOBAL
     ============================================================ */
  .menu-global {
    flex: 0 0 auto;

    width: 34px;
    height: 34px;
    padding: 0;
    margin-right: 14px;

    border: 1.2px solid #475569;
    border-radius: 50%;
    background: transparent;

    color: #475569;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

    transition: opacity 0.15s ease;
  }

  .menu-global:active { opacity: 0.5; }

  .menu-global svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* ============================================================
     BOTÓN LUPA
     ============================================================ */
  .btn-lupa {
    flex: 0 0 auto;

    width: 34px;
    height: 34px;
    padding: 0;
    margin-left: 8px;
    margin-right: 8px;

    border: 1.2px solid #475569;
    border-radius: 50%;
    background: transparent;

    color: #475569;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

    transition: opacity 0.15s ease;
  }

  .btn-lupa:active { opacity: 0.5; }

  .btn-lupa svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ============================================================
     FILA DE BÚSQUEDA · ocupa todo el ancho del wrap
     ============================================================ */
  .buscar-fila {
    display: none;
    align-items: center;
    gap: 10px;

    flex: 1 1 auto;
    width: 100%;
    padding: 0 14px 0 16px;
  }

  .buscar-input-wrap {
    flex: 1 1 auto;
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 6px 0;

    border-bottom: 1.5px solid #cbd5e1;
    transition: border-color 0.2s ease;
  }

  .buscar-input-wrap:focus-within {
    border-bottom-color: #475569;
  }

  .buscar-lupa {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: #64748b;
  }

  .buscar-lupa svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .buscar-input {
    flex: 1 1 auto;
    min-width: 0;

    border: none;
    outline: none;
    background: transparent;
    padding: 2px 0;

    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #1f2937;
    line-height: 1.1;
  }

  .buscar-input::placeholder {
    color: #94a3b8;
    font-weight: 400;
  }

  .buscar-cerrar {
    flex: 0 0 auto;

    width: 34px;
    height: 34px;
    padding: 0;
    margin-right: 0;

    border: none;
    background: transparent;
    color: #94a3b8;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;

    transition: color 0.15s ease;
  }

  .buscar-cerrar:active { opacity: 0.5; }

  .buscar-cerrar svg {

    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ============================================================
     ESTADO · buscando
     ============================================================ */
  .filtros-wrap.buscando .filtros,
  .filtros-wrap.buscando .btn-lupa,
  .filtros-wrap.buscando .menu-global {

  }

  .filtros-wrap.buscando .buscar-fila {

  /* ============================================================
     AVISO DE BÚSQUEDA SIN RESULTADOS

    font-size: 0.82rem;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.1px;
    color: #94a3b8;

    background: transparent;
    text-align: left;
  }

  .buscar-vacio[hidden] { display: none; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 360px) {
    .filtros { gap: 16px; padding-left: 18px; }
    .chip    { font-size: 20px; }
    .menu-global { width: 32px; height: 32px; margin-right: 12px; }
    .menu-global svg { width: 18px; height: 18px; }
    .btn-lupa { width: 32px; height: 32px; margin-left: 6px; margin-right: 6px; }
    .btn-lupa svg { width: 16px; height: 16px; }
    .buscar-fila { padding: 0 12px 0 14px; }
    .buscar-input { font-size: 16px; }
    .buscar-vacio { font-size: 0.78rem; padding: 7px 14px 9px; }

</style>

<style>
  /* ============================================================
     BOTÓN CIUDAD · fila propia, encima de .filtros-wrap
     ============================================================ */
  .city-bar {
    align-self: flex-start;
    flex-shrink: 0;

    display: inline-flex;
    align-items: center;
    gap: 8px;

    max-width: calc(100% - 24px);
    padding: 8px 14px 8px 20px;
    margin: 0;

    border: none;
    background: transparent;
    border-radius: 10px;

    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #64748b;
    text-align: left;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s ease, opacity 0.2s ease;
  }

  .city-bar:active { background: rgba(15,23,42,.04); }

  .city-bar:disabled {
    cursor: not-allowed;
    opacity: 0.4;
    pointer-events: none;
  }

  .city-bar .city-pin {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .city-bar .city-pin svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .city-bar .city-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .city-bar .city-txt b {
    color: #1f2937;
    font-weight: 700;
  }

  .city-bar .city-chev {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 2px;
  }
  .city-bar .city-chev svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ============================================================
     ROOT DEL SHEET
     ============================================================ */
  .ciudad-root {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 620;
  }
  .ciudad-root.abierto { pointer-events: auto; }

  /* ============================================================
     BACKDROP
     ============================================================ */
  .ciudad-backdrop {
    position: absolute;
    inset: 0;
    background: #0f172a;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ciudad-backdrop.visible {
    opacity: 0.45;
    pointer-events: auto;
  }

  /* ============================================================
     SHEET · 90%
     ============================================================ */
  .ciudad-sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 90%;
    background-color: #ffffff;
    border-radius: 22px 22px 0 0;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    visibility: hidden;
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0s linear 0.42s;
    will-change: transform;
    overflow: hidden;
    touch-action: pan-y;
    box-shadow: 0 -8px 24px rgba(15,23,42,.12);
  }
  .ciudad-sheet.abierto {
    visibility: visible;
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0s;
  }
  .ciudad-sheet.sin-transicion { transition: none; }

  /* ============================================================
     HANDLE
     ============================================================ */
  .ciudad-handle-area {
    flex-shrink: 0;
    padding: 10px 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    min-height: 40px;
    background-color: #ffffff;
  }
  .ciudad-handle-area:active { cursor: grabbing; }

  .ciudad-handle {
    width: 38px;
    height: 4px;
    background-color: #cbd5e1;
    border-radius: 999px;
    transition: background-color 0.2s ease, width 0.2s ease;
  }
  .ciudad-handle-area:active .ciudad-handle {
    background-color: #94a3b8;
    width: 46px;
  }

  /* ============================================================
     CERRAR
     ============================================================ */
  .ciudad-close {
    position: absolute;
    top: 4px;
    right: 12px;
    width: 36px;

     CAMPOS FLOTANTES

  .form-field {
    position: relative;
    margin-bottom: 14px;
  }

  .form-input {
    width: 100%;

  .form-field.invalido .form-label {
    color: #dc2626;
    background-color: #fef2f2;
  }

  .field-check {
    position: absolute;
    right: 14px;
    top: 50%;
    width: 20px;
    height: 20px;
    transform: translateY(-50%) scale(0.6);
    color: #16a34a;

     ============================================================ */

  }

  .form-prefijo {

  }

    border: none;

  .btn-solicitar-codigo {

    border: 1.5px solid color-mix(in srgb, var(--post-color, #1d4ed8) 40%, #e2e8f0);
    background-color: color-mix(in srgb, var(--post-color, #1d4ed8) 6%, #f8fafc);
    color: var(--post-color, #1d4ed8);

  .form-check-wrap {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    background-color: #f8fafc;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    transition: border-color 0.2s, background-color 0.2s;

  .form-check-wrap.error {
    border-color: #dc2626;
    background-color: #fef2f2;
  }

  .form-check-inner {
    position: relative;
    display: inline-flex;
    flex-shrink: 0;
    cursor: pointer;
  }
  .form-check-inner input[type="checkbox"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .form-check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid #cbd5e1;

    border: none;
    padding: 0;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;

  .form-submit {
    width: 100%;
    margin-top: 14px;
    padding: 15px 22px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 0.94rem;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: #ffffff;
    cursor: pointer;
    background: linear-gradient(135deg, #fb923c 0%, #f97316 55%, #ea580c 100%);
    transition: transform 0.15s, opacity 0.2s, filter 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .form-submit:active:not(:disabled) { transform: scale(0.98); }
  .form-submit:disabled {
    opacity: 0.42;
    cursor: not-allowed;
    filter: grayscale(0.35);
  }

  .form-submit-texto {
    flex: 1;
    text-align: left;
  }

  .form-submit-flecha {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .form-submit-flecha svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ============================================================
     ANIMACIONES
     ============================================================ */
  @keyframes revelarEntrada {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ocultarSalida {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  .bloque-post-validacion.revelando .revelar-item {
    animation: revelarEntrada 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .bloque-post-validacion[hidden] { display: none; }

  .zona-otp[hidden] { display: none; }
  .zona-otp.revelando { animation: revelarEntrada 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .zona-otp.saliendo  { animation: ocultarSalida  0.18s ease both; }

  /* ============================================================
     WRAPPERS DE VISTA · form ↔ legal ↔ éxito
     ============================================================ */
  .reserva-form-wrap[hidden]  { display: none; }
  .reserva-legal-wrap[hidden] { display: none; }
  .reserva-exito-wrap[hidden] { display: none; }

  /* ============================================================
     BLOQUE REVELABLE · aparece cuando el horario está confirmado
     ============================================================ */
  .bloque-colapsable {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 380ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bloque-colapsable.abierto {
    grid-template-rows: 1fr;
  }
  .bloque-colapsable > .bloque-inner {
    overflow: hidden;
    padding-top: 12px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity   280ms cubic-bezier(0.16, 1, 0.3, 1) 80ms,
                transform 280ms cubic-bezier(0.16, 1, 0.3, 1) 80ms;
  }
  .bloque-colapsable.abierto > .bloque-inner {
    opacity: 1;
    transform: translateY(0);
  }

</style>

<style>
  /* ============================================================
     ROOT
     ============================================================ */
  .partner-root {

    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 650;
  }
  .partner-root.abierto { pointer-events: auto; }

  /* ============================================================
     BACKDROP
     ============================================================ */
  .partner-backdrop {
    position: absolute;
    inset: 0;
    background-color: #0f172a;
    opacity: 0;
    pointer-events: none;
    z-index: 500;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .partner-backdrop.visible {
    opacity: 0.45;
    pointer-events: auto;
  }

  /* ============================================================
     SHEET · altura 90%
     ============================================================ */
  .partner-sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 90%;
    background-color: #ffffff;
    border-radius: 22px 22px 0 0;
    z-index: 501;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    visibility: hidden;
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0s linear 0.42s;
    will-change: transform;
    overflow: hidden;
    touch-action: pan-y;
  }
  .partner-sheet.abierto {
    visibility: visible;
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0s;

  /* ============================================================

<style>

  .phone {
    position: relative;
    width: 116.58mm;
    height: 232.39mm;
    border-radius: 16.1mm;
    padding: 3.5mm;
    background: linear-gradient(150deg,

  .btn {

  .btn.power  { right: -1.26mm; top: 72.4mm; height: 30.8mm; }

  .notch {
    position: absolute;

    transform: translateX(-50%);

  function getDeviceId() {
    var KEY = 'app_deviceid';
    var id = null;
    try { id = localStorage.getItem(KEY); } catch (_) {}
    if (id) return id;

    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var nuevo = '';
    for (var i = 0; i < 12; i++) {
      nuevo += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    try { localStorage.setItem(KEY, nuevo); } catch (_) {}
    return nuevo;
  }

  /* ============================================================

     + SISTEMA (lo que doGet inyectaba en el HTML). Un solo

  function _pedirSesion() {
    var url = window.URL_EXEC;

    return _fetchConTimeout(url, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body:    JSON.stringify({

      .then(function (r) {

        return r.text();

      .then(function (txt) {
        var res;
        try { res = JSON.parse(txt); } catch (e) {
          throw new Error('RESPUESTA_NO_JSON');
        }
        if (!res.ok) throw new Error(res.error || 'ERROR_SESION');
        return res.data;
      })
      .then(function (data) {
        if (data && data.token) window.TOKEN_SESION = data.token;
        if (data && data.sistema && !window.SISTEMA) {
          window.SISTEMA = data.sistema;
        }
        return data;
      });
  }

  function asegurarSesion() {

    if (!_promesaSesion) {

        function (data) { _promesaSesion = null; return data; },
        function (err)  { _promesaSesion = null; throw err; }

  var TIMEOUT_MS = 12000;

  var PILDORA_DESDE_REINTENTO = 2;

    var ACCIONES_IDEMPOTENTES = {
    catalogo:         true,
    postDetalle:      true,
    cupos:            true,
    comentarios:      true
  };

  function _fetchConTimeout(url, options, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var terminado = false;
      var timer = setTimeout(function () {
        if (terminado) return;
        terminado = true;
        reject(new Error('TIMEOUT'));
      }, timeoutMs);

      fetch(url, options)
        .then(function (r) {
          if (terminado) return;
          terminado = true;
          clearTimeout(timer);
          resolve(r);
        })
        .catch(function (err) {
          if (terminado) return;
          terminado = true;
          clearTimeout(timer);
          reject(err);
        });
    });
  }

  function _esErrorReintentable(msg, err) {
    if (msg === 'TOKEN_INVALIDO')       return false;
    if (msg === 'TIMEOUT')              return true;
    if (msg === 'RESPUESTA_NO_JSON')    return true;
    if (/^HTTP_5/.test(msg))            return true;
    if (/^HTTP_4/.test(msg))            return false;
    if (/^HTTP_/.test(msg))             return true;
    if (err && (err.name === 'TypeError' || err.name === 'AbortError')) return true;
    return false;

        body.idPuente = window.Puente.getDispositivo() || undefined;
      }
    } catch (_) {}

    var esIdempotente = ACCIONES_IDEMPOTENTES[accion] === true;

        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(body)
      }, TIMEOUT_MS)
      .then(function (r) {

        return r.text();

        } catch (e) {

          }

          /* R26: sesión nueva POR DATOS (sin recargar la página:
             el usuario no pierde su vista ni su estado) y
             reintento de la MISMA acción. El guardia anti-loop
             de arriba sigue cortando a los 3 intentos. */
          console.warn('[postBackend] Token inválido · sesión nueva por datos (intento ' +
                       intentos + '/' + MAX_RELOADS_TOKEN + ')');
          window.TOKEN_SESION = '';
          return asegurarSesion()
            .then(function () {
              return intentar(n);
            })
            .catch(function (err2) {
              var msg2 = (err2 && err2.message) || 'ERROR_DESCONOCIDO';
              if (msg2 === 'TOKEN_INVALIDO') {
                _mostrarErrorToken();
                throw err2;
              }
              /* La sesión nueva no llegó (red): camino de siempre. */
              _ocultarReconectando();
              if (accion === 'catalogo' && !mudo) _mostrarErrorRed();
              throw err2;
            });
        }

        var puedeReintentar = esIdempotente &&
                              n < maxIntentos &&
                              _esErrorReintentable(msg, err);

        if (puedeReintentar) {
          var espera = BACKOFF_BASE_MS * Math.pow(2, n - 1);
          console.warn('[postBackend] ' + accion + ' falló (' + msg +
                       '). Reintentando en ' + espera + 'ms · ' +
                       n + '/' + maxIntentos);
          if (!mudo && n >= PILDORA_DESDE_REINTENTO) {
            _mostrarReconectando();   /* R21: solo desde el reintento 2 */
          }
          return new Promise(function (res) {
            setTimeout(res, espera);
          }).then(function () {
            return intentar(n + 1);
          });
        }

        console.error('[postBackend] ' + accion + ' falló definitivamente: ' + msg);

        _ocultarReconectando();     /* R14: la pantalla de error toma el relevo */
        if (accion === 'catalogo' && !mudo) {
          _mostrarErrorRed();       /* R21: mudo no tapa contenido ya pintado */
        }

        throw err;
      });
    }

    return intentar(1);
  }

  /* ============================================================
     HELPERS GLOBALES · WhatsApp
     ============================================================ */

  function limpiarTelefono(numero) {
    var soloDigitos = String(numero || '').replace(/\D/g, '');
    if (!soloDigitos) return '';

    if (soloDigitos.charAt(0) === '0') {
      soloDigitos = soloDigitos.substring(1);
    }
    if (soloDigitos.indexOf('58') === 0) return soloDigitos;
    return '58' + soloDigitos;
  }

  function abrirWhatsapp(numero, mensaje) {
    var numeroLimpio = limpiarTelefono(numero);
    if (!numeroLimpio || numeroLimpio.length < 10) return false;

    var url = 'https://wa.me/' + numeroLimpio +
              '?text=' + encodeURIComponent(mensaje || '');

    var a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return true;
  }

  function aplicarPlaceholders(mensaje, cursoJson) {
    cursoJson = cursoJson || {};
    return String(mensaje || '')
      .replace(/\{titulo\}/g,  cursoJson.titulo  || '')
      .replace(/\{tagline\}/g, cursoJson.tagline || '');
  }
</script>

<script>
  /* ============================================================
     MÓDULO GLOBAL · Menú (bottom sheet)

  window.Global = (function () {

    var UMBRAL_VELOCIDAD = 0.5;
    var UMBRAL_DRAG      = 6;

    var base   = 'menu';
    var abierto = false;

    var raiz       = null;
    var backdrop   = null;
    var sheet      = null;
    var handleArea = null;
    var content    = null;
    var btnClose   = null;
    var btnBack    = null;
    var titulo     = null;

    var dragActivo = false;
    var dragMoved = false;
    var dragPointerId = null;
    var dragStartY = 0;
    var dragUltimoY = 0;
    var dragUltimoT = 0;
    var dragVelocidad = 0;
    var dragDesdeHandle = false;

    function _renderMarcaApp(marca) {
      var s = String(marca || '');
      var idx = s.lastIndexOf('Cloud');
      if (idx > 0) {
        return '<span class="marca-prefijo">' + s.substring(0, idx) + '</span>' +
               '<span class="marca-cloud">' + s.substring(idx) + '</span>';
      }
      return s;
    }

    function _renderMarcaMain(marca) {
      var s = String(marca || '').trim();
      if (!s) return '';

      var idxGenius = s.indexOf('Genius');
      var idxCloud  = s.lastIndexOf('Cloud');

      if (idxGenius > 0 && idxCloud > idxGenius) {
        return '<span class="in">'     + s.substring(0, idxGenius)         + '</span>' +
               '<span class="genius">' + s.substring(idxGenius, idxCloud)  + '</span>' +
               '<span class="cloud">'  + s.substring(idxCloud)             + '</span>';
      }

      return s;
    }

    function _whatsappHrefAsesor() {
      var root  = (window.SISTEMA && window.SISTEMA.root)  || {};
      var admin = root.admin || {};
      var numero  = limpiarTelefono(admin.whatsapp);
      if (!numero) return '#';
      var mensaje = admin.mensajeWhatsapp || '';
      return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(mensaje);
    }

    function getMenuHTML() {
      var pwaTitulo = (window.SISTEMA && window.SISTEMA.pwa && window.SISTEMA.pwa.titulo) || 'Instalar la app';

      return '' +
        '<h2 class="sheet-titulo">Menú</h2>' +
        '<div class="sheet-menu-lista">' +

          '<a class="sheet-menu-item" data-accion="asesor" ' +
             'href="' + _whatsappHrefAsesor() + '" target="_top" rel="noopener">' +
            '<span class="sheet-menu-icon"><span data-glifo="userPlus"></span></span>' +
            '<span class="sheet-menu-texto">' +
              '<span class="sheet-menu-titulo">Ofrece tus servicios aquí</span>' +
              '<span class="sheet-menu-sub">Cursos, oficios, asesorías y más</span>' +
            '</span>' +
            '<span class="sheet-menu-chevron">›</span>' +
          '</a>' +

          '<div class="sheet-menu-sep"></div>' +

          '<button class="sheet-menu-item" data-accion="terminos">' +
            '<span class="sheet-menu-icon"><span data-glifo="book"></span></span>' +
            '<span class="sheet-menu-texto">Términos y condiciones</span>' +
            '<span class="sheet-menu-chevron">›</span>' +
          '</button>' +

          '<button class="sheet-menu-item" data-accion="privacidad">' +
            '<span class="sheet-menu-icon"><span data-glifo="candado"></span></span>' +
            '<span class="sheet-menu-texto">Política de privacidad</span>' +
            '<span class="sheet-menu-chevron">›</span>' +
          '</button>' +

          '<button class="sheet-menu-item" data-accion="cookies">' +
            '<span class="sheet-menu-icon"><span data-glifo="cookie"></span></span>' +
            '<span class="sheet-menu-texto">Política de cookies</span>' +
            '<span class="sheet-menu-chevron">›</span>' +
          '</button>' +

          '<button class="sheet-menu-item" data-accion="pwa">' +
            '<span class="sheet-menu-icon"><span data-glifo="download"></span></span>' +
            '<span class="sheet-menu-texto">' + pwaTitulo + '</span>' +
            '<span class="sheet-menu-chevron">›</span>' +
          '</button>' +

          '<button class="sheet-menu-item" data-accion="acerca">' +
            '<span class="sheet-menu-icon"><span data-glifo="info"></span></span>' +
            '<span class="sheet-menu-texto">Acerca de</span>' +
            '<span class="sheet-menu-chevron">›</span>' +
          '</button>' +

        '</div>';
    }

    function getAcercaHTML() {
      var root = (window.SISTEMA && window.SISTEMA.root) || {};
      var main = root.main || {};
      var app  = root.app  || {};

      var anioActual = new Date().getFullYear();

      var marcaApp    = app.marca    || '';
      var esloganApp  = app.eslogan  || '';
      var versionApp  = app.version  || '';
      var marcaMain   = main.marca   || '';
      var esloganMain = main.eslogan || '';

      return '' +
        '<div class="sheet-acerca">' +

          '<div class="sheet-acerca-app">' +
            (marcaApp
              ? '<h3 class="sheet-acerca-app-nombre">' + _renderMarcaApp(marcaApp) + '</h3>'
              : '') +
            (esloganApp
              ? '<p class="sheet-acerca-app-eslogan">' + esloganApp + '</p>'
              : '') +
            (versionApp
              ? '<span class="sheet-acerca-app-version">Versión ' + versionApp + ' · Web App</span>'
              : '') +
          '</div>' +

          '<div class="sheet-acerca-divisor"></div>' +

          '<div class="sheet-acerca-empresa">' +
            '<p class="sheet-acerca-credito">una creación de</p>' +
            (marcaMain
              ? '<div class="carga-brand">' + _renderMarcaMain(marcaMain) + '</div>'
              : '') +
            (esloganMain
              ? '<p class="sheet-acerca-empresa-eslogan">' + esloganMain + '</p>'
              : '') +
          '</div>' +

          '<p class="sheet-acerca-footer">' +
            '© ' + anioActual + ' · Todos los derechos reservados' +
          '</p>' +

        '</div>';
    }

    /* ============================================================
       getLegalHTML · interpolación de placeholders
       ============================================================ */
    function getLegalHTML(clave) {
      var contenido = window.SISTEMA &&
                      window.SISTEMA.contenidoLegal &&
                      window.SISTEMA.contenidoLegal[clave];

      if (!contenido) {
        return '<h2 class="sheet-titulo">Próximamente</h2>';
      }

      var root  = (window.SISTEMA && window.SISTEMA.root) || {};
      var app   = root.app   || {};
      var main  = root.main  || {};
      var admin = root.admin || {};

      var datos = {
        marcaApp:     String(app.marca   || 'la Aplicación').trim(),
        marcaEmpresa: String(main.marca  || '').trim() || String(app.marca || 'la aplicación').trim(),
        correo:       String(app.correo    || '').trim() || '—',
        whatsapp:     String(admin.whatsapp || '').trim() || '—'
      };

      function interpolar(texto) {
        if (texto == null) return '';
        return String(texto)
          .replace(/\{marcaApp\}/g,     datos.marcaApp)
          .replace(/\{marcaEmpresa\}/g, datos.marcaEmpresa)
          .replace(/\{correo\}/g,       datos.correo)
          .replace(/\{whatsapp\}/g,     datos.whatsapp);
      }

      var html = '<div class="sheet-privacidad">';

      html += '<div class="sheet-titulo-con-icono">';
      if (contenido.icono) {
        html += '<span class="icono"><span data-glifo="' + contenido.icono + '"></span></span>';
      }
      html += '<span>' + interpolar(contenido.titulo) + '</span>';
      html += '</div>';

      if (contenido.ultimaActualizacion) {
        html += '<p class="fecha">Última actualización · ' +
                interpolar(contenido.ultimaActualizacion) + '</p>';
      }

      var secciones = contenido.secciones || [];
      secciones.forEach(function (s) {
        html += '<h3>' + interpolar(s.titulo) + '</h3>';

        if (s.intro) {
          html += '<p>' + interpolar(s.intro) + '</p>';
        }

        if (s.parrafos && s.parrafos.length > 0) {
          s.parrafos.forEach(function (p) {
            html += '<p>' + interpolar(p) + '</p>';
          });
        }

        if (s.items && s.items.length > 0) {
          html += '<ul>';
          s.items.forEach(function (item) {
            html += '<li>' + interpolar(item) + '</li>';
          });
          html += '</ul>';
        }
      });

      html += '</div>';
      return html;
    }

    function getPlataformaUsuario() {
      var ua = navigator.userAgent || '';
      var esIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (esIOS) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      return 'android';
    }

    function getPWAHTML() {
      var cfg = window.SISTEMA && window.SISTEMA.pwa;
      if (!cfg) return '<h2 class="sheet-titulo">Próximamente</h2>';

      var plataforma = getPlataformaUsuario();
      var data = cfg[plataforma] || cfg.otro;
      if (!data) return '<h2 class="sheet-titulo">Próximamente</h2>';

      var html = '<div class="sheet-pwa">';

      html += '<div class="sheet-titulo-con-icono">';
      if (cfg.icono) {
        html += '<span class="icono"><span data-glifo="' + cfg.icono + '"></span></span>';
      }
      html += '<span>' + (cfg.titulo || 'Instalar la app') + '</span>';
      html += '</div>';

      if (cfg.subtitulo) {
        html += '<p class="pwa-sub">' + cfg.subtitulo + '</p>';
      }

      if (data.plataforma) {
        html += '<span class="pwa-plataforma">' + data.plataforma + '</span>';
      }

      var pasos = data.pasos || [];
      if (pasos.length > 0) {
        html += '<ol class="pwa-pasos">';
        pasos.forEach(function (p) {
          html += '<li>';
          html += '<span class="pwa-paso-titulo">' + p.titulo + '</span>';
          if (p.detalle) html += '<span class="pwa-paso-detalle">' + p.detalle + '</span>';
          html += '</li>';
        });
        html += '</ol>';
      }

      if (data.nota) {
        html += '<p class="pwa-nota">' + data.nota + '</p>';
      }

      html += '</div>';
      return html;
    }

    function getContenido(k) {
      if (k === 'menu')       return getMenuHTML();
      if (k === 'acerca')     return getAcercaHTML();
      if (k === 'terminos')   return getLegalHTML('terminos');
      if (k === 'privacidad') return getLegalHTML('privacidad');
      if (k === 'cookies')    return getLegalHTML('cookies');
      if (k === 'pwa')        return getPWAHTML();
      return '';
    }

    function actualizarGradientePrivacidad() {
      if (!sheet || !content) return;
      if (!sheet.classList.contains('con-privacidad')) {
        sheet.classList.remove('scroll-mas');
        return;
      }
      var hayMas = (content.scrollTop + content.clientHeight) < (content.scrollHeight - 8);
      sheet.classList.toggle('scroll-mas', hayMas);
    }

    function construirDOM() {
      if (raiz) return;

      var area = document.querySelector('.area-contenido');
      if (!area) return;

      raiz = document.createElement('div');
      raiz.className = 'global-sheet-root';
      raiz.innerHTML =
        '<div class="sheet-backdrop"></div>' +
        '<div class="sheet">' +
          '<div class="sheet-handle-area"><div class="sheet-handle"></div></div>' +
          '<button class="sheet-close" type="button" aria-label="Cerrar">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="18" y1="6" x2="6" y2="18"/>' +
              '<line x1="6" y1="6" x2="18" y2="18"/>' +
            '</svg>' +
          '</button>' +
          '<button class="sheet-back" type="button" aria-label="Volver">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<polyline points="15 18 9 12 15 6"/>' +
            '</svg>' +
          '</button>' +
          '<div class="sheet-back-titulo">Volver</div>' +
          '<div class="sheet-content"></div>' +
        '</div>';

      area.appendChild(raiz);

      backdrop   = raiz.querySelector('.sheet-backdrop');
      sheet      = raiz.querySelector('.sheet');
      handleArea = raiz.querySelector('.sheet-handle-area');
      content    = raiz.querySelector('.sheet-content');
      btnClose   = raiz.querySelector('.sheet-close');
      btnBack    = raiz.querySelector('.sheet-back');
      titulo     = raiz.querySelector('.sheet-back-titulo');

      backdrop.addEventListener('click', cerrar);
      btnClose.addEventListener('click', cerrar);
      btnBack.addEventListener('click', volverAlMenu);

      handleArea.addEventListener('pointerdown', onHandleDown);
      content.addEventListener('pointerdown', onContentDown);
      content.addEventListener('scroll', actualizarGradientePrivacidad);
    }

    function inyectarDirecto(k) {
      content.classList.remove('saliendo', 'entrando');
      content.innerHTML = getContenido(k);
      content.scrollTop = 0;

      if (typeof window.pintarGlifos === 'function') {
        window.pintarGlifos(content);
      }
      if (k === 'menu') engancharMenu();

      actualizarGradientePrivacidad();
    }

    function inyectarConFade(k) {
      content.classList.add('saliendo');

      setTimeout(function () {
        content.innerHTML = getContenido(k);
        content.classList.add('entrando');
        content.scrollTop = 0;

        if (typeof window.pintarGlifos === 'function') {
          window.pintarGlifos(content);
        }
        if (k === 'menu') engancharMenu();

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            content.classList.remove('saliendo', 'entrando');
            actualizarGradientePrivacidad();
          });
        });
      }, 140);
    }

    function abrir() {
      construirDOM();
      if (!raiz) return;

      haptic(10);

      base    = 'menu';
      abierto = true;

      sheet.classList.remove('con-privacidad', 'scroll-mas');

      inyectarDirecto('menu');
      sheet.classList.remove('subvista');
      titulo.textContent = 'Volver';

      sheet.classList.add('sin-transicion');
      sheet.style.transform = 'translateY(100%)';

      raiz.classList.add('abierto');
      sheet.classList.add('abierto');

      void sheet.offsetHeight;
      sheet.classList.remove('sin-transicion');

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          sheet.style.transform = 'translateY(0)';
          backdrop.classList.add('visible');
        });
      });
    }

    function cerrar() {
      if (!abierto) return;

      abierto = false;
      backdrop.classList.remove('visible');
      sheet.style.transform = 'translateY(100%)';
      sheet.classList.remove('con-privacidad', 'scroll-mas');

      setTimeout(function () {
        if (!abierto) {
          sheet.classList.remove('abierto');
          raiz.classList.remove('abierto');
          if (content) content.innerHTML = '';
        }
      }, 420);
    }

    function navegar(subvista) {
      sheet.classList.add('subvista');
      titulo.textContent = 'Volver';

      if (subvista === 'privacidad' ||
          subvista === 'terminos'   ||
          subvista === 'cookies') {
        sheet.classList.add('con-privacidad');
      } else {
        sheet.classList.remove('con-privacidad', 'scroll-mas');
      }

      inyectarConFade(subvista);
    }

    function volverAlMenu() {
      if (base !== 'menu') return;

      sheet.classList.remove('subvista');
      sheet.classList.remove('con-privacidad', 'scroll-mas');
      titulo.textContent = 'Volver';

      inyectarConFade('menu');
    }

    function engancharMenu() {
      var items = content.querySelectorAll('.sheet-menu-item');
      for (var i = 0; i < items.length; i++) {
        if (items[i].dataset.bound === '1') continue;
        items[i].dataset.bound = '1';
        items[i].addEventListener('click', onItemClick);
      }
    }

    function onItemClick(e) {
      var accion = this.getAttribute('data-accion');
      if (!accion) return;

      if (accion === 'asesor') {
        haptic(10);
        setTimeout(function () { cerrar(); }, 120);
        return;
      }

      haptic(8);

      if (accion === 'terminos'    ||
          accion === 'privacidad'  ||
          accion === 'cookies'     ||
          accion === 'acerca'      ||
          accion === 'pwa') {
        navegar(accion);
        return;
      }

      console.log('[Global] acción pendiente:', accion);
    }

    function onHandleDown(e) { iniciarDrag(e, true); }
    function onContentDown(e) {
      if (content.scrollTop > 0) return;
      iniciarDrag(e, false);
    }

    function iniciarDrag(e, desdeHandle) {
      if (!abierto) return;
      if (e.button !== undefined && e.button !== 0) return;

      dragActivo = true;
      dragMoved = false;
      dragDesdeHandle = desdeHandle;
      dragPointerId = e.pointerId;
      dragStartY = e.clientY;
      dragUltimoY = e.clientY;
      dragUltimoT = performance.now();
      dragVelocidad = 0;

      if (desdeHandle) {
        handleArea.addEventListener('pointermove', onDragMove);
        handleArea.addEventListener('pointerup', onDragEnd);
        handleArea.addEventListener('pointercancel', onDragEnd);
      } else {
        content.addEventListener('pointermove', onDragMove);
        content.addEventListener('pointerup', onDragEnd);
        content.addEventListener('pointercancel', onDragEnd);
      }
    }

    function onDragMove(e) {
      if (!dragActivo) return;
      if (e.pointerId !== dragPointerId) return;

      var dy = e.clientY - dragStartY;

      if (!dragMoved) {
        if (Math.abs(dy) < UMBRAL_DRAG) return;
        dragMoved = true;
        sheet.classList.add('sin-transicion');
        if (dragDesdeHandle) {
          try { handleArea.setPointerCapture(e.pointerId); } catch (err) {}
        } else {
          if (dy < 0) { cancelarDrag(); return; }
          try { content.setPointerCapture(e.pointerId); } catch (err) {}
        }
      }

      var alturaSheet = sheet.offsetHeight;
      var pct = (dy / alturaSheet) * 100;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;

      e.preventDefault();
      sheet.style.transform = 'translateY(' + pct + '%)';

      var ahora = performance.now();
      var dt = ahora - dragUltimoT;
      if (dt > 0) {
        var v = (e.clientY - dragUltimoY) / dt;
        dragVelocidad = dragVelocidad * 0.7 + v * 0.3;
        dragUltimoY = e.clientY;
        dragUltimoT = ahora;
      }
    }

    function onDragEnd(e) {
      if (!dragActivo) return;
      if (e.pointerId !== dragPointerId) return;

      dragActivo = false;
      dragPointerId = null;

      if (!dragMoved) { limpiarListenersDrag(); return; }

      dragMoved = false;
      sheet.classList.remove('sin-transicion');

      var transform = sheet.style.transform || '';
      var match = transform.match(/translateY\(([\d.]+)%\)/);
      var pct = match ? parseFloat(match[1]) : 0;

      var destino = decidirDestino(pct);
      if (destino === 'cerrado') {
        cerrar();
      } else {

<script>

    var ATTR_CLAVE = 'data-chip';

       localStorage · lectura/escritura segura
       ============================================================ */
    function leerVista() {
      try {
        var raw = localStorage.getItem(KEY_VISTA);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        if (!obj || typeof obj !== 'object') return null;
        return { idChip: obj.idChip || null };
      } catch (_) {
        return null;
      }

      try {
        localStorage.setItem(KEY_VISTA, JSON.stringify({
          idChip: idChip || null

      } catch (_) {}
    }

       Chips disponibles · filtra los desactivados
       ============================================================ */
    function chipsDisponibles() {
      var todos = (window.SISTEMA && window.SISTEMA.chips) || [];
      return todos.filter(function (c) {
        return c && c.idChip && c.estado !== false;
      });
    }

    /* ============================================================
       Resolución de la vista a restaurar
       ============================================================ */
    function resolverVistaInicial(chips) {
      var vista = leerVista();
      if (!vista || !vista.idChip) return { idChip: null };

      var idChip = vista.idChip;
      var chipOk = false;
      for (var i = 0; i < chips.length; i++) {
        if (chips[i].idChip === idChip) { chipOk = true; break; }
      }
      if (!chipOk) return { idChip: null };
      return { idChip: idChip };
    }

       Pintar
       ============================================================ */
    function pintar() {
      var contenedor = document.getElementById('filtros');
      if (!contenedor) {
        console.warn('[Chips] No existe #filtros');
        return;
      }

      var chips = chipsDisponibles();
      if (!chips.length) {
        console.warn('[Chips] SISTEMA.chips sin entradas visibles');
        return;
      }

      var vista = resolverVistaInicial(chips);
      var idChipActivo = vista.idChip || chips[0].idChip;

      contenedor.innerHTML = '';

      chips.forEach(function (op) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = op.titulo;
        chip.setAttribute(ATTR_CLAVE, op.idChip);

        if (op.idChip === idChipActivo) chip.classList.add('activo');

        chip.addEventListener('click', function () {
          if (chip.classList.contains('activo')) return;
          activarChip(op.idChip);
        });

        contenedor.appendChild(chip);
      });

      emitirCambio(idChipActivo);
    }

    /* ============================================================
       Activar chip · fuente única del estado
       ============================================================ */
    function activarChip(idChip) {
      var contenedor = document.getElementById('filtros');

      escribirVista(idChip);
      emitirCambio(idChip);
    }

    function emitirCambio(idChip) {
      document.dispatchEvent(new CustomEvent('chips:change', {
        detail: { idChip: idChip }

    }

      if (!chip) return false;
      activarChip(catId);
      return true;
    }

    function getChipActivo() {
      var contenedor = document.getElementById('filtros');

      var chip = contenedor.querySelector('.chip.activo');

      pintar:        pintar,
      seleccionar:   seleccionar,
      getChipActivo: getChipActivo

<script>
  window.Buscar = (function () {

    var input     = null;
    var btnLupa   = null;
    var btnCerrar = null;

    var abierto = false;

    var LIMITE_INPUT = 40;

    function normalizar(s) {
      return String(s == null ? '' : s)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function emitir(termino, enLimite) {
      document.dispatchEvent(new CustomEvent('buscar:change', {
        detail: {
          termino:  termino  || '',
          enLimite: enLimite === true
        }
      }));
    }

      if (abierto) return;
      if (!wrap) return;

      abierto = true;
      wrap.classList.add('buscando');
      input.value = '';

      input.focus();

      if (document.activeElement !== input) {
        requestAnimationFrame(function () {
          if (document.activeElement !== input) input.focus();
        });

      if (!abierto) return;
      abierto = false;

      if (document.activeElement === input) input.blur();

      wrap.classList.remove('buscando');

      var postActivo = (window.Lista && typeof window.Lista.getPostActivo === 'function')

      emitir(t, enLimite);

      if (window.__buscarBound === '1') return;

      wrap      = document.querySelector('.filtros-wrap');

      var tituloCat = document.getElementById('tituloCategoria');
      if (tituloCat) {
        tituloCat.textContent = tituloHeaderDetalle(post);
        tituloCat.hidden = false;
      }

      var btnVolver = document.getElementById('btnVolver');
      if (btnVolver) btnVolver.hidden = false;

      setModo('detalle');

      /* Skeleton del detalle antes del fade. Si PostFull ya tiene
         el detalle (por la precarga), se reemplaza casi al toque. */
      mostrarSkeletonDetalle();

      lista.classList.add('fade-out');

      setTimeout(function () {
        lista.hidden = true;
        lista.classList.remove('fade-out');

        detalle.hidden = false;
        detalle.classList.add('fade-in');

        setTimeout(function () {
          detalle.classList.remove('fade-in');
        }, DURACION_FADE_MS);
      }, DURACION_FADE_MS);

      if (wrap) wrap.scrollTop = 0;

      try { history.pushState({ sv: 'detalle' }, ''); } catch (e) {}

      window.PostFull.obtener(idPost)
        .then(function (det) {
          post.seccionJson = det.seccionJson || {};
          post.planJson    = det.planJson || null;

          postActivoId = idPost;
          emitirCambio(post);
        })
        .catch(function (err) {
          console.warn('[Lista] No se pudo cargar el detalle:', err.message);
          postActivoId = idPost;
          emitirCambio(post);
        });
    }

    function cerrarDetalle(desdePopstate) {
      if (modo !== 'detalle') return;

      var lista = document.getElementById('listaWrap');
      var detalle = document.getElementById('seccionesTrack');
      if (!lista || !detalle) return;

      var btnVolver = document.getElementById('btnVolver');
      if (btnVolver) btnVolver.hidden = true;

      var tituloCat = document.getElementById('tituloCategoria');
      if (tituloCat) {
        tituloCat.textContent = '';
        tituloCat.hidden = true;
      }

      postActivoId = null;
      setModo('lista');

      var wrap = document.querySelector('.secciones-wrap');
      if (wrap) wrap.scrollTop = scrollListaPrevio;

      emitirCambio(null);

      detalle.classList.add('fade-out');

      setTimeout(function () {
        /* R19: si entre el cierre y este borrado (200 ms) se abrió
           OTRO detalle (cross-sell cambia chip/ciudad y reabre a los
           ~80 ms), el modo ya es 'detalle' de nuevo: abortar el
           borrado para no vaciar el post nuevo. */
        if (modo !== 'lista') return;

        detalle.hidden = true;
        detalle.classList.remove('fade-out');
        detalle.innerHTML = '';

        lista.hidden = false;
        lista.classList.add('fade-in');

        setTimeout(function () {
          lista.classList.remove('fade-in');
        }, DURACION_FADE_MS);
      }, DURACION_FADE_MS);

      if (!desdePopstate) {
        /* R19: marcar el popstate PROPIO de este cierre. El back()
         es asíncrono: si el usuario (o un cross-sell) reabre un
         detalle antes de que el popstate llegue, el listener de
         popstate lo confundiría con un gesto de ATRÁS y cerraría
         el post recién abierto. Con la marca se consume aquí. */
        _popstateEsperado = true;
        try { history.back(); } catch (e) {}
      }
    }

    function seleccionar(idPost) {
      var post = buscarPost(idPost);
      if (!post) return false;

      var chips = post.idChips || [];
      if (chipActivoActual && chips.indexOf(chipActivoActual) === -1 && chips.length) {
        if (window.Chips && typeof window.Chips.seleccionar === 'function') {
          window.Chips.seleccionar(chips[0]);
        }
        setTimeout(function () { abrirDetalle(idPost); }, 80);
        return true;
      }

      abrirDetalle(idPost);
      return true;
    }

    function getPostActivo() {
      if (!postActivoId) return null;
      return buscarPost(postActivoId);
    }

    function getModo() { return modo; }

    /* ============================================================
       Eventos
       ============================================================ */
    document.addEventListener('chips:change', function (e) {
      var idChip = e.detail && e.detail.idChip;
      if (modo === 'detalle') cerrarDetalle(false);
      pintar(idChip, null);
    });

    document.addEventListener('buscar:change', function (e) {
      var termino  = e.detail && e.detail.termino;
      var enLimite = e.detail && e.detail.enLimite;
      if (termino && termino.trim()) {
        pintarBusqueda(termino, enLimite);
      } else {
        pintar(chipActivoActual, null);
      }
    });

    document.addEventListener('ciudad:change', function () {
      if (modo === 'detalle') cerrarDetalle(false);

      var input = document.getElementById('buscarInput');
      var wrapBuscar = document.querySelector('.filtros-wrap.buscando');
      if (wrapBuscar && input && input.value.trim()) {
        pintarBusqueda(input.value.trim(), false);
      } else {
        pintar(chipActivoActual, null);
      }
    });

    document.addEventListener('post:solicitar', function (e) {
      var idPost = e.detail && e.detail.idPost;
      if (idPost) seleccionar(idPost);
    });

    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest && e.target.closest('#btnVolver');
      if (!btn) return;
      e.preventDefault();
      cerrarDetalle(false);
    });

    window.addEventListener('popstate', function () {
      /* R19: si este popstate es el que nosotros mismos provocamos
         con history.back() al cerrar, consumirlo SIN cerrar nada
         (el detalle activo, si lo hay, es uno NUEVO legítimo). */
      if (_popstateEsperado) {
        _popstateEsperado = false;
        return;
      }
      if (modo === 'detalle') cerrarDetalle(true);
    });

    document.body.classList.add('modo-lista');

    return {
      pintar:         pintar,
      pintarBusqueda: pintarBusqueda,
      seleccionar:    seleccionar,
      getPostActivo:  getPostActivo,
      getModo:        getModo,
      abrirDetalle:   abrirDetalle,
      cerrarDetalle:  cerrarDetalle
    };

  })();
</script>
<!--

                 · Lightbox fullscreen sobre <dialog> nativo:

<script>
  window.SeccionImagen = (function () {

    var MAX_CAPTURAS = 3;

    /* ============================================================
       HELPERS · URLs de imágenes
       ============================================================ */

    function urlImagenDirecta(url) {
      var u = String(url || '').trim();
      if (!u) return '';

      var m = u.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
      if (m && m[1]) return 'https://lh3.googleusercontent.com/d/' + m[1];

      m = u.match(/drive\.google\.com\/open\?id=([^&]+)/);
      if (m && m[1]) return 'https://lh3.googleusercontent.com/d/' + m[1];

      m = u.match(/drive\.google\.com\/uc\?.*id=([^&]+)/);
      if (m && m[1]) return 'https://lh3.googleusercontent.com/d/' + m[1];

      return u;
    }

    function capturasDePresentacion(sp) {
      var lista = [];

      if (sp && Array.isArray(sp.capturas) && sp.capturas.length) {
        lista = sp.capturas;
      } else if (sp && sp.urlCaptura) {
        lista = [sp.urlCaptura];
      }

      return lista
        .map(function (u) { return String(u || '').trim(); })
        .filter(function (u) { return !!u; })
        .slice(0, MAX_CAPTURAS);
    }

    /* ============================================================
       LIGHTBOX · visor fullscreen sobre <dialog> nativo.
       ============================================================ */
    var Lightbox = (function () {

      var ESCALA_MIN          = 1;
      var ESCALA_MAX          = 4;
      var UMBRAL_DOBLE_TAP_MS = 280;
      var UMBRAL_DOBLE_TAP_PX = 30;
      var UMBRAL_MOVIMIENTO   = 6;
      var UMBRAL_SWIPE_CERRAR = 80;
      var DURACION_CIERRE_MS  = 220;

      var dlg = null;
      var backdrop = null;
      var img = null;
      var abierto = false;

      var pointers = {};
      var pointerCount = 0;

      var escala = 1;
      var tx = 0;
      var ty = 0;

      var pinchDistIni   = 0;
      var pinchEscalaIni = 1;
      var pinchMidIniX   = 0;
      var pinchMidIniY   = 0;
      var pinchTxIni     = 0;
      var pinchTyIni     = 0;

      var panInicioX = 0;
      var panInicioY = 0;
      var panTxInicio = 0;
      var panTyInicio = 0;

      var swipeInicioY = 0;
      var swipeEnProgreso = false;

      var movimientoTotal = 0;

      var ultimoTapTiempo = 0;
      var ultimoTapX = 0;
      var ultimoTapY = 0;

      function centro() {
        return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      }

      function construir() {
        if (dlg) return;

        dlg = document.createElement('dialog');
        dlg.className = 'lightbox';
        dlg.innerHTML =
          '<div class="lightbox-backdrop"></div>' +
          '<button type="button" class="lightbox-close" aria-label="Cerrar">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="6" y1="6" x2="18" y2="18"/>' +
              '<line x1="18" y1="6" x2="6" y2="18"/>' +
            '</svg>' +
          '</button>' +
          '<img class="lightbox-img" alt="">';

        document.body.appendChild(dlg);

        backdrop = dlg.querySelector('.lightbox-backdrop');
        img      = dlg.querySelector('.lightbox-img');

        dlg.querySelector('.lightbox-close').addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          cerrar();
        });

        dlg.addEventListener('pointerdown',   onPointerDown);
        dlg.addEventListener('pointermove',   onPointerMove);
        dlg.addEventListener('pointerup',     onPointerUp);
        dlg.addEventListener('pointercancel', onPointerCancel);

        /* ESC nativo del dialog → cerrar limpiando clases */
        dlg.addEventListener('cancel', function (e) {
          e.preventDefault();
          cerrar();
        });

        window.addEventListener('resize', function () {
          if (!abierto) return;
          resetTransform();
        });
      }

      function aplicarTransform() {
        img.style.transform =
          'translate(' + tx + 'px, ' + ty + 'px) scale(' + escala + ')';
      }

      function resetTransform() {
        escala = 1;
        tx = 0;
        ty = 0;
        img.style.transform = '';
      }

      function limitarPan() {
        if (escala <= 1) {
          tx = 0;
          ty = 0;
          return;
        }
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var wEscalada = img.clientWidth  * escala;
        var hEscalada = img.clientHeight * escala;

        var maxTx = Math.max(0, (wEscalada - vw) / 2);
        var maxTy = Math.max(0, (hEscalada - vh) / 2);

        tx = Math.max(-maxTx, Math.min(maxTx, tx));
        ty = Math.max(-maxTy, Math.min(maxTy, ty));
      }

      function onPointerDown(e) {
        if (!abierto) return;

        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        pointerCount = Object.keys(pointers).length;

        if (pointerCount === 1) {
          panInicioX = e.clientX;
          panInicioY = e.clientY;
          panTxInicio = tx;
          panTyInicio = ty;

          swipeInicioY = e.clientY;
          swipeEnProgreso = false;
          movimientoTotal = 0;

        } else if (pointerCount === 2) {
          swipeEnProgreso = false;
          var ids = Object.keys(pointers);
          var p1 = pointers[ids[0]];
          var p2 = pointers[ids[1]];
          pinchDistIni   = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          pinchEscalaIni = escala;
          pinchMidIniX   = (p1.x + p2.x) / 2;
          pinchMidIniY   = (p1.y + p2.y) / 2;
          pinchTxIni     = tx;
          pinchTyIni     = ty;
        }
      }

      function onPointerMove(e) {
        if (!pointers[e.pointerId]) return;
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

        if (pointerCount === 2) {
          var ids = Object.keys(pointers);
          var p1 = pointers[ids[0]];
          var p2 = pointers[ids[1]];
          var dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          var midX = (p1.x + p2.x) / 2;
          var midY = (p1.y + p2.y) / 2;

          if (pinchDistIni > 0) {
            var factor = dist / pinchDistIni;
            var nueva  = pinchEscalaIni * factor;
            nueva = Math.max(ESCALA_MIN, Math.min(ESCALA_MAX, nueva));

            var C = centro();
            var ratio = nueva / pinchEscalaIni;

            /* Ancla el midpoint: la imagen se pellizca en el punto real */
            tx = midX - C.x - (pinchMidIniX - C.x - pinchTxIni) * ratio;
            ty = midY - C.y - (pinchMidIniY - C.y - pinchTyIni) * ratio;

            escala = nueva;
            limitarPan();
            aplicarTransform();
          }
          movimientoTotal += 20;
          return;
        }

        if (pointerCount === 1) {
          var dx = e.clientX - panInicioX;
          var dy = e.clientY - panInicioY;
          movimientoTotal = Math.max(movimientoTotal, Math.hypot(dx, dy));

          if (escala > 1) {
            tx = panTxInicio + dx;
            ty = panTyInicio + dy;
            limitarPan();
            aplicarTransform();
            return;
          }

          if (dy > 0) {
            swipeEnProgreso = true;
            var offset = Math.min(dy * 0.5, 60);
            img.style.transform = 'translate(0, ' + offset + 'px) scale(1)';
          }
        }
      }

      function onPointerUp(e) {
        if (!pointers[e.pointerId]) return;

        delete pointers[e.pointerId];
        var countAntes = pointerCount;
        pointerCount = Object.keys(pointers).length;

        if (countAntes === 2 && pointerCount === 1) {
          var ids = Object.keys(pointers);
          var resto = pointers[ids[0]];
          panInicioX = resto.x;
          panInicioY = resto.y;
          panTxInicio = tx;
          panTyInicio = ty;
          swipeEnProgreso = false;
          return;
        }

        if (pointerCount > 0) return;

        if (swipeEnProgreso && escala === 1) {
          var dy = e.clientY - swipeInicioY;
          if (dy > UMBRAL_SWIPE_CERRAR) {
            cerrar();
            return;
          }
        }

        if (swipeEnProgreso) {
          aplicarTransform();
          swipeEnProgreso = false;
        }

        if (movimientoTotal < UMBRAL_MOVIMIENTO) {
          procesarTap(e);
        }
        movimientoTotal = 0;
      }

      function onPointerCancel(e) {
        if (!pointers[e.pointerId]) return;
        delete pointers[e.pointerId];
        pointerCount = Object.keys(pointers).length;

        if (pointerCount === 1) {
          var ids = Object.keys(pointers);
          var resto = pointers[ids[0]];
          panInicioX = resto.x;
          panInicioY = resto.y;
          panTxInicio = tx;
          panTyInicio = ty;
        }
        if (pointerCount === 0) {
          if (swipeEnProgreso) {
            aplicarTransform();
            swipeEnProgreso = false;
          }
          movimientoTotal = 0;
        }
      }

      function procesarTap(e) {
        var ahora = Date.now();
        var dt = ahora - ultimoTapTiempo;
        var dx = Math.abs(e.clientX - ultimoTapX);
        var dy = Math.abs(e.clientY - ultimoTapY);

        var esDobleTap = (dt < UMBRAL_DOBLE_TAP_MS) &&
                         (dx < UMBRAL_DOBLE_TAP_PX) &&
                         (dy < UMBRAL_DOBLE_TAP_PX);

        ultimoTapTiempo = ahora;
        ultimoTapX = e.clientX;
        ultimoTapY = e.clientY;

        var esSobreImagen = (e.target === img);

        if (esDobleTap && esSobreImagen) {
          if (escala > 1) {
            resetTransform();
          } else {
            var C = centro();
            escala = 2;
            tx = C.x - e.clientX;
            ty = C.y - e.clientY;
            limitarPan();
            aplicarTransform();
          }
          ultimoTapTiempo = 0;
          return;
        }

        /* Tap en el fondo (no en la imagen) cierra */
        if (e.target === backdrop && escala === 1) {
          cerrar();
        }
      }

      function abrir(url) {
        construir();
        if (!dlg || !url) return;

        resetTransform();
        pointers = {};
        pointerCount = 0;
        swipeEnProgreso = false;
        movimientoTotal = 0;
        ultimoTapTiempo = 0;

        img.src = url;

        if (typeof dlg.showModal === 'function' && !dlg.open) {
          try { dlg.showModal(); } catch (err) { dlg.setAttribute('open', ''); }
        } else {
          dlg.setAttribute('open', '');
        }
        document.body.classList.add('lightbox-abierto');
        abierto = true;

        requestAnimationFrame(function () {
          dlg.classList.add('visible');
        });
      }

      function cerrar() {
        if (!abierto) return;
        abierto = false;

        dlg.classList.remove('visible');
        document.body.classList.remove('lightbox-abierto');

        setTimeout(function () {
          try {
            if (dlg.open) dlg.close();
            else dlg.removeAttribute('open');
          } catch (err) { dlg.removeAttribute('open'); }
          img.src = '';
          resetTransform();
        }, DURACION_CIERRE_MS);
      }

      return { abrir: abrir, cerrar: cerrar };
    })();

    /* ============================================================
       ENGANCHE · carrusel (dots) + click en imágenes
       ============================================================ */
    function enganchar(root) {
      if (!root) return;

      root.querySelectorAll('.carrusel-presentacion').forEach(function (carrusel) {
        var track = carrusel.querySelector('.carrusel-track');
        var dots  = carrusel.querySelectorAll('.carrusel-dot');
        if (!track || !dots.length) return;

        var raf = null;
        track.addEventListener('scroll', function () {
          if (raf) return;
          raf = requestAnimationFrame(function () {
            raf = null;
            var w = track.clientWidth;
            if (!w) return;
            var idx = Math.round(track.scrollLeft / w);
            dots.forEach(function (d, i) {
              d.classList.toggle('activo', i === idx);
            });
          });
        }, { passive: true });
      });

      root.querySelectorAll('.foto-sola img, .carrusel-slide img').forEach(function (img) {
        img.addEventListener('click', function () {
          var full = this.getAttribute('data-full') || this.src;
          if (full) Lightbox.abrir(full);
        });
      });
    }

    /* ============================================================
       API PÚBLICA
       ============================================================ */
    return {
      urlImagenDirecta:       urlImagenDirecta,
      capturasDePresentacion: capturasDePresentacion,
      enganchar:              enganchar
    };

  })();
</script>
