<script>
  (function() {
    function actualizarHora() {
      var ahora = new Date();
      var horas = ahora.getHours();
      var minutos = ahora.getMinutes();

      // Convertir a formato de 12 horas (1 a 12)
      horas = horas % 12;
      horas = horas ? horas : 12; // Si es 0 (medianoche), mostrar 12

      // Formatear a 2 dígitos (ej. 9:05 -> 09:05)
      horas = horas < 10 ? '0' + horas : horas;
      minutos = minutos < 10 ? '0' + minutos : minutos;

      var reloj = document.getElementById('reloj-estado');
      if (reloj) {
        reloj.textContent = horas + ':' + minutos;
      }
    }

    // Ejecutar al cargar
    actualizarHora();

    // Actualizar cada segundo para mantener la precisión
    setInterval(actualizarHora, 1000);
  })();
</script>

                </svg>
              </span>
              <input type="text" class="buscar-input" id="buscarInput"
                     placeholder="Buscar servicio, curso o palabra clave"
                     maxlength="40"
                     autocomplete="off" autocorrect="off"
                     autocapitalize="off" spellcheck="false">
              <!-- R64 · X circular naranja DENTRO del campo:
                   aparece al escribir y limpia el campo. En modo
                   compartido queda fija (libera la vista). -->
              <button type="button" class="buscar-limpiar" id="btnLimpiarCampo"
                      aria-label="Limpiar el campo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <line x1="15" y1="9" x2="9" y2="15"/>
                  <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- BOTÓN FILTRO · a la derecha del campo: círculo con
               el glifo filtro de Iconos (3 líneas con su
               deslizador, diseño del dueño). Sin handler
               todavía (el dueño lo pidió sin acción por ahora). -->
          <button type="button" class="btn-filtro" id="btnFiltro" aria-label="Filtrar">
            <span data-glifo="filtro" aria-hidden="true"></span>
          </button>

        </div>

        <!-- ============================================================
             FILA 2 (R64) · CHIPS + CIUDAD repartiéndose la fila
             en partes iguales, sin números de items.
             ============================================================ -->
        <div class="filtros-fila-dos" id="filtrosFilaDos">

          <div id="filtros" class="filtros" role="tablist" aria-label="Filtros"></div>

          <!-- BOTÓN CIUDAD · pin + nombre de la ciudad, sin
               fondo (solo el borde suave) y sin más texto que
               la ciudad. -->
          <button type="button"
                  class="city-bar"
                  id="btnCiudad"
                  disabled
                  aria-label="Cambiar ciudad">
            <span class="city-pin" data-glifo="ubicacion" aria-hidden="true"></span>
            <span class="city-txt" id="ciudadTxt">—</span>
          </button>

        </div>

        <!-- R65 · BLOQUE DE ITEMS · "Compartir lista" y el aviso
             sin resultados viven DENTRO del bloque de los items
             (scrollean con la lista): ya no son sección filtro.
             Lista_Script enciende el botón con items y le
             escribe la cantidad; Compartir_Script lleva el envío. -->
        <div class="secciones-wrap">
          <button type="button" class="btn-compartir" id="btnCompartir"
                  aria-label="Compartir lista" hidden disabled>
            Compartir lista
          </button>

          <div id="buscarVacio" class="buscar-vacio" hidden></div>

          <div class="lista-wrap" id="listaWrap"></div>
          <div class="secciones-track" id="seccionesTrack" hidden></div>
        </div>

        <div class="cta-fila">

          <!-- Duda del post · botón outline a la IZQUIERDA del CTA
               (decisión del dueño). Se muestra solo si el post
               declara meta.botonDuda con texto Y el CTA NO es modo
               WhatsApp (dos botones que abren WhatsApp no suman).
               Nunca se deshabilita. Core_Script decide
               visibilidad/texto y arma el mensaje con
               meta.mensajeDuda + {titulo}. -->
          <button type="button" class="cta-duda" hidden>Consultar</button>

          <button type="button" class="cta-reservar" aria-label="Reservar cupo">
            <span class="cta-reservar-texto">Quiero reservar mi cupo</span>
            <span class="cta-reservar-icono" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"/>
                <path d="m12 5 7 7-7 7"/>
              </svg>
            </span>
          </button>

        </div>

        <!-- R49 · Fila del partner · estilo Instagram bajo la fila
             CTA. Círculo con glifo user + punto (como la campanita
             de la promo) + nombre del partner y su eslogan como
             subtítulo. Social_Script llena textos/visibilidad con
             post:change y mantiene la MISMA acción de antes:
             abrir el Partner Sheet. Sin chevron (decisión del
             dueño: fricción con la flecha del CTA). Oculta en
             modo lista y si el post no tiene partner. -->
        <button type="button" class="user-fila" id="userFila" hidden aria-label="Sobre el partner">
          <span class="user-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="user-punto"></span>
          </span>
          <span class="user-info">
            <span class="user-nombre">Partner</span>
            <span class="user-eslogan" hidden>Eslogan</span>
          </span>
        </button>

        <div class="botones-flotantes"></div>
      </div>
    </div>
  </template>

  <script src="./js/Global_Script.js"></script>  <script src="./js/Global_Menu_Script.js"></script>  <script src="./js/Chips_Script.js"></script>  <script src="./js/Buscar_Script.js"></script>  <script src="./js/Lista_Script.js"></script>  <script src="./js/Seccion_Imagen_Script.js"></script>  <script src="./js/Seccion_Script.js"></script>  <script src="./js/Promo_Script.js"></script>  <script src="./js/Social_Script.js"></script>  <script src="./js/Comenta_Script.js"></script>  <script src="./js/Reserva_Valida_Script.js"></script>  <script src="./js/Reserva_Sheet_Script.js"></script>  <script src="./js/Reserva_OTP_Script.js"></script>  <script src="./js/Reserva_Dato_Script.js"></script>  <script src="./js/Reserva_Exito_Script.js"></script>  <script src="./js/Reserva_Script.js"></script>  <script src="./js/Partner_Sheet_Script.js"></script>  <script src="./js/Ciudad_Sheet_Script.js"></script>  <script src="./js/Compartir_Script.js"></script>  <script src="./js/Core_Script.js"></script>

  <script src="./js/GitHub_Cromo.js"></script>
</body>
</html>
