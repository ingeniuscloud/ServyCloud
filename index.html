<style>
  /* =========================================================
     CUERPO DEL IPHONE 11 — carcasa gris oscura
     Ancho: 116,58 mm · Alto: 232,39 mm
     ========================================================= */
  .phone {
    position: relative;
    width: 116.58mm;
    height: 232.39mm;
    border-radius: 16.1mm;
    padding: 3.5mm;
    background: linear-gradient(150deg,
        #565659 0%,
        #2b2b2d 20%,
        #1a1a1c 52%,
        #3f3f42 100%);
    box-shadow:
      0 35mm 63mm -16.8mm rgba(0,0,0,.85),
      0 0 0 1.4px rgba(255,255,255,.10),
      inset 0 0 0 1.4px rgba(255,255,255,.14);
    user-select: none;
  }

  .glass {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 12.6mm;
    overflow: hidden;
    background: #fff;
  }

  /* ---------- Botones laterales ---------- */
  .btn {
    position: absolute;
    width: 1.26mm;
    border-radius: 1.4mm;
    background: linear-gradient(180deg, #565659, #1a1a1c);
    box-shadow: 0 0 1.4mm rgba(0,0,0,.5);
  }
  .btn.mute   { left: -1.26mm; top: 46mm;   height: 10.8mm; }
  .btn.vol-up { left: -1.26mm; top: 69mm;   height: 18.5mm; }
  .btn.vol-dn { left: -1.26mm; top: 92mm;   height: 18.5mm; }
  .btn.power  { right: -1.26mm; top: 72.4mm; height: 30.8mm; }

  /* ---------- Notch ---------- */
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 33.6mm;
    height: 7.56mm;
    background: #000;
    border-radius: 0 0 4.76mm 4.76mm;
    z-index: 20;
  }
  .notch::before {
    content: "";
    position: absolute;
    top: 2.52mm;
    left: 50%;
    transform: translateX(-50%);
    width: 11.9mm;
    height: 1.26mm;
    border-radius: 0.7mm;
    background: #151517;
    box-shadow: inset 0 0.28mm 0.42mm rgba(255,255,255,.08);
  }
  .notch::after {
    content: "";
    position: absolute;
    top: 2.24mm;
    left: 6.3mm;
    width: 2.52mm;
    height: 2.52mm;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a4a70, #06060a 70%);
    box-shadow: inset 0 0 0.7mm #000;
  }

  /* ---------- Barra de estado — blanco ---------- */
  .status {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 12.6mm;
    padding: 4.2mm 7mm 0;
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 4.48mm;
    font-weight: 600;
    color: #000;
    z-index: 15;
    user-select: none;
  }
  .status .right {
    display: flex;
    align-items: center;
    gap: 1.68mm;
  }
  .signal { display: flex; align-items: flex-end; gap: 0.56mm; height: 3.36mm; }
  .signal i { width: 0.98mm; background: #000; border-radius: 0.28mm; }
  .signal i:nth-child(1) { height: 1.26mm; }
  .signal i:nth-child(2) { height: 1.96mm; }
  .signal i:nth-child(3) { height: 2.66mm; }
  .signal i:nth-child(4) { height: 3.36mm; opacity: .35; }

  .battery {
    position: relative;
    width: 7.7mm;
    height: 3.64mm;
    border: 0.49mm solid #000;
    border-radius: 1.12mm;
    padding: 0.42mm;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -1.12mm;
    top: 50%;
    transform: translateY(-50%);
    width: 0.7mm;
    height: 1.4mm;
    border-radius: 0 0.56mm 0.56mm 0;
    background: #000;
  }
  .battery span {
    display: block;
    height: 100%;
    width: 76%;
    border-radius: 0.7mm;
    background: #000;
  }

  /* ---------- Safari ---------- */
  .safari {
    position: absolute;
    top: 12.6mm;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  /* =========================================================
     LIENZO — contenedor físico. NO define fondo propio.
     ========================================================= */
  .lienzo {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Barra inferior de Safari — blanco ---------- */
  .safari-bottom {
    flex-shrink: 0;
    height: 22.4mm;
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 3.5mm;
    padding: 0 4.2mm 5.6mm;
    user-select: none;
  }

  .circle-btn {
    flex-shrink: 0;
    width: 9.8mm;
    height: 9.8mm;
    border-radius: 50%;
    background: #e4e4e9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #007aff;
    box-shadow: inset 0 -0.28mm 0.7mm rgba(0,0,0,.05);
  }
  .circle-btn svg {
    width: 5.6mm;
    height: 5.6mm;
    stroke: currentColor;
    fill: none;
    stroke-width: 3.36;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .url-capsule {
    flex: 1;
    height: 9.8mm;
    border-radius: 4.9mm;
    background: #e4e4e9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4.2mm;
    font-size: 4.34mm;
    color: #1c1c1e;
    letter-spacing: -0.07mm;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: inset 0 -0.28mm 0.7mm rgba(0,0,0,.05);
  }
  .url-capsule svg {
    width: 3.92mm;
    height: 3.92mm;
    margin-right: 1.68mm;
    stroke: #8e8e93;
    fill: none;
    stroke-width: 3.08;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* ---------- Home indicator ---------- */
  .home-bar {
    position: absolute;
    bottom: 1.82mm;
    left: 50%;
    transform: translateX(-50%);
    width: 44.8mm;
    height: 1.54mm;
    border-radius: 0.84mm;
    background: rgba(0,0,0,.85);
    z-index: 30;
  }
</style>
