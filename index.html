<script>
  window.Secciones = (function () {

    var postActivo = null;

    var ICONOS_BENEFICIOS = ['code', 'user', 'monitor', 'badgeCheck', 'book'];
    var ID_POST_INCOMPANY = 'EMPR-001';

    var MESES = [
      'enero','febrero','marzo','abril','mayo','junio',
      'julio','agosto','septiembre','octubre','noviembre','diciembre'
    ];

    /* ============================================================
       Helpers generales
       ============================================================ */
    function haptic(v) {
      if (navigator.vibrate) { try { navigator.vibrate(v); } catch (e) {} }
    }

    function sumarCupos(post) {
      if (!post || !post.planJson || !post.planJson.planes) return null;
      var total = 0;
      post.planJson.planes.forEach(function (p) {
        total += Number(p.cupoLibre || 0);
      });
      return total;
    }

    function buscarPartner(idPartner) {
      if (!idPartner) return null;
      var partners = (window.TABLAS && window.TABLAS.partners) || [];
      for (var i = 0; i < partners.length; i++) {
        if (partners[i].id === idPartner) return partners[i];
      }
      return null;
    }

    function buscarPost(idPost) {
      var posts = (window.TABLAS && window.TABLAS.posts) || [];
      for (var i = 0; i < posts.length; i++) {
        if (posts[i].id === idPost) return posts[i];
      }
      return null;
    }

    function marcaDePartner(partner) {
      if (!partner) return '';
      var marca = String(partner.marca || '').trim();
      if (marca) return marca;
      return String(partner.nombre || '').trim();
    }

    /* B6 · R10: escapado HTML para todo el contenido que viene
       de la hoja. Mismo patrón que Comenta/Ciudad/Partner/Reserva. */
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    function formatearDias(dias) {
      if (!dias || !dias.length) return '';
      return dias.join(' · ');
    }

    function formatearFecha(iso) {
      if (!iso || typeof iso !== 'string') return iso || '';
      var partes = iso.split('-');
      if (partes.length !== 3) return iso;
      var dia = parseInt(partes[2], 10);
      var mes = parseInt(partes[1], 10) - 1;
      if (isNaN(dia) || isNaN(mes) || !MESES[mes]) return iso;
      return dia + ' de ' + MESES[mes];
    }

    function formatearBs(n) {
      var v = Number(n);
      if (!isFinite(v)) return '';
      var s = v.toFixed(2).replace('.', ',');
      var partes = s.split(',');
      partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return partes.join(',');
    }

    function limpiarFechaTasa(s) {
      return String(s || '')
        .replace(/,/g, '')
        .replace(/\s+\d{4}\s*$/, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    /* ============================================================
       1 · PRESENTACIÓN
       ============================================================ */
    function _buildCarruselPresentacion(capturas) {
      var html = '<div class="carrusel-presentacion">';

      html +=   '<div class="carrusel-track">';
      capturas.forEach(function (u) {
        var src = escapeHtml(window.SeccionImagen.urlImagenDirecta(u));
        html += '<div class="carrusel-slide">';
        html +=   '<img src="' + src + '" alt="" ' +
                       'loading="lazy" decoding="async" ' +
                       'data-full="' + src + '">';
        html += '</div>';
      });
      html +=   '</div>';

      html +=   '<div class="carrusel-dots">';
      capturas.forEach(function (_, i) {
        html += '<span class="carrusel-dot' +
                (i === 0 ? ' activo' : '') +
                '"></span>';
      });
      html +=   '</div>';

      html += '</div>';
      return html;
    }

    function _buildFotoSolaPresentacion(capturas) {
      var src = escapeHtml(window.SeccionImagen.urlImagenDirecta(capturas[0]));
      return '<div class="foto-sola">' +
               '<img src="' + src + '" alt="" ' +
                    'loading="lazy" decoding="async" ' +
                    'data-full="' + src + '">' +
             '</div>';
    }

    function buildPresentacion() {
      var post = postActivo;
      if (!post) return '';

      var sj = post.seccionJson || {};
      var sp = sj.seccionPresentacion || {};
      var meta = sj.meta || {};

      var partner = buscarPartner(post.idPartner);
      var marcaPartner = marcaDePartner(partner);

      /* Imagen · solo si existe */
      var capturas = window.SeccionImagen.capturasDePresentacion(sp);
      var bloqueImagen = '';
      if (capturas.length === 1) {
        bloqueImagen = _buildFotoSolaPresentacion(capturas);
      } else if (capturas.length > 1) {
        bloqueImagen = _buildCarruselPresentacion(capturas);
      }

      /* Cupos */
      var cuposHTML = '';
      var cuposMinimo = Number(meta.cuposMinimo || 0);
      var total = sumarCupos(post);
      if (cuposMinimo > 0 && total !== null) {
        if (total === 0) {
          cuposHTML = '<div class="cupos-hint agotado">Cupos agotados</div>';
        } else if (total <= cuposMinimo) {
          cuposHTML = '<div class="cupos-hint alerta">¡Últimos ' + total + ' cupos disponibles!</div>';
        }
      }

      var html = '';

      if (bloqueImagen) {
        html += '<div class="bloque-imagenes">' + bloqueImagen + '</div>';
      }

      html += '<div class="bloque-texto">';
      if (marcaPartner) {
        html += '<div class="post-marca">' +
                  '<span class="check">✓</span>' +
                  escapeHtml(marcaPartner) +
                '</div>';
      }
      html +=   '<h2 class="post-nombre">' + escapeHtml(sp.titulo || '') + '</h2>';
      if (sp.tagline) {
        html += '<div class="post-tagline">' + escapeHtml(sp.tagline) + '</div>';
      }
      html +=   cuposHTML;
      html += '</div>';

      if (sp.descripcion) {
        html += '<div class="bloque-descripcion">' +
                  '<p class="t-body post-descripcion">' + escapeHtml(sp.descripcion) + '</p>' +
                '</div>';
      }

      return html;
    }

    /* ============================================================
       2 · CONTENIDO (temario)
       ============================================================ */
    function buildContenido() {
      var post = postActivo;
      if (!post) return '';

      var s = (post.seccionJson || {}).seccionContenido || {};
      var items = s.items || [];
      if (!s.titulo && items.length === 0) return '';

      var html = '';
      if (s.titulo) {
        html += '<h2 class="t-seccion">' + escapeHtml(s.titulo) + '</h2>';
      }

      items.forEach(function (it) {
        html += '<div class="fase">';
        html +=   '<span class="fase-num">' + escapeHtml(it.num || '') + '</span>';
        html +=   '<div class="fase-text">';
        if (it.titulo) {
          html += '<span class="t-sub">' + escapeHtml(it.titulo) + '</span>';
        }
        html +=   '<span class="t-body">' + escapeHtml(it.descripcion || '') + '</span>';
        html +=   '</div>';
        html += '</div>';
      });

      return html;
    }

    /* ============================================================
       3 · VALOR (beneficios)
       ============================================================ */
    function buildValor() {
      var post = postActivo;
      if (!post) return '';

      var s = (post.seccionJson || {}).seccionValor || {};
      var items = s.beneficios || [];
      if (!s.titulo && items.length === 0) return '';

      var html = '';
      if (s.titulo) {
        html += '<h2 class="t-seccion">' + escapeHtml(s.titulo) + '</h2>';
      }
      html += '<ul class="icon-list">';
      items.forEach(function (item, i) {
        var icono = item.icono || ICONOS_BENEFICIOS[i % ICONOS_BENEFICIOS.length];
        html += '<li class="icon-list-item">';
        html +=   '<span class="icon-list-icon" data-glifo="' + escapeHtml(icono) + '"></span>';
        html +=   '<div class="icon-list-text">';
        html +=     '<span class="t-sub">' + escapeHtml(item.titulo || '') + '</span>';
        html +=     '<span class="t-body">' + escapeHtml(item.desc || item.descripcion || '') + '</span>';
        html +=   '</div>';
        html += '</li>';
      });
      html += '</ul>';
      return html;
    }

    /* ============================================================
       4 · PLANES
       ============================================================ */
    function buildTurnoCard(plan, moneda, cuposMinimo) {
      var cupo = Number(plan.cupoLibre || 0);
      var claseBadge = (cuposMinimo > 0 && cupo <= cuposMinimo) ? 'alerta' : 'normal';

      var dias = formatearDias(plan.turno && plan.turno.dias);
      var horario = (plan.turno && plan.turno.textoMostrar) || '';

      var html = '<div class="turno-card">';

      html += '<div class="turno-card-head">';
      html +=   '<span class="turno-card-icon" data-glifo="calendario"></span>';
      html +=   '<span class="turno-card-title">' + escapeHtml(dias) + '</span>';
      if (cupo > 0) {
        html += '<span class="turno-card-badge ' + claseBadge + '">' + cupo + ' cupos</span>';
      }
      html += '</div>';

      if (horario) {
        html += '<p class="turno-card-sub">' + escapeHtml(horario) + '</p>';
      }

      var pagos = plan.fechasPago || [];
      pagos.forEach(function (fp, i) {
        var destacado = (i === 0) ? ' destacado' : '';
        var label = fp.concepto || '';
        if (fp.fechaPago) label += ' (' + formatearFecha(fp.fechaPago) + ')';
        var monto = fp.monto ? (fp.monto + ' ' + (moneda || '')) : '';
        html += '<div class="turno-inv-row' + destacado + '">';
        html +=   '<span class="turno-inv-concepto">' + escapeHtml(label) + '</span>';
        if (monto) {
          html += '<span class="turno-inv-monto">' + escapeHtml(monto) + '</span>';
        }
        html += '</div>';
      });

      html += '</div>';
      return html;
    }

    function buildAvisoPronto() {
      return '' +
        '<div class="aviso-pronto">' +
          '<span class="aviso-pronto-icono" data-glifo="reloj"></span>' +
          '<div class="aviso-pronto-texto">' +
            '<span class="aviso-pronto-titulo">Este contenido estará disponible próximamente</span>' +
            '<span class="aviso-pronto-sub">Estamos afinando los últimos detalles. Puedes seguir explorando el temario mientras tanto.</span>' +
          '</div>' +
        '</div>';
    }

    function buildPlanes() {
      var post = postActivo;
      if (!post) return '';

      var sj = post.seccionJson || {};
      var s = sj.seccionPlanes || {};
      var meta = sj.meta || {};

      if (!s.titulo) return '';

      var plan = post.planJson || {};
      var estado = post.estado || 'activo';
      var esPronto = (estado === 'pronto');

      var html = '';
      html += '<h2 class="t-seccion">' + escapeHtml(s.titulo) + '</h2>';

      if (esPronto) {
        html += buildAvisoPronto();
      } else {
        if (s.mensaje) {
          html += '<p class="t-body" style="margin:0 0 20px;">' + escapeHtml(s.mensaje) + '</p>';
        }

        var root  = (window.SISTEMA && window.SISTEMA.root) || {};
        var tasas = root.tasas || {};
        if (tasas.dolar) {
          html += '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 0 14px; color:var(--post-color, #475569);">' +
                    '<span class="t-body" style="color:inherit;">Tasa BCV ' +
                      escapeHtml(limpiarFechaTasa(tasas.fechavalor)) +
                    '</span>' +
                    '<span class="t-body" style="color:inherit;">Bs. ' +
                      formatearBs(tasas.dolar) +
                    '</span>' +
                  '</div>';
        }

        var cuposMinimo = Number(meta.cuposMinimo || 0);
        if (plan.planes && plan.planes.length > 0) {
          plan.planes.forEach(function (p) {
            html += buildTurnoCard(p, plan.moneda, cuposMinimo);
          });
        }
      }

      return html;
    }

    /* ============================================================
       5 · CROSS-SELL
       AHORA lee del índice liviano (TABLAS.posts).
       Campos planos: titulo, boton, colorOficial.
       ============================================================ */
    function buildCrossSellHTML(ids, titulo) {
      if (!ids || !ids.length) return '';

      var html = '<div class="cross-sell">';
      if (titulo) {
        html += '<h2 class="t-seccion cross-sell-titulo">' + escapeHtml(titulo) + '</h2>';
      }
      html +=   '<div class="cross-sell-lista">';

      ids.forEach(function (id) {
        var p = buscarPost(id);
        if (!p) return;

        var nombre  = p.boton || p.titulo || p.id;
        var inicial = (nombre.charAt(0) || '?').toUpperCase();
        var color   = p.colorOficial || '#475569';

        html += '<button type="button" class="cross-mini" data-post-solicitado="' + escapeHtml(p.id) + '">';
        html +=   '<span class="cm-icon" style="color:' + escapeHtml(color) + '; border-color:' + escapeHtml(color) + ';">' + escapeHtml(inicial) + '</span>';
        html +=   '<span class="cm-nombre">' + escapeHtml(nombre) + '</span>';
        html += '</button>';
      });

      html +=   '</div>';
      html += '</div>';
      return html;
    }

    function buildInCompanyButton() {
      return '' +
        '<button type="button" class="cross-incompany" data-post-incompany="' + ID_POST_INCOMPANY + '">' +
          '<div class="ci-info">' +
            '<span class="ci-titulo">¿Buscas capacitar a todo tu equipo?</span>' +
            '<span class="ci-cta">Conoce In Company</span>' +
          '</div>' +
          '<span class="ci-boton" aria-hidden="true">' +
            '<span data-glifo="flecha"></span>' +
          '</span>' +
        '</button>';
    }

    function buildBloqueAsesor() {
      return '' +
        '<button type="button" class="bloque-asesor" id="bloqueAsesor">' +
          '<span class="bloque-asesor-icono" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24">' +
              '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>' +
              '<circle cx="9" cy="7" r="4"/>' +
              '<line x1="20" y1="8" x2="20" y2="14"/>' +
              '<line x1="23" y1="11" x2="17" y2="11"/>' +
            '</svg>' +
          '</span>' +
          '<span class="bloque-asesor-info">' +
            '<span class="bloque-asesor-titulo">¿Ofreces algún servicio?</span>' +
            '<span class="bloque-asesor-sub">Publícalo con nosotros y llega a más personas</span>' +
          '</span>' +
          '<span class="bloque-asesor-flecha" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24">' +
              '<path d="M5 12h14"/>' +
              '<path d="m12 5 7 7-7 7"/>' +
            '</svg>' +
          '</span>' +
        '</button>';
    }

    function buildCrossSell() {
      var post = postActivo;
      if (!post) return '';

      var s = (post.seccionJson || {}).seccionCrossSell || {};
      var html = '';

      html += buildCrossSellHTML(s.crossSellJson, s.titulo);

      if (s.inCompany === true) {
        html += buildInCompanyButton();
      }

      var esServicio = (post.idChips || []).indexOf('se') !== -1;
      if (esServicio) {
        html += buildBloqueAsesor();
      }

      return html;
    }

    /* ============================================================
       Render · arma las 5 secciones en orden fijo
       ============================================================ */
    function pintarVistas() {
      var track = document.getElementById('seccionesTrack');
      if (!track) return;

      if (!postActivo) {
        track.innerHTML = '';
        return;
      }

      track.innerHTML = '';

      var secciones = [
        { clave: 'presentacion', clase: 'vista-presentacion', builder: buildPresentacion },
        { clave: 'contenido',    clase: 'vista-temario',      builder: buildContenido },
        { clave: 'valor',        clase: 'vista-beneficios',   builder: buildValor },
        { clave: 'planes',       clase: 'vista-cierre',       builder: buildPlanes },
        { clave: 'crossSell',    clase: 'vista-cierre',       builder: buildCrossSell }
      ];

      secciones.forEach(function (def) {
        var contenido = def.builder();
        if (!contenido) return;

        var seccion = document.createElement('section');
        seccion.className = 'seccion ' + def.clase;
        seccion.dataset.seccion = def.clave;

        var vista = document.createElement('div');
        vista.className = 'vista-contenido';
        vista.innerHTML = contenido;
        seccion.appendChild(vista);

        track.appendChild(seccion);
      });

      if (typeof window.pintarGlifos === 'function') {
        window.pintarGlifos(track);
      }

      window.SeccionImagen.enganchar(track);
      engacharCrossSell(track);
      engacharInCompany(track);
      engacharBloqueAsesor(track);
    }

    /* ============================================================
       Navegación cross-post
       ============================================================ */
    function irAPost(idPost) {
      var post = buscarPost(idPost);
      if (!post) return;

      var chips = post.idChips || [];
      if (chips.length === 0) {
        console.warn('[Secciones] Post sin idChips:', idPost);
        return;
      }

      /* ==========================================================
         R19 · CIUDAD: si el post NO pertenece a la ciudad activa,
         se cambia también la ciudad (antes solo cambiaba el chip).
         Se usa la API pública existente (R10): Ciudad.getActual /
         getLista / aplicarGuardada — que emite 'ciudad:change' y
         refresca la píldora y la lista sin recargar nada.
         ========================================================== */
      var cambioCiudad = false;
      try {
        if (window.Ciudad && typeof window.Ciudad.getActual === 'function' &&
            typeof window.Ciudad.getLista === 'function' &&
            typeof window.Ciudad.aplicarGuardada === 'function') {
          var ciudadActual = window.Ciudad.getActual();
          var idCiudadActual = ciudadActual ? ciudadActual.idCiudad : null;
          var ciudadesPost = post.idCiudad || [];
          var yaPertenece = !!idCiudadActual &&
                            ciudadesPost.indexOf(idCiudadActual) !== -1;
          if (!yaPertenece) {
            var disponibles = window.Ciudad.getLista();
            for (var ci = 0; ci < ciudadesPost.length && !cambioCiudad; ci++) {
              for (var cd = 0; cd < disponibles.length; cd++) {
                if (disponibles[cd].idCiudad === ciudadesPost[ci]) {
                  window.Ciudad.aplicarGuardada(disponibles[cd]);
                  cambioCiudad = true;
                  break;
                }
              }
            }
          }
        }
      } catch (e) {
        console.warn('[Secciones] Cambio de ciudad cross-post falló:', e && e.message);
      }

      var chipActivo = (window.Chips && typeof window.Chips.getChipActivo === 'function')
        ? window.Chips.getChipActivo()
        : null;

      var enMismoChip = (chipActivo && chips.indexOf(chipActivo) !== -1);

      /* R19: si cambió la ciudad, diferir SIEMPRE la apertura (80 ms,
         mismo carril del cambio de chip): el cierre del detalle
         anterior (eventos de 'ciudad:change') corre primero y el
         post nuevo abre sobre la lista ya re-filtrada. */
      if (enMismoChip && !cambioCiudad) {
        document.dispatchEvent(new CustomEvent('post:solicitar', {
          detail: { idPost: idPost }
        }));
        return;
      }

      if (!enMismoChip && window.Chips &&
          typeof window.Chips.seleccionar === 'function') {
        window.Chips.seleccionar(chips[0]);
      }

      setTimeout(function () {
        document.dispatchEvent(new CustomEvent('post:solicitar', {
          detail: { idPost: idPost }
        }));
      }, 80);
    }

    function engacharCrossSell(root) {
      var botones = root.querySelectorAll('.cross-mini[data-post-solicitado]');
      for (var i = 0; i < botones.length; i++) {
        botones[i].addEventListener('click', function () {
          var idPost = this.getAttribute('data-post-solicitado');
          if (idPost) irAPost(idPost);
        });
      }
    }

    function engacharInCompany(root) {
      var botones = root.querySelectorAll('.cross-incompany[data-post-incompany]');
      for (var i = 0; i < botones.length; i++) {
        botones[i].addEventListener('click', function () {
          var idPost = this.getAttribute('data-post-incompany');
          if (idPost) irAPost(idPost);
        });
      }
    }

    function engacharBloqueAsesor(root) {
      var btn = root.querySelector('#bloqueAsesor');
      if (!btn) return;

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        haptic(10);

        var root_  = (window.SISTEMA && window.SISTEMA.root) || {};
        var admin_ = root_.admin || {};
        var numero  = String(admin_.whatsapp || '').trim();
        var mensaje = String(admin_.mensajeWhatsapp || '').trim();

        if (!numero) return;

        if (typeof window.abrirWhatsapp === 'function') {
          window.abrirWhatsapp(numero, mensaje);
        }
      });
    }

    function irAInicio() {
      var wrap = document.querySelector('.secciones-wrap');
      if (!wrap) return;
      wrap.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function pintar() { pintarVistas(); }

    document.addEventListener('post:change', function (e) {
      postActivo = e.detail ? e.detail.post : null;
      pintarVistas();
      irAInicio();
    });

    return {
      pintar:    pintar,
      irAInicio: irAInicio
    };

  })();
</script>
<!--

                 del scroll en modo lista. Se oculta en modo
                 detalle y cuando la ciudad no tiene promos
                 vigentes.
                 Lee SISTEMA.promo.porCiudad[ciudadActiva],
                 filtra por fecha (inicia <= hoy <= termina) y por
                 estado del post (solo activo). Monta las que
                 pasan el filtro en un track horizontal con snap.
                 Auto-avance cada autoAvanceSeg. Swipe manual.
                 Pausa al tocar, al arrastrar y cuando el tab no
                 está visible. Respeta prefers-reduced-motion.

CAMBIOS:         R12: Capa 1 GA4. promo_click en el toque de una
                 promo (antes de irAPost) y promo_swipe cuando el
                 usuario arrastra el track (solo con el dedo
                 puesto: el avance automático no cuenta, ni
                 tampoco el cambio de dot programático), con
                 debounce de 800ms. Sin envoltorio: no-op.
                 R10: blindaje B6. El contenido de la hoja que pinta
                 cada item de promo (titulo, badge, texto, marca,
                 color del badge e inicial) se interpola escapado
                 con escapeHtml(). Hoy es texto plano (cotejado
                 R10): render idéntico.
                 R9: versión de producción del dueño. La promo deja de
                 depender del backend: el índice ya no trae
                 promoTexto/promoPrioridad ni hay rotación
                 calculada en el servidor. Ahora lee el PROMOJSON
                 crudo (SISTEMA.promo), filtra vigencia por fechas
                 (inicia/termina) y estado activo del post EN EL
                 CLIENTE, y monta un carrusel (track + snap + dots,
                 auto-avance con pausa por interacción y
                 visibilidad).
                 R6: baseline de producción incorporado al espejo;
                 encabezado normalizado al estándar ═══ (6 campos).
DEPENDENCIAS:    Index.html (SISTEMA.promo, SISTEMA.badges, #promoSlot),
                 Ciudad_Sheet_Script.html (getActual),
                 Chips_Script.html (getChipActivo, seleccionar),
                 Iconos.html (pintarGlifos), Promo_CSS.html,
                 Lista_CSS.html (clases .lista-item compartidas)

-->

<script>
  window.Promo = (function () {

    var timer = null;
    var track = null;
    var dots = [];
    var items = [];
    var idxActual = 0;
    var pausadoPorInteraccion = false;
    var reducedMotion = false;
    var visibilityHandler = null;

    function haptic(v) {
      if (navigator.vibrate) { try { navigator.vibrate(v); } catch (e) {} }
    }

    function buscarPost(idPost) {
      var posts = (window.TABLAS && window.TABLAS.posts) || [];
      for (var i = 0; i < posts.length; i++) {
        if (posts[i].id === idPost) return posts[i];
      }
      return null;
    }

    function buscarPartner(idPartner) {
      if (!idPartner) return null;
      var partners = (window.TABLAS && window.TABLAS.partners) || [];
      for (var i = 0; i < partners.length; i++) {
        if (partners[i].id === idPartner) return partners[i];
      }
      return null;
    }

    function buscarBadge(idBadge) {
      if (!idBadge) return null;
      var badges = (window.SISTEMA && window.SISTEMA.badges) || [];
      for (var i = 0; i < badges.length; i++) {
        if (badges[i].idBadge === idBadge) {
          if (badges[i].estado === false) return null;
          return badges[i];
        }
      }
      return null;
    }

    function hoyISO() {
      var d = new Date();
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var dd = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + dd;
    }

    function estaVigente(item) {
      var hoy = hoyISO();
      if (item.inicia && item.inicia > hoy) return false;
      if (item.termina && item.termina < hoy) return false;
      return true;
    }

    function ciudadActiva() {
      if (window.Ciudad && typeof window.Ciudad.getActual === 'function') {
        var c = window.Ciudad.getActual();
        return c ? c.idCiudad : null;
      }
      return null;
    }

    function irAPost(idPost) {
      var post = buscarPost(idPost);
      if (!post) return;

      var chipActivo = (window.Chips && typeof window.Chips.getChipActivo === 'function')
        ? window.Chips.getChipActivo()
        : null;

      var chips = post.idChips || [];
      var enMismoChip = (chipActivo && chips.indexOf(chipActivo) !== -1);

      if (enMismoChip || chips.length === 0) {
        if (chips.length === 0) return;
        document.dispatchEvent(new CustomEvent('post:solicitar', {
          detail: { idPost: idPost }
        }));
        return;
      }

      if (window.Chips && typeof window.Chips.seleccionar === 'function') {
        window.Chips.seleccionar(chips[0]);
        setTimeout(function () {
          document.dispatchEvent(new CustomEvent('post:solicitar', {
            detail: { idPost: idPost }
          }));
        }, 80);
      } else {
        document.dispatchEvent(new CustomEvent('post:solicitar', {
          detail: { idPost: idPost }
        }));
      }
    }

    /* ============================================================
       Construcción del item
       ============================================================ */
    /* B6 · R10: escapado HTML para todo el contenido que viene
       de la hoja. Mismo patrón que Comenta/Ciudad/Partner/Reserva. */
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    function buildItemHTML(item, post) {
      var titulo = escapeHtml(post.titulo || post.boton || post.id);
      var badge  = buscarBadge(post.idBadge);
      var partner = buscarPartner(post.idPartner) || {};
      var marca = escapeHtml(String(partner.marca || partner.nombre || '').trim());

      var html = '';
      html += '<span class="promo-campana" data-glifo="campana" aria-hidden="true"></span>';
      html += '<span class="body">';
      html +=   '<span class="fila-titulo">';
      html +=     '<span class="titulo">' + titulo + '</span>';
      if (badge && badge.titulo) {
        var bColor = badge.colorTextoBorde || '#475569';
        html += '<span class="badge" style="color:' + escapeHtml(bColor) + ';">' + escapeHtml(badge.titulo) + '</span>';
      }
      html +=   '</span>';
      html +=   '<span class="tagline">' + escapeHtml(item.texto) + '</span>';
      if (marca) {
        html += '<span class="marca">' +
                  '<span class="check">✓</span>' +
                  '<span class="marca-texto">' + marca + '</span>' +
                '</span>';
      }
      html += '</span>';
      html += '<span class="flecha">›</span>';

      return html;
    }

    /* ============================================================
       Control del carrusel
       ============================================================ */
    function irA(indice, suave) {
      if (!track) return;
      var ancho = track.clientWidth;
      if (!ancho) return;
      track.scrollTo({
        left: indice * ancho,
        behavior: suave === false ? 'auto' : 'smooth'
      });
    }

    function actualizarDots() {
      if (!track || !dots.length) return;
      var ancho = track.clientWidth;
      if (!ancho) return;
      var idx = Math.round(track.scrollLeft / ancho);
      if (idx < 0) idx = 0;
      if (idx >= dots.length) idx = dots.length - 1;
      dots.forEach(function (d, i) {
        d.classList.toggle('activo', i === idx);
      });
      idxActual = idx;
    }

    function avanzar() {
      if (pausadoPorInteraccion) return;
      if (document.visibilityState !== 'visible') return;
      if (items.length <= 1) return;

      var siguiente = (idxActual + 1) % items.length;
      irA(siguiente, true);
    }

    function arrancarTimer() {
      detenerTimer();
      if (reducedMotion) return;
      if (items.length <= 1) return;

      var seg = Number((window.SISTEMA.promo && window.SISTEMA.promo.autoAvanceSeg) || 7);
      if (seg < 3) seg = 7;

      timer = setInterval(avanzar, seg * 1000);
    }

    function detenerTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    function reiniciarTimer() {
      if (reducedMotion || items.length <= 1) return;
      detenerTimer();
      arrancarTimer();
    }

    /* ============================================================
       Construir el carrusel completo
       ============================================================ */
    function construir() {
      detenerTimer();

      var slot = document.getElementById('promoSlot');
      if (!slot) return;

      slot.innerHTML = '';
      slot.hidden = true;

      var promo = window.SISTEMA && window.SISTEMA.promo;
      if (!promo || promo.activo === false) return;

      var ciudad = ciudadActiva();
      if (!ciudad) return;

      var pool = (promo.porCiudad && promo.porCiudad[ciudad]) || [];
      if (!pool.length) return;

      /* Filtrar por fecha + estado del post */
      var vigentes = [];
      pool.forEach(function (item) {
        if (!item || !item.idPost) return;
        if (!estaVigente(item)) return;
        var post = buscarPost(item.idPost);
        if (!post) return;
        if (post.estado !== 'activo') return;
        vigentes.push({ item: item, post: post });
      });

      if (!vigentes.length) return;

      /* Construir track */
      var trackEl = document.createElement('div');
      trackEl.className = 'promo-track';

      vigentes.forEach(function (par, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lista-item promo-item';
        btn.setAttribute('data-post', par.post.id);
        btn.setAttribute('aria-label', 'Promoción · ' + (par.post.titulo || par.post.id));
        btn.innerHTML = buildItemHTML(par.item, par.post);
        btn.addEventListener('click', function () {
          haptic(10);
          /* GA4 (R12): toque del usuario en una promo */
          if (window.Analitica) {
            window.Analitica.enviar('promo_click', {
              post_id: par.post.id,
              city_id: ciudadActiva()
            });
          }
          irAPost(par.post.id);
        });
        trackEl.appendChild(btn);
      });

      /* Dots · solo si hay más de uno */
      if (vigentes.length > 1) {
        var dotsEl = document.createElement('div');
        dotsEl.className = 'promo-dots';
        for (var i = 0; i < vigentes.length; i++) {
          var dot = document.createElement('span');
          dot.className = 'promo-dot' + (i === 0 ? ' activo' : '');
          dotsEl.appendChild(dot);
        }
        slot.appendChild(trackEl);
        slot.appendChild(dotsEl);
      } else {
        slot.appendChild(trackEl);
      }

      slot.hidden = false;

      if (typeof window.pintarGlifos === 'function') {
        window.pintarGlifos(slot);
      }

      /* Refs y estado */
      track = trackEl;
      dots = slot.querySelectorAll('.promo-dot');
      items = vigentes;
      idxActual = 0;
      pausadoPorInteraccion = false;
      track.scrollLeft = 0;

      /* Reduced motion */
      try {
        reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (_) {
        reducedMotion = false;
      }

      /* Scroll listener · actualizar dots al scroll */
      var raf = null;

      /* GA4 (R12): promo_swipe SOLO cuando el usuario arrastra
         (hay pointer activo). El scroll del avance automático no
         viene de un toque y no dispara. Debounce 800ms. */
      var tocaUsuario = false;
      var _swipeTimer = null;

      track.addEventListener('scroll', function () {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          raf = null;
          actualizarDots();

          if (tocaUsuario && window.Analitica) {
            if (_swipeTimer) clearTimeout(_swipeTimer);
            _swipeTimer = setTimeout(function () {
              var par = items[idxActual];
              if (par && par.post && par.post.id) {
                window.Analitica.enviar('promo_swipe', {
                  post_id: par.post.id,
                  city_id: ciudadActiva()
                });
              }
            }, 800);
          }
        });
      }, { passive: true });

      /* Pausa al tocar / arrastrar */
      track.addEventListener('pointerdown', function () {
        tocaUsuario = true;
        pausadoPorInteraccion = true;
        detenerTimer();
      });
      track.addEventListener('pointerup', function () {
        tocaUsuario = false;
        pausadoPorInteraccion = false;
        reiniciarTimer();
      });
      track.addEventListener('pointercancel', function () {
        tocaUsuario = false;
        pausadoPorInteraccion = false;
        reiniciarTimer();
      });

      /* Pausa cuando el tab no está visible */
      if (!visibilityHandler) {
        visibilityHandler = function () {
          if (document.visibilityState === 'visible') {
            reiniciarTimer();
          } else {
            detenerTimer();
          }
        };
        document.addEventListener('visibilitychange', visibilityHandler);
      }

      /* Arrancar */
      arrancarTimer();
    }

    return { construir: construir };

  })();
</script>

ARCHIVO:         Social_Script.html
PROYECTO:        INGeniusCloud | ServyCloud
RESPONSABILIDAD: Botones flotantes laterales. El contador de
                 compartir solo incrementa cuando el share nativo
                 resuelve (no en cancelación). Fallback WhatsApp
                 también cuenta. El botón Partner abre el bottom
                 sheet dedicado.
                 Key localStorage: post_likes.
VERSIÓN:         1.1
CAMBIOS:         R12: Capa 1 GA4. like se mide SOLO aquí (frontend)
                 cuando el usuario da un like NUEVO (quitar like no
                 dispara; sin doble conteo con el backend).
                 R5: baseline de producción incorporado al espejo;
                 encabezado normalizado al estándar ═══ (6 campos).
DEPENDENCIAS:    Global_Script.html (postBackend, getDeviceId),
                 Index.html (SISTEMA, TABLAS), Iconos.html
                 (pintarGlifos), Comenta_Script.html
                 (window.Comentarios), Partner_Sheet_Script.html
                 (window.PartnerSheet), Lista_Script.html
                 (window.Lista), Social_CSS.html
════════════════════════════════════════════════════════════════════
-->

<script>
  window.Social = (function () {

    var STORAGE_KEY_LIKES = 'post_likes';

    var postActivoObj = null;

    function haptic(v) {
      if (navigator.vibrate) {
        try { navigator.vibrate(v); } catch (e) {}
      }
    }

    function getLikes() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY_LIKES) || '[]'); }
      catch (_) { return []; }
    }
    function setLikes(arr) {
      try { localStorage.setItem(STORAGE_KEY_LIKES, JSON.stringify(arr)); } catch (_) {}
    }
    function postTieneLike(id) {
      return getLikes().indexOf(id) !== -1;
    }

    function buscarPartner(idPartner) {
      if (!idPartner) return null;
      var partners = (window.TABLAS && window.TABLAS.partners) || [];
      for (var i = 0; i < partners.length; i++) {
        if (partners[i].id === idPartner) return partners[i];
      }
      return null;
    }

    function urlApp() {
      try {
        var root = (window.SISTEMA && window.SISTEMA.root) || {};
        var app  = root.app || {};
        return String(app.urlApp || '').trim();
      } catch (_) {
        return '';
      }
    }

    /* ============================================================
       Pintar
       ============================================================ */
    function pintar() {
      var contenedor = document.querySelector('.botones-flotantes');
      if (!contenedor) return;

      contenedor.style.color = '#475569';
      contenedor.innerHTML = '';

      var btnLike = document.createElement('button');
      btnLike.type = 'button';
      btnLike.id = 'btnLikeFlotante';
      btnLike.className = 'btn-flotante';
      btnLike.setAttribute('aria-label', 'Me gusta');
      btnLike.setAttribute('data-glifo', 'like');
      contenedor.appendChild(btnLike);

      var likes = document.createElement('span');
      likes.className = 'likes-flotante';
      likes.id = 'likesFlotante';
      likes.textContent = '0';
      contenedor.appendChild(likes);

      var btnComment = document.createElement('button');
      btnComment.type = 'button';
      btnComment.id = 'btnCommentFlotante';
      btnComment.className = 'btn-flotante';
      btnComment.setAttribute('aria-label', 'Comentarios');
      btnComment.setAttribute('data-glifo', 'comment');
      contenedor.appendChild(btnComment);

      var comments = document.createElement('span');
      comments.className = 'likes-flotante';
      comments.id = 'commentsFlotante';
      comments.textContent = '0';
      contenedor.appendChild(comments);

      var btnShare = document.createElement('button');
      btnShare.type = 'button';
      btnShare.id = 'btnShareFlotante';
      btnShare.className = 'btn-flotante';
      btnShare.setAttribute('aria-label', 'Compartir');
      btnShare.setAttribute('data-glifo', 'share');
      contenedor.appendChild(btnShare);

      var shares = document.createElement('span');
      shares.className = 'likes-flotante';
      shares.id = 'sharesFlotante';
      shares.textContent = '0';
      contenedor.appendChild(shares);

      var btnPartner = document.createElement('button');
      btnPartner.type = 'button';
      btnPartner.id = 'btnPartnerFlotante';
      btnPartner.className = 'btn-partner';
      btnPartner.setAttribute('aria-label', 'Sobre el partner');
      btnPartner.setAttribute('data-glifo', 'user');
      contenedor.appendChild(btnPartner);

      if (typeof window.pintarGlifos === 'function') {
        window.pintarGlifos(contenedor);
      }

      btnLike.addEventListener('click', onLikeClick);
      btnComment.addEventListener('click', onCommentClick);
      btnShare.addEventListener('click', onShareClick);
      btnPartner.addEventListener('click', irAPartner);

      if (!postActivoObj && window.Lista && typeof window.Lista.getPostActivo === 'function') {
        postActivoObj = window.Lista.getPostActivo();
      }
      actualizarContadores();
    }

    /* ============================================================
       Estado visual del corazón
       ============================================================ */
    function aplicarEstadoCorazon(activo) {
      var btn = document.getElementById('btnLikeFlotante');
      if (!btn) return;

      if (activo) {
        btn.classList.add('activo');
        btn.style.color = '#ef4444';
      } else {
        btn.classList.remove('activo');
        btn.style.color = '';
      }
    }

    /* ============================================================
       Contadores
       ============================================================ */
    function actualizarContadores() {
      var likesEl    = document.getElementById('likesFlotante');
      var sharesEl   = document.getElementById('sharesFlotante');
      var commentsEl = document.getElementById('commentsFlotante');

      if (!postActivoObj) {
        aplicarEstadoCorazon(false);
        if (likesEl)    likesEl.textContent = '0';
        if (sharesEl)   sharesEl.textContent = '0';
        if (commentsEl) commentsEl.textContent = '0';
        return;
      }

      var tieneLike = postTieneLike(postActivoObj.id);
      aplicarEstadoCorazon(tieneLike);

      if (likesEl)    likesEl.textContent    = String(postActivoObj.like || 0);
      if (sharesEl)   sharesEl.textContent   = String(postActivoObj.comparte || 0);
      if (commentsEl) commentsEl.textContent = String(postActivoObj.comenta || 0);
    }

    /* ============================================================
       LIKE
       ============================================================ */
    function onLikeClick(e) {
      if (e && e.stopPropagation) e.stopPropagation();

      var post = postActivoObj;
      if (!post || !post.id) return;

      haptic([15, 10, 15]);

      var likes = getLikes();
      var yaDio = likes.indexOf(post.id) !== -1;
      var delta = yaDio ? -1 : 1;

      if (yaDio) {
        setLikes(likes.filter(function (k) { return k !== post.id; }));
        post.like = Math.max(0, (post.like || 0) - 1);
      } else {
        likes.push(post.id);
        setLikes(likes);
        post.like = (post.like || 0) + 1;

        /* GA4 (R12): like nuevo del usuario (solo frontend;
           quitar like no dispara evento) */
        if (window.Analitica) {
          window.Analitica.enviar('like', { post_id: post.id });
        }
      }

      actualizarContadores();
      bumpContador('likesFlotante');
      if (!yaDio) lanzarCorazon();

      postBackend('like', { idPost: post.id, delta: delta })
        .then(function (data) {
          if (data && typeof data.like === 'number') {
            post.like = data.like;
            var el = document.getElementById('likesFlotante');
            if (el) el.textContent = String(data.like);
          }
        })
        .catch(function (err) {
          if (delta === 1) {
            setLikes(getLikes().filter(function (k) { return k !== post.id; }));
            post.like = Math.max(0, (post.like || 0) - 1);
          } else {
            var ls = getLikes();
            if (ls.indexOf(post.id) === -1) { ls.push(post.id); setLikes(ls); }
            post.like = (post.like || 0) + 1;
          }
          actualizarContadores();
          console.error('[Social] Error al dar like:', err.message);
        });
    }

    /* ============================================================
       Comentario
       ============================================================ */
    function onCommentClick(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      haptic([15, 10, 15]);

      if (window.Comentarios && typeof window.Comentarios.abrir === 'function') {
        window.Comentarios.abrir();
      }
    }

    /* ============================================================
       Compartir
       ============================================================ */
    function onShareClick(e) {
      if (e && e.stopPropagation) e.stopPropagation();

      var post = postActivoObj;
      if (!post || !post.id) return;

      compartirNativo(post)
        .then(function (resultado) {
          if (resultado === 'compartido') {
            contarCompartido(post);
            return;
          }
          if (resultado === 'cancelado') {
            return;
          }
          compartirWhatsApp(post);
          contarCompartido(post);
        })
        .catch(function (err) {
          console.warn('[Social] Error en compartir:', err);
        });
    }

    function contarCompartido(post) {
      haptic(10);

      post.comparte = (post.comparte || 0) + 1;
      actualizarContadores();
      bumpContador('sharesFlotante');

      postBackend('comparte', { idPost: post.id })
        .then(function (data) {
          if (data && typeof data.comparte === 'number') {
            post.comparte = data.comparte;
            var el = document.getElementById('sharesFlotante');
            if (el) el.textContent = String(data.comparte);
          }
        })
        .catch(function (err) {
          post.comparte = Math.max(0, (post.comparte || 0) - 1);
          actualizarContadores();
          console.error('[Social] Error al compartir:', err.message);
        });
    }

    /* ============================================================
       Texto a compartir
       ============================================================ */
    function generarTextoCompartir(post) {
      var sj = post.seccionJson || {};
      var sp = sj.seccionPresentacion || {};

      var titulo  = sp.titulo  || 'Publicación';
      var tagline = sp.tagline || '';

      var partner = buscarPartner(post.idPartner);
      var nombre  = partner ? String(partner.nombre || '').trim() : '';

      var url = urlApp();

      var texto =
        '¡Mira esto! 📌\n\n' +
        (nombre ? nombre + '\n' : '') +
        '🎓 *' + titulo + '*\n' +
        (tagline ? tagline + '\n\n' : '\n') +
        '📲 Abre la app para ver toda la información' +
        (url ? '\n🔗 ' + url : '');

      return { titulo: titulo, texto: texto };
    }

    /* ============================================================
       Share nativo
       ============================================================ */
    function compartirNativo(post) {
      if (!navigator.share) return Promise.resolve('no-soportado');

      var info = generarTextoCompartir(post);

      return navigator.share({
        title: info.titulo,
        text:  info.texto
      })
      .then(function () {
        return 'compartido';
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return 'cancelado';
        return 'cancelado';
      });
    }

    /* ============================================================
       Fallback WhatsApp
       ============================================================ */
    function compartirWhatsApp(post) {
      var info = generarTextoCompartir(post);
      var url = 'https://wa.me/?text=' + encodeURIComponent(info.texto);
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    /* ============================================================
       Corazón volador
       ============================================================ */
    function lanzarCorazon() {
      var contenedor = document.querySelector('.botones-flotantes');
      var btn = document.getElementById('btnLikeFlotante');
      if (!contenedor || !btn) return;

      var contRect = contenedor.getBoundingClientRect();
      var btnRect  = btn.getBoundingClientRect();

      var centerX = btnRect.left - contRect.left + btnRect.width / 2;
      var centerY = btnRect.top  - contRect.top  + btnRect.height / 2;

      var wrap = document.createElement('div');
      wrap.className = 'heart-pop-wrap';
      wrap.style.left = (centerX - 20) + 'px';
      wrap.style.top  = (centerY - 20) + 'px';

      wrap.innerHTML =
        '<div class="heart-pop-svg">' +
          '<svg viewBox="0 0 24 24">' +
            '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
          '</svg>' +
        '</div>';

      contenedor.appendChild(wrap);

      setTimeout(function () {
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      }, 700);
    }

    function bumpContador(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.add('bump');
      setTimeout(function () { el.classList.remove('bump'); }, 250);
    }

    /* ============================================================
       Partner · abre el bottom sheet
       ============================================================ */
    function irAPartner() {
      haptic(10);
      if (window.PartnerSheet && typeof window.PartnerSheet.abrir === 'function') {
        window.PartnerSheet.abrir(postActivoObj);
      }
    }

    /* ============================================================
       Escuchar eventos
       ============================================================ */
    document.addEventListener('post:change', function (e) {
      postActivoObj = (e.detail && e.detail.post) ? e.detail.post : null;
      actualizarContadores();
    });

    document.addEventListener('chips:change', function () {
      setTimeout(actualizarContadores, 0);
    });

    document.addEventListener('comentarios:change', function (e) {
      var d = e.detail || {};
      if (!postActivoObj || d.idPost !== postActivoObj.id) return;
      if (typeof d.comenta === 'number') {
        postActivoObj.comenta = d.comenta;
        var contador = document.getElementById('commentsFlotante');
        if (contador) contador.textContent = String(d.comenta);
      }
    });

    return {
      pintar: pintar,
      refrescarContadores: actualizarContadores
    };

  })();
</script>
<!--
════════════════════════════════════════════════════════════════════
ARCHIVO:         Comenta_Script.html
PROYECTO:        INGeniusCloud | ServyCloud
RESPONSABILIDAD: Bottom sheet de comentarios. Skeleton en carga
                 inicial, al publicar y al borrar. Like por
                 comentario aislado. Dispara 'comentarios:change'.
                 Placeholder leído de seccionPresentacion.titulo.
                 Keys localStorage: post_comments_user,
                 post_comments_likes.
VERSIÓN:         1.0
CAMBIOS:         R5: baseline de producción incorporado al espejo;
                 encabezado normalizado al estándar ═══ (6 campos).
DEPENDENCIAS:    Global_Script.html (postBackend, getDeviceId),
                 Comenta_CSS.html, Global_CSS.html (base .sheet),
                 Iconos.html (glifos vía DOM)
════════════════════════════════════════════════════════════════════
-->

<script>
  window.Comentarios = (function () {

    var STORAGE_KEY_USER    = 'post_comments_user';
    var STORAGE_KEY_LIKES_C = 'post_comments_likes';

    var MAX_CHARS_COMENTARIO = 280;
    var LONG_PRESS_MS        = 550;
    var LONG_PRESS_TOLERANCE = 8;

    var UMBRAL_VELOCIDAD = 0.5;
    var UMBRAL_DRAG      = 6;

    var abierto = false;
    var idPostActual = null;
    var postActivoObj = null;

    var comentariosCache = [];
    var paginaActual = 1;
    var totalComentarios = 0;
    var hayMas = false;
    var cargando = false;

    var placeholderComposerOriginal = '';

    var root = null;
    var backdrop = null;
    var sheet = null;
    var handleArea = null;
    var btnClose = null;
    var content = null;
    var actionBackdrop = null;
    var actionSheet = null;

    var el = {};

    var comentarioActionFecha = null;

    var dragActivo = false;
    var dragMoved = false;
    var dragPointerId = null;
    var dragStartY = 0;
    var dragUltimoY = 0;
    var dragUltimoT = 0;
    var dragVelocidad = 0;

    /* ============================================================
       Helpers
       ============================================================ */
    function haptic(v) {
      if (navigator.vibrate) { try { navigator.vibrate(v); } catch (e) {} }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    function getUser() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || 'null'); }
      catch (_) { return null; }
    }
    function setUser(u) {
      try { localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(u)); } catch (_) {}
    }

    function getLikesComments() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY_LIKES_C) || '[]'); }
      catch (_) { return []; }
    }
    function setLikesComments(arr) {
      try { localStorage.setItem(STORAGE_KEY_LIKES_C, JSON.stringify(arr)); } catch (_) {}
    }

    function claveComentario(c) {
      return String(c.dispositivoId || '') + '|' + String(c.fecha || '');
    }
    function tengoLikeComentario(c) {
      return getLikesComments().indexOf(claveComentario(c)) !== -1;
    }
    function alternarLikeComentario(c) {
      var clave = claveComentario(c);
      var arr = getLikesComments();
      var idx = arr.indexOf(clave);
      if (idx === -1) { arr.push(clave); setLikesComments(arr); return true; }
      arr.splice(idx, 1); setLikesComments(arr); return false;
    }

    function getClaveActiva() {
      if (postActivoObj && postActivoObj.id) return postActivoObj.id;
      return null;
    }

    function colorAvatar(uid) {
      var hash = 0;
      var s = String(uid || 'x');
      for (var i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
      return 'hsl(' + (Math.abs(hash) % 360) + ', 55%, 52%)';
    }

    function iniciales(nombre) {
      var partes = String(nombre || '?').trim().split(/\s+/);
      var a = (partes[0] || '').charAt(0) || '?';
      var b = (partes[1] || '').charAt(0) || '';
      return (a + b).toUpperCase();
    }

    var DIAS  = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

    function formatearHora(d) {
      var h = d.getHours(); var m = d.getMinutes();
      var ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12; if (h === 0) h = 12;
      return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
    }
    function mismoDia(a, b) {
      return a.getFullYear() === b.getFullYear()
          && a.getMonth()    === b.getMonth()
          && a.getDate()     === b.getDate();
    }
    function tiempoSocial(iso) {
      var d = new Date(iso);
      var ahora = new Date();
      var min = Math.floor((ahora.getTime() - d.getTime()) / 60000);

      if (min < 1) return 'Ahora';
      if (min < 60) return 'Hace ' + min + ' min';
      if (mismoDia(d, ahora)) return 'Hoy · ' + formatearHora(d);

      var ayer = new Date(ahora);
      ayer.setDate(ayer.getDate() - 1);
      if (mismoDia(d, ayer)) return 'Ayer · ' + formatearHora(d);

      var diasDiff = Math.floor((ahora.getTime() - d.getTime()) / 86400000);
      if (diasDiff < 7) return DIAS[d.getDay()] + ' · ' + formatearHora(d);

      return d.getDate() + ' ' + MESES[d.getMonth()] + ' · ' + formatearHora(d);
    }

    /* ============================================================
       Backend
       ============================================================ */
    function cargarComentarios(pagina) {
      if (cargando) return Promise.resolve();
      cargando = true;

      return postBackend('comentarios', {
        idPost: idPostActual,
        pagina: pagina
      })
      .then(function (data) {
        totalComentarios = data.total;
        hayMas = data.hayMas;
        paginaActual = data.pagina;

        if (pagina === 1) {
          comentariosCache = data.comentarios;
        } else {
          comentariosCache = comentariosCache.concat(data.comentarios);
        }
        cargando = false;

        document.dispatchEvent(new CustomEvent('comentarios:change', {
          detail: { idPost: idPostActual, comenta: totalComentarios }
        }));
      })
      .catch(function (err) {
        cargando = false;
        console.error('[Comentarios] Error al cargar:', err.message);
      });
    }

    /* ============================================================
       Construir DOM base
       ============================================================ */
    function construirDOM() {
      if (root) return;

      var area = document.querySelector('.area-contenido');
      if (!area) return;

      root = document.createElement('div');
      root.className = 'comentarios-root';
      root.innerHTML =
        '<div class="sheet-backdrop"></div>' +
        '<div class="sheet modo-comentarios">' +
          '<div class="sheet-handle-area"><div class="sheet-handle"></div></div>' +
          '<button class="sheet-close" type="button" aria-label="Cerrar">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="18" y1="6" x2="6" y2="18"/>' +
              '<line x1="6" y1="6" x2="18" y2="18"/>' +
            '</svg>' +
          '</button>' +
          '<div class="sheet-content"></div>' +
        '</div>' +
        '<div class="action-backdrop"></div>' +
        '<div class="action-sheet">' +
          '<button type="button" class="action-sheet-btn danger" id="btnActionDelete">Borrar comentario</button>' +
          '<button type="button" class="action-sheet-btn" id="btnActionCancel">Cancelar</button>' +
        '</div>';

      area.appendChild(root);

      backdrop       = root.querySelector('.sheet-backdrop');
      sheet          = root.querySelector('.sheet');
      handleArea     = root.querySelector('.sheet-handle-area');
      btnClose       = root.querySelector('.sheet-close');
      content        = root.querySelector('.sheet-content');
      actionBackdrop = root.querySelector('.action-backdrop');
      actionSheet    = root.querySelector('.action-sheet');

      backdrop.addEventListener('click', function () {
        if (actionSheet.classList.contains('visible')) { cerrarActionSheet(); return; }
        cerrar();
      });
      btnClose.addEventListener('click', cerrar);
      handleArea.addEventListener('pointerdown', onDragDown);

      actionBackdrop.addEventListener('click', cerrarActionSheet);
      actionSheet.querySelector('#btnActionDelete').addEventListener('click', confirmarBorrado);
      actionSheet.querySelector('#btnActionCancel').addEventListener('click', cerrarActionSheet);
    }

    /* ============================================================
       Abrir / cerrar
       ============================================================ */
    function abrir() {
      construirDOM();
      if (!root) return;

      idPostActual = getClaveActiva();
      if (!idPostActual) return;

      var sj = postActivoObj && postActivoObj.seccionJson ? postActivoObj.seccionJson : {};
      var meta = sj.meta || {};
      var color = meta.colorOficial || postActivoObj.colorOficial || '#1d4ed8';
      content.style.setProperty('--post-color', color);

      comentariosCache = [];
      paginaActual = 1;
      totalComentarios = 0;
      hayMas = false;

      inyectarContenido();
      renderSkeletons(3);
      cargarComentarios(1).then(renderLista);

      sheet.classList.add('sin-transicion');
      sheet.style.transform = 'translateY(100%)';
      root.classList.add('abierto');
      sheet.classList.add('abierto');

      void sheet.offsetHeight;
      sheet.classList.remove('sin-transicion');

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          sheet.style.transform = 'translateY(0)';
          backdrop.classList.add('visible');
        });
      });

      abierto = true;

      setTimeout(function () {
        var user = getUser();
        if (user && user.nombre) {
          if (el.composerInput && !el.composerInput.disabled) el.composerInput.focus();
        } else {
          if (el.nameInput) el.nameInput.focus();
        }
      }, 420);
    }

    function cerrar() {
      if (!abierto) return;
      abierto = false;
      cerrarActionSheet();

      backdrop.classList.remove('visible');
      sheet.style.transform = 'translateY(100%)';

      setTimeout(function () {
        if (!abierto) {
          sheet.classList.remove('abierto');
          root.classList.remove('abierto');
          if (content) content.innerHTML = '';
          el = {};
        }
      }, 420);
    }

    /* ============================================================
       Inyectar contenido
       ============================================================ */
    function inyectarContenido() {
      var sj = postActivoObj && postActivoObj.seccionJson ? postActivoObj.seccionJson : {};
      var sp = sj.seccionPresentacion || {};
      var nombrePost = sp.titulo || postActivoObj.titulo || 'esta publicación';
      var placeholder = '¿Qué te pareció ' + nombrePost + '?';

      placeholderComposerOriginal = placeholder;

      content.innerHTML =
        '<div class="sheet-head">' +
          '<h2 class="sheet-title">Comentarios</h2>' +
          '<span class="sheet-count" id="sheetCountComentarios">0</span>' +
        '</div>' +
        '<div class="comments-scroll" id="commentsScroll">' +
          '<div class="comments-list" id="commentsList"></div>' +
          '<div class="comments-actions" id="commentsActions" hidden>' +
            '<button type="button" class="comments-ver-mas" id="btnVerMas">Ver más</button>' +
          '</div>' +
        '</div>' +
        '<div class="composer-wrap">' +
          '<div class="name-prompt" id="namePrompt" hidden>' +
            '<span class="name-prompt-label">¿Cómo te llamas?</span>' +
            '<input type="text" class="name-prompt-input" id="nameInput" maxlength="30" placeholder="Tu nombre" autocomplete="name">' +
            '<button type="button" class="name-prompt-btn" id="nameBtn" disabled>OK</button>' +
          '</div>' +
          '<div class="composer">' +
            '<textarea class="composer-input" id="composerInput" rows="1" maxlength="' + MAX_CHARS_COMENTARIO + '" placeholder="' + escapeHtml(placeholder) + '"></textarea>' +
            '<span class="composer-counter" id="composerCounter" hidden>' + MAX_CHARS_COMENTARIO + '</span>' +
            '<button type="button" class="composer-send" id="composerSend" disabled aria-label="Enviar">' +
              '<svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>';

      el = {
        sheetCount:      content.querySelector('#sheetCountComentarios'),
        scroll:          content.querySelector('#commentsScroll'),
        list:            content.querySelector('#commentsList'),
        actions:         content.querySelector('#commentsActions'),
        btnVerMas:       content.querySelector('#btnVerMas'),
        namePrompt:      content.querySelector('#namePrompt'),
        nameInput:       content.querySelector('#nameInput'),
        nameBtn:         content.querySelector('#nameBtn'),
        composerInput:   content.querySelector('#composerInput'),
        composerCounter: content.querySelector('#composerCounter'),
        composerSend:    content.querySelector('#composerSend')
      };

      bindear();
      actualizarNombreUI();
      actualizarBotonVerMas();
    }

    function renderSkeletons(n) {
      if (!el.list) return;
      var html = '';
      for (var i = 0; i < (n || 3); i++) {
        html += '<div class="comment-skeleton">' +
                  '<div class="skeleton-avatar"></div>' +
                  '<div class="skeleton-body">' +
                    '<div class="skeleton-line short"></div>' +
                    '<div class="skeleton-line long"></div>' +
                    '<div class="skeleton-line medium"></div>' +
                  '</div>' +
                '</div>';
      }
      el.list.innerHTML = html;
      if (el.actions) el.actions.hidden = true;
    }

    function bindear() {
      el.nameInput.addEventListener('input', function () {
        el.nameBtn.disabled = this.value.trim().length < 2;
      });

      el.nameBtn.addEventListener('click', function () {
        var nombre = el.nameInput.value.trim();
        if (nombre.length < 2) return;
        setUser({ uid: getDeviceId(), nombre: nombre });
        haptic([15, 10, 15]);
        el.namePrompt.hidden = true;
        el.composerInput.disabled = false;
        el.composerInput.placeholder = placeholderComposerOriginal;
        actualizarSend();
        setTimeout(function () { el.composerInput.focus(); }, 120);
      });

      el.nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); if (!el.nameBtn.disabled) el.nameBtn.click(); }
      });

      el.composerInput.addEventListener('input', function () {
        autogrow(this);
        actualizarCounter();
        actualizarSend();
      });
      el.composerSend.addEventListener('click', publicarComentario);

      if (el.btnVerMas) {
        el.btnVerMas.addEventListener('click', function () {
          haptic(8);
          el.btnVerMas.disabled = true;
          el.btnVerMas.textContent = 'Cargando…';
          cargarComentarios(paginaActual + 1).then(function () {
            renderLista();
            el.btnVerMas.disabled = false;
            el.btnVerMas.textContent = 'Ver más';
            actualizarBotonVerMas();
          });
        });
      }
    }

    function autogrow(ta) {
      ta.style.height = 'auto';
      ta.style.height = Math.min(Math.max(ta.scrollHeight, 40), 84) + 'px';
    }

    function actualizarCounter() {
      var len = el.composerInput.value.length;
      if (len === 0) { el.composerCounter.hidden = true; return; }
      el.composerCounter.hidden = false;
      var restantes = MAX_CHARS_COMENTARIO - len;
      el.composerCounter.textContent = restantes;
      el.composerCounter.classList.remove('warn', 'danger');
      if (restantes <= 10) el.composerCounter.classList.add('danger');
      else if (restantes <= 20) el.composerCounter.classList.add('warn');
    }

    function actualizarSend() {
      var user = getUser();
      if (!user || !user.nombre) { el.composerSend.disabled = true; return; }
      el.composerSend.disabled = el.composerInput.value.trim().length === 0;
    }

    function actualizarNombreUI() {
      var user = getUser();
      if (user && user.nombre) {
        el.namePrompt.hidden = true;
        el.composerInput.disabled = false;
        el.composerInput.placeholder = placeholderComposerOriginal;
        actualizarSend();
      } else {
        el.namePrompt.hidden = false;
        el.nameInput.value = '';
        el.nameBtn.disabled = true;
        el.composerInput.disabled = true;
        el.composerInput.placeholder = 'Escribe tu nombre para comentar…';
        el.composerSend.disabled = true;
      }
    }

    function actualizarBotonVerMas() {
      if (!el.actions) return;
      el.actions.hidden = !hayMas;
    }

    function renderLista() {
      if (!el.list) return;

      if (el.sheetCount) el.sheetCount.textContent = String(totalComentarios);

      if (comentariosCache.length === 0) {
        el.list.innerHTML =
          '<div class="comments-empty">' +
            '<span class="comments-empty-icon">💬</span>' +
            '<p class="comments-empty-title">Sé el primero en comentar</p>' +
            '<p class="comments-empty-sub">Tu opinión ayuda a otros a decidir</p>' +
          '</div>';
        return;
      }

      var uid = getDeviceId();
      var html = '';

      comentariosCache.forEach(function (c) {
        var esPropio = (c.dispositivoId === uid);
        var tieneLike = tengoLikeComentario(c);

        html += '<div class="comment" data-fecha="' + escapeHtml(c.fecha) + '">';
        html +=   '<div class="comment-avatar" style="background-color:' + colorAvatar(c.dispositivoId) + '">' +
                    escapeHtml(iniciales(c.nombre)) +
                  '</div>';
        html +=   '<div class="comment-body">';
        html +=     '<div class="comment-head">';
        html +=       '<div class="comment-head-left">';
        html +=         '<span class="comment-name">' + escapeHtml(c.nombre) + '</span>';
        if (esPropio) html += '<span class="comment-badge-yo">Tú</span>';
        html +=         '<span class="comment-time">' + escapeHtml(tiempoSocial(c.fecha)) + '</span>';
        html +=       '</div>';
        if (esPropio) {
          html += '<button type="button" class="comment-more" data-more="' + escapeHtml(c.fecha) + '" aria-label="Más opciones">' +
                    '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>' +
                  '</button>';
        }
        html +=     '</div>';
        html +=     '<p class="comment-text">' + escapeHtml(c.texto) + '</p>';
        html +=   '</div>';
        html +=   '<button type="button" class="comment-like' + (tieneLike ? ' activo' : '') + '" data-like="' + escapeHtml(c.fecha) + '" aria-label="Me gusta">' +
                    '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
                  '</button>';
        html += '</div>';
      });

      el.list.innerHTML = html;

      el.list.querySelectorAll('.comment-like').forEach(function (btn) {
        btn.addEventListener('click', onLikeComment);
      });
      el.list.querySelectorAll('.comment-more').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation(); haptic(10);
          abrirActionSheet(this.getAttribute('data-more'));
        });
      });
      el.list.querySelectorAll('.comment').forEach(function (elComment) {
        var fecha = elComment.getAttribute('data-fecha');
        var c = comentariosCache.filter(function (x) { return x.fecha === fecha; })[0];
        if (c && c.dispositivoId === uid) bindLongPress(elComment, fecha);
      });
    }

    function publicarComentario() {
      var user = getUser();
      if (!user || !user.nombre) {
        el.namePrompt.hidden = false;
        el.composerInput.disabled = true;
        el.composerInput.placeholder = 'Escribe tu nombre para comentar…';
        el.composerSend.disabled = true;
        setTimeout(function () { el.nameInput.focus(); }, 100);
        return;
      }

      var texto = el.composerInput.value.trim();
      if (!texto) return;
      if (texto.length > MAX_CHARS_COMENTARIO) return;

      el.composerSend.disabled = true;

      el.composerInput.value = '';
      autogrow(el.composerInput);
      actualizarCounter();
      actualizarSend();

      renderSkeletons(3);

      postBackend('comentario', {
        idPost: idPostActual,
        nombre: user.nombre,
        texto:  texto
      })
      .then(function (data) {
        haptic([15, 10, 15]);
        if (data && typeof data.comenta === 'number') {
          document.dispatchEvent(new CustomEvent('comentarios:change', {
            detail: { idPost: idPostActual, comenta: data.comenta }
          }));
        }
        return cargarComentarios(1);
      })
      .then(function () {
        renderLista();
        actualizarBotonVerMas();
        el.scroll.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function (err) {
        console.error('[Comentarios] Error al publicar:', err.message);
        haptic([30, 20, 30]);
        renderLista();
        actualizarBotonVerMas();
      });
    }

    function onLikeComment(e) {
      e.stopPropagation();
      var btn = e.currentTarget;
      var fecha = btn.getAttribute('data-like');
      if (!fecha) return;
      var c = comentariosCache.filter(function (x) { return x.fecha === fecha; })[0];
      if (!c) return;

      var ahoraActivo = alternarLikeComentario(c);
      btn.classList.toggle('activo', ahoraActivo);
      haptic(10);
    }

    function bindLongPress(elComment, fecha) {
      var timer = null;
      var startX = 0, startY = 0;

      function cancelar() { if (timer) { clearTimeout(timer); timer = null; } }

      elComment.addEventListener('pointerdown', function (e) {
        if (e.target.closest && (e.target.closest('.comment-like') || e.target.closest('.comment-more'))) return;
        startX = e.clientX; startY = e.clientY;
        cancelar();
        timer = setTimeout(function () {
          timer = null; haptic(15); abrirActionSheet(fecha);
        }, LONG_PRESS_MS);
      });

      elComment.addEventListener('pointermove', function (e) {
        if (!timer) return;
        if (Math.abs(e.clientX - startX) > LONG_PRESS_TOLERANCE ||
            Math.abs(e.clientY - startY) > LONG_PRESS_TOLERANCE) {
          cancelar();
        }
      });

      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
        elComment.addEventListener(ev, cancelar);
      });
    }

    function abrirActionSheet(fecha) {
      comentarioActionFecha = fecha;
      actionBackdrop.classList.add('visible');
      actionSheet.classList.add('visible');
    }

    function cerrarActionSheet() {
      comentarioActionFecha = null;
      if (actionBackdrop) actionBackdrop.classList.remove('visible');
      if (actionSheet)    actionSheet.classList.remove('visible');
    }

    function confirmarBorrado() {
      if (!comentarioActionFecha) return;
      var fecha = comentarioActionFecha;
      cerrarActionSheet();
      haptic([15, 10, 15]);

      renderSkeletons(3);

      postBackend('comentarioBorrar', { idPost: idPostActual, fecha: fecha })
      .then(function (data) {
        if (data && typeof data.comenta === 'number') {
          document.dispatchEvent(new CustomEvent('comentarios:change', {
            detail: { idPost: idPostActual, comenta: data.comenta }
          }));
        }
        return cargarComentarios(1);
      })
      .then(function () {
        renderLista();
        actualizarBotonVerMas();
      })
      .catch(function (err) {
        console.error('[Comentarios] Error al borrar:', err.message);
        haptic([30, 20, 30]);
        renderLista();
        actualizarBotonVerMas();
      });
    }

<script>
  window.ReservaValida = (function () {

    /* ---------- Constantes ---------- */
    var REGEX = {
      NOMBRE:     /^[A-Za-zÀ-ÿ\s'\-]+$/,
      NO_NOMBRE:  /[^A-Za-zÀ-ÿ\s'\-]/g,
      NO_DIGITO:  /\D/g,
      CORREO:     /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/,
      OTP:        /^\d{6}$/
    };

    var MIN = {
      NOMBRE:   3,
      TELEFONO: 10
    };

    var MAX = {
      TELEFONO: 11
    };

    /* ---------- Limpiadores ---------- */
    function limpiarNombre(v) {
      return String(v == null ? '' : v).replace(REGEX.NO_NOMBRE, '');
    }

    function limpiarTelefono(v) {
      return String(v == null ? '' : v)
        .replace(REGEX.NO_DIGITO, '')
        .slice(0, MAX.TELEFONO);
    }

    function limpiarOtp(v) {
      return String(v == null ? '' : v)
        .replace(REGEX.NO_DIGITO, '')
        .slice(0, 6);
    }

    /* ---------- Validadores ---------- */
    function nombre(v) {
      var s = String(v == null ? '' : v).trim();
      if (s.length < MIN.NOMBRE) return false;
      return REGEX.NOMBRE.test(s);
    }

    function telefono(v) {
      return limpiarTelefono(v).length >= MIN.TELEFONO;
    }

    function correo(v) {
      return REGEX.CORREO.test(String(v == null ? '' : v));
    }

    function otp(v) {
      return REGEX.OTP.test(String(v == null ? '' : v));
    }

    return {
      nombre:   nombre,
      telefono: telefono,
      correo:   correo,
      otp:      otp,

      limpiarNombre:   limpiarNombre,
      limpiarTelefono: limpiarTelefono,
      limpiarOtp:      limpiarOtp,

      REGEX: REGEX,
      MIN:   MIN,
      MAX:   MAX
    };

  })();
</script>

<script>
  window.Sheet = (function () {

    var UMBRAL_VELOCIDAD = 0.5;

    var content    = null;

    var dragMoved = false;

    var dragStartY = 0;
    var dragUltimoY = 0;
    var dragUltimoT = 0;
    var dragVelocidad = 0;
    var dragDesdeHandle = false;

    /* ============================================================
       Construir DOM base (una sola vez por sesión)
       ============================================================ */
    function construir() {
      if (raiz) return;
      var area = document.querySelector('.area-contenido');
      if (!area) return;

              '<line x1="6" y1="6" x2="18" y2="18"/>' +
            '</svg>' +
          '</button>' +
          '<button class="sheet-back" type="button" aria-label="Volver">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<polyline points="15 18 9 12 15 6"/>' +
            '</svg>' +
          '</button>' +
          '<div class="sheet-content"></div>' +
        '</div>';

      area.appendChild(raiz);

      backdrop   = raiz.querySelector('.sheet-backdrop');
      sheet      = raiz.querySelector('.sheet');
      handleArea = raiz.querySelector('.sheet-handle-area');
      content    = raiz.querySelector('.sheet-content');
      btnClose   = raiz.querySelector('.sheet-close');

      backdrop.addEventListener('click', cerrar);
      btnClose.addEventListener('click', cerrar);
      handleArea.addEventListener('pointerdown', onDragDown);
      content.addEventListener('pointerdown', onContentDown);
      content.addEventListener('scroll', function () {
        if (typeof onScrollCb === 'function') onScrollCb(content.scrollTop);

       Abrir

       ============================================================ */

      if (!raiz) return;

      opts = opts || {};
      onCloseCb  = opts.onClose  || null;
      onScrollCb = opts.onScroll || null;

      if (opts.color) content.style.setProperty('--post-color', opts.color);
      if (typeof opts.content === 'string') content.innerHTML = opts.content;
      content.scrollTop = 0;

      sheet.classList.remove('solo-volver', 'con-privacidad', 'scroll-mas', 'subvista');

      sheet.classList.add('sin-transicion');
      sheet.style.transform = 'translateY(100%)';
      raiz.classList.add('abierto');
      sheet.classList.add('abierto');

      void sheet.offsetHeight;
      sheet.classList.remove('sin-transicion');

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          sheet.style.transform = 'translateY(0)';
          backdrop.classList.add('visible');
        });
      });

      abierto = true;
    }

    /* ============================================================
       Cerrar
       ============================================================ */
