      if (!abierto) return;
      abierto = false;

      backdrop.classList.remove('visible');
      sheet.style.transform = 'translateY(100%)';

      setTimeout(function () {
        if (!abierto) {
          sheet.classList.remove('abierto', 'solo-volver', 'con-privacidad', 'scroll-mas', 'subvista');
          raiz.classList.remove('abierto');
          if (content) content.innerHTML = '';

          onCloseCb = null;
          cb();
        }

    }

    /* ============================================================

      content.innerHTML = html || '';

    }

    function mostrarBack() { if (sheet) sheet.classList.add('solo-volver'); }

      sheet.classList.toggle('scroll-mas', hayMas);
    }
    function desactivarGradientePrivacidad() {
      if (!sheet) return;
      sheet.classList.remove('con-privacidad', 'scroll-mas');
    }

    /* ============================================================
       Drag
       ============================================================ */
    function onDragDown(e) { iniciarDrag(e, true); }
    function onContentDown(e) {
      if (content.scrollTop > 0) return;
      iniciarDrag(e, false);
    }

    function iniciarDrag(e, desdeHandle) {
      if (!abierto) return;
      if (e.button !== undefined && e.button !== 0) return;

      dragActivo = true;
      dragMoved = false;
      dragDesdeHandle = desdeHandle;
      dragPointerId = e.pointerId;
      dragStartY = e.clientY;
      dragUltimoY = e.clientY;
      dragUltimoT = performance.now();
      dragVelocidad = 0;

      if (desdeHandle) {
        handleArea.addEventListener('pointermove', onDragMove);
        handleArea.addEventListener('pointerup', onDragEnd);
        handleArea.addEventListener('pointercancel', onDragEnd);
      } else {
        content.addEventListener('pointermove', onDragMove);

      }
    }

    function onDragMove(e) {
      if (!dragActivo) return;

      var dy = e.clientY - dragStartY;

      if (!dragMoved) {
        if (Math.abs(dy) < UMBRAL_DRAG) return;
        dragMoved = true;
        sheet.classList.add('sin-transicion');
        if (!dragDesdeHandle && dy < 0) { cancelarDrag(); return; }
        try {
          (dragDesdeHandle ? handleArea : content).setPointerCapture(e.pointerId);
        } catch (err) {}
      }

      var altura = sheet.offsetHeight;
      var pct = (dy / altura) * 100;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      e.preventDefault();
      sheet.style.transform = 'translateY(' + pct + '%)';

      var ahora = performance.now();
      var dt = ahora - dragUltimoT;
      if (dt > 0) {
        var v = (e.clientY - dragUltimoY) / dt;
        dragVelocidad = dragVelocidad * 0.7 + v * 0.3;
        dragUltimoY = e.clientY;
        dragUltimoT = ahora;
      }
    }

    function onDragEnd(e) {
      if (!dragActivo) return;
      if (e.pointerId !== dragPointerId) return;
      dragActivo = false;
      dragPointerId = null;

      if (!dragMoved) { limpiarDrag(); return; }
      dragMoved = false;
      sheet.classList.remove('sin-transicion');

      var t = sheet.style.transform || '';
      var m = t.match(/translateY\(([\d.]+)%\)/);
      var pct = m ? parseFloat(m[1]) : 0;

      var cerrarSheet = (dragVelocidad > UMBRAL_VELOCIDAD) || (pct > 30);
      if (cerrarSheet) cerrar();
      else sheet.style.transform = 'translateY(0)';

      limpiarDrag();
    }

    function cancelarDrag() {
      dragActivo = false;
      dragMoved = false;
      dragPointerId = null;
      sheet.classList.remove('sin-transicion');
      sheet.style.transform = 'translateY(0)';
      limpiarDrag();
    }

    function limpiarDrag() {
      handleArea.removeEventListener('pointermove', onDragMove);
      handleArea.removeEventListener('pointerup', onDragEnd);
      handleArea.removeEventListener('pointercancel', onDragEnd);
      content.removeEventListener('pointermove', onDragMove);
      content.removeEventListener('pointerup', onDragEnd);
      content.removeEventListener('pointercancel', onDragEnd);
    }

    return {
      abrir:      abrir,
      cerrar:     cerrar,
      setContent: setContent,
      getContent: getContent,
      isAbierto:  isAbierto,
      mostrarBack: ocultarBack,
      mostrarVolver: mostrarBack,
      ocultarVolver: ocultarBack,
      activarGradientePrivacidad:   activarGradientePrivacidad,
      desactivarGradientePrivacidad: desactivarGradientePrivacidad
    };

  })();

      function solicitarCodigo() {
        var correo = correoActual();
        if (!window.ReservaValida.correo(correo)) return;

        btnSolicitar.disabled = true;
        btnSolicitar.textContent = 'Enviando código…';

        var payload = Object.assign({ correo: correo }, datosIntento());

        postBackend('otpSolicitar', payload)
          .then(function (data) {
            if (data && data.bloqueado && data.motivo === 'RESERVA_ACTIVA') {
              mostrarBloqueoReservaActiva(
                data.idReserva || '—',
                data.nombreAlumno || '',
                data.postTitulo || ''
              );
              return;
            }

            cb.haptic([15, 10, 15]);
            state.otpEnviado = true;
            state.otpCooldownHasta = Date.now() + OTP_COOLDOWN_MS;

            /* GA4 (R12): solicitud de código exitosa */
            if (window.Analitica) {
              window.Analitica.enviar('otp_request', {
                post_id: window.Analitica.idPostActivo()
              });
            }

            btnSolicitar.hidden = true;
            btnSolicitar.disabled = false;
            btnSolicitar.textContent = TEXTO_BTN_SOLICITAR;

            zonaOtp.hidden = false;
            zonaOtp.classList.remove('saliendo');
            zonaOtp.classList.add('revelando');

            inputCorreo.readOnly = true;

            setTimeout(function () { inputOtp.focus(); }, 120);
            iniciarCooldown();
            cb.onEstadoCambiado();
          })
          .catch(function (err) {
            btnSolicitar.disabled = false;
            btnSolicitar.textContent = TEXTO_BTN_SOLICITAR;
            var msg = err.message || '';
            if (msg.indexOf('RATE_LIMIT') === 0) {
              cb.banner('Demasiadas solicitudes. Intenta en unos minutos.', 'error');
            } else if (msg === 'CORREO_NO_ENVIADO') {
              cb.banner('No se pudo enviar el correo. Verifica la dirección.', 'error');
            } else {
              cb.banner('No se pudo enviar el código. Intenta de nuevo.', 'error');
            }
            cb.haptic([30, 20, 30]);
          });
      }

      function reenviarCodigo() {
        if (btnReenviar.disabled) return;
        var correo = correoActual();
        if (!window.ReservaValida.correo(correo)) return;

        btnReenviar.disabled = true;
        btnReenviar.textContent = 'Enviando…';

        var payload = Object.assign({ correo: correo }, datosIntento());

        postBackend('otpSolicitar', payload)
          .then(function (data) {
            if (data && data.bloqueado && data.motivo === 'RESERVA_ACTIVA') {
              btnReenviar.disabled = false;
              btnReenviar.textContent = 'Reenviar código';
              mostrarBloqueoReservaActiva(
                data.idReserva || '—',
                data.nombreAlumno || '',
                data.postTitulo || ''
              );
              return;
            }

            cb.haptic([15, 10, 15]);
            state.otpEnviado = true;
            state.otpCooldownHasta = Date.now() + OTP_COOLDOWN_MS;

            /* GA4 (R12): reenvío de código exitoso */
            if (window.Analitica) {
              window.Analitica.enviar('otp_request', {
                post_id: window.Analitica.idPostActivo()
              });
            }

            inputOtp.value = '';
            fieldOtp.classList.remove('activo', 'validado', 'invalido');
            iniciarCooldown();
            inputOtp.focus();
          })
          .catch(function (err) {
            var msg = err.message || '';
            if (msg.indexOf('RATE_LIMIT') === 0) {
              cb.banner('Demasiadas solicitudes. Intenta en unos minutos.', 'error');
            } else {
              cb.banner('No se pudo reenviar el código. Intenta de nuevo.', 'error');
            }
            btnReenviar.disabled = false;
            btnReenviar.textContent = 'Reenviar código';
            cb.haptic([30, 20, 30]);
          });
      }

      function verificarOtp() {
        if (state.correoValidado) return;
        if (!state.otpEnviado) return;
        var correo = correoActual();
        var codigo = inputOtp.value.trim();
        if (!window.ReservaValida.otp(codigo)) return;

        inputOtp.readOnly = true;
        fieldOtp.classList.remove('invalido');

        postBackend('otpVerificar', { correo: correo, codigo: codigo })
          .then(function () {
            state.correoValidado = true;
            fieldOtp.classList.add('validado');
            fieldCorreo.classList.add('validado');
            fieldOtp.classList.remove('invalido');
            inputCorreo.readOnly = true;
            inputOtp.readOnly = true;
            cb.haptic([15, 10, 15]);

            if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }

            zonaOtp.classList.add('saliendo');
            setTimeout(function () {
              zonaOtp.hidden = true;
              bloquePost.hidden = false;
              bloquePost.classList.add('revelando');
              bloquePost.scrollIntoView({ behavior: 'smooth', block: 'start' });
              cb.onEstadoCambiado();
              if (typeof cb.onVerificado === 'function') cb.onVerificado();
            }, 180);
          })
          .catch(function (err) {
            inputOtp.readOnly = false;
            fieldOtp.classList.add('invalido');
            var msg = err.message || '';

            if (msg === 'OTP_EXPIRADO') {
              cb.banner('El código expiró. Solicita uno nuevo.', 'error');
              reset(state, el);
            } else if (msg === 'OTP_INTENTOS_AGOTADOS') {
              cb.banner('Demasiados intentos. Solicita un código nuevo.', 'error');
              reset(state, el);
            } else {
              cb.banner('Código incorrecto', 'error');
              inputOtp.value = '';
              inputOtp.focus();
            }
            cb.haptic([30, 20, 30]);
          });
      }
    }

    function reset(state, el) {
      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }

      state.otpEnviado       = false;
      state.otpCooldownHasta = 0;

      if (el.zonaOtp) el.zonaOtp.hidden = true;
      if (el.inputOtp) {
        el.inputOtp.value = '';
        el.inputOtp.readOnly = false;
      }
      if (el.fieldOtp) el.fieldOtp.classList.remove('activo', 'validado', 'invalido');
      if (el.inputCorreo) el.inputCorreo.readOnly = false;
      if (el.btnReenviar) {
        el.btnReenviar.disabled = false;
        el.btnReenviar.textContent = 'Reenviar código';
      }
      if (el.btnSolicitar) {
        var okCorreo = window.ReservaValida.correo((el.inputCorreo.value || '').trim());
        el.btnSolicitar.hidden = !okCorreo;
        el.btnSolicitar.disabled = false;
        el.btnSolicitar.textContent = TEXTO_BTN_SOLICITAR;
      }
      if (el.avisoReservaActiva) {
        el.avisoReservaActiva.style.display = 'none';
        el.avisoReservaActiva.innerHTML = '';
      }
    }

    return {
      init:  init,
      reset: reset
    };

  })();
</script>

<script>
  window.ReservaDatos = (function () {

    var CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    var V = window.ReservaValida;
    if (!V) throw new Error('[ReservaDatos] window.ReservaValida no está cargado');
    if (!window.ReservaOTP) throw new Error('[ReservaDatos] window.ReservaOTP no está cargado');

    var validarNombre   = V.nombre;
    var validarTelefono = V.telefono;
    var validarCorreo   = V.correo;

    function textoCupos(cupoLibre) {
      var n = Number(cupoLibre || 0);
      if (n === 0) return 'Sin cupos';
      if (n === 1) return '1 cupo';
      return n + ' cupos';
    }

    /* Título del post · lee del post enriquecido, con fallback */
    function tituloDelPost(post) {
      if (!post) return 'esta publicación';
      var sj = post.seccionJson || {};
      var sp = sj.seccionPresentacion || {};
      var t = String(sp.titulo || '').trim();
      if (t) return t;
      t = String(post.titulo || '').trim();
      if (t) return t;
      return 'esta publicación';
    }

    function getHeaderHTML(nombrePost) {
      return '' +
        '<div class="reserva-banner" id="reservaBanner" hidden></div>' +
        '<h3 class="form-titulo">Reservar cupo</h3>' +
        '<p class="form-sub">Estás reservando <strong>' + escapeHtml(nombrePost) +
        '</strong>. Completa tus datos y un asesor te contactará.</p>';
    }

    var PENCIL_BTN =
      '<span aria-hidden="true" style="flex-shrink:0; display:flex; align-items:center; justify-content:center; ' +
        'width:34px; height:34px; border-radius:50%; ' +
        'background-color: color-mix(in srgb, var(--post-color, #1d4ed8) 12%, transparent); ' +
        'color: var(--post-color, #1d4ed8); margin-left:8px;">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;">' +
          '<path d="M12 20h9"/>' +
          '<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>' +
        '</svg>' +
      '</span>';

    function datosPlan(p) {
      return {
        dias:  (p.turno && p.turno.dias && p.turno.dias.join(' · ')) || '',
        hora:  (p.turno && p.turno.textoMostrar) || '',
        cupos: textoCupos(p.cupoLibre)
      };
    }

    /* ============================================================
       BLOQUE 1 · Horario
       ============================================================ */
    function getHorarioHTML(state) {
      var planes = state.planes || [];
      if (!planes.length) return '';

      var auto = (planes.length === 1);
      if (auto) state.horarioConfirmado = true;

      var confirmado = auto || !!state.horarioConfirmado;
      var idx = auto ? 0 : (state.turnoSeleccionado || 0);

      var opciones = '';
      if (!auto) {
        opciones =
          '<div id="horarioOpciones" style="display:' + (confirmado ? 'none' : 'flex') + '; ' +
               'flex-direction:column; gap:8px;">';
        planes.forEach(function (p, i) {
          var d = datosPlan(p);
          opciones +=
            '<button type="button" class="form-turno" data-turno="' + i + '"' +
              ' data-dias="' + escapeHtml(d.dias) + '"' +
              ' data-hora="' + escapeHtml(d.hora) + '"' +
              ' data-cupos="' + escapeHtml(d.cupos) + '"' +
              ' style="display:flex; flex-direction:column; gap:2px; width:100%; ' +
                     'padding:10px 12px; margin:0; ' +
                     'background:#ffffff; border:1.5px solid #e2e8f0; border-radius:10px; ' +
                     'font-family:inherit; text-align:left; cursor:pointer; ' +
                     '-webkit-tap-highlight-color:transparent;">' +
              '<span style="font-size:0.82rem; font-weight:700; line-height:1.2; color:#334155;">' +
                escapeHtml(d.dias) +
              '</span>' +
              '<span style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; ' +
                           'font-size:0.78rem; line-height:1.2; color:#64748b;">' +
                '<span>' + escapeHtml(d.hora)  + '</span>' +
                '<span>' + escapeHtml(d.cupos) + '</span>' +
              '</span>' +
            '</button>';
        });
        opciones += '</div>';
      }

      var d0 = datosPlan(planes[idx] || {});
      var resumen =
        '<button type="button" id="btnResumenHorario" ' +
          'style="width:100%; display:' + (confirmado ? 'flex' : 'none') + '; align-items:center; ' +
                 'justify-content:space-between; padding:0; background:transparent; border:none; ' +
                 'font-family:inherit; cursor:' + (auto ? 'default' : 'pointer') + '; text-align:left; ' +
                 '-webkit-tap-highlight-color:transparent;">' +
          '<div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; color:#16a34a;">' +
            '<span id="resumenHorarioDia" style="font-size:0.82rem; font-weight:700; line-height:1.2;">' +
              escapeHtml(d0.dias) +
            '</span>' +
            '<span style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; ' +
                         'font-size:0.78rem; line-height:1.2;">' +
              '<span id="resumenHorarioHora">'  + escapeHtml(d0.hora)  + '</span>' +
              '<span id="resumenHorarioCupos">' + escapeHtml(d0.cupos) + '</span>' +
            '</span>' +
          '</div>' +
          (auto ? '' : PENCIL_BTN) +
        '</button>';

      var verde  = confirmado ? 'border-color:#16a34a; background-color:#f0fdf4;' : '';
      var legend = confirmado ? ' style="color:#16a34a; background-color:#f0fdf4;"' : '';

      return '<fieldset class="form-fieldset" id="horarioFieldset" ' +
                'data-auto="' + (auto ? '1' : '0') + '" ' +
                'data-confirmado="' + (confirmado ? '1' : '0') + '" style="' + verde + '">' +
                '<legend id="horarioLegend"' + legend + '>Horario disponible</legend>' +
                opciones + resumen +
              '</fieldset>';
    }

    /* ============================================================
       HTML completo
       ============================================================ */
    function getHTML(state) {
      var post = state.postActivo || {};
      var nombrePost = tituloDelPost(post);

      var origenes = state.origenes || [];

      var html = '<div class="sheet-form">';
      html += getHeaderHTML(nombrePost);

      html += '<div id="bloqueDatos">';
      html += getHorarioHTML(state);
      html += '</div>';

      var claseRevelable = state.bloqueDatosVisible
        ? 'bloque-colapsable abierto'
        : 'bloque-colapsable';

      html += '<div class="' + claseRevelable + '" id="bloqueRevelable">';
      html +=   '<div class="bloque-inner">';

      html +=     '<div class="form-field" id="fieldNombre">' +
                    '<input type="text" id="inputNombre" placeholder=" " class="form-input" autocomplete="name">' +
                    '<label for="inputNombre" class="form-label">Nombre completo</label>' +
                    '<span class="field-check">' + CHECK_SVG + '</span>' +
                  '</div>';

      html +=     '<div class="form-field" id="fieldTelefono">' +
                    '<div class="form-input-tel">' +
                      '<span class="form-prefijo">+58</span>' +
                      '<input type="tel" id="inputTelefono" placeholder=" " autocomplete="tel" inputmode="numeric">' +
                    '</div>' +
                    '<label for="inputTelefono" class="form-label">Teléfono</label>' +
                    '<span class="field-check">' + CHECK_SVG + '</span>' +
                  '</div>';

      html +=     '<div class="form-field" id="fieldCorreo">' +
                    '<input type="email" id="inputCorreo" placeholder=" " class="form-input" ' +
                           'autocomplete="email" inputmode="email" ' +
                           'autocapitalize="off" autocorrect="off" spellcheck="false">' +
                    '<label for="inputCorreo" class="form-label">Correo electrónico</label>' +
                    '<span class="field-check">' + CHECK_SVG + '</span>' +
                    '<button type="button" id="btnEditarCorreo" aria-label="Editar correo" ' +
                      'style="display:none; position:absolute; right:12px; top:50%; transform:translateY(-50%); ' +
                             'align-items:center; justify-content:center; ' +
                             'width:34px; height:34px; border-radius:50%; border:none; padding:0; ' +
                             'background-color: color-mix(in srgb, var(--post-color, #1d4ed8) 12%, transparent); ' +
                             'color: var(--post-color, #1d4ed8); cursor:pointer; z-index:2; ' +
                             '-webkit-tap-highlight-color:transparent;">' +
                      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                           'stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;">' +
                        '<path d="M12 20h9"/>' +
                        '<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>' +
                      '</svg>' +
                    '</button>' +
                  '</div>';

      html +=     '<div class="aviso-reserva-activa" id="avisoReservaActiva" ' +
                    'style="display:none; padding:14px 16px; margin-top:10px; ' +
                           'background:transparent; border:1.5px dashed #cbd5e1; border-radius:12px;"></div>';

      html +=     '<button type="button" class="btn-solicitar-codigo" id="btnSolicitarCodigo" hidden>' +
                    '📧 Solicitar código de validación' +
                  '</button>';

      html +=     '<div class="zona-otp" id="zonaOtp" hidden>' +
                    '<div class="form-field" id="fieldOtp">' +
                      '<input type="text" id="inputOtp" placeholder=" " class="form-input form-input-otp" ' +
                             'inputmode="numeric" maxlength="6" autocomplete="one-time-code">' +
                      '<label for="inputOtp" class="form-label">Código de validación</label>' +
                    '</div>' +
                    '<button type="button" class="link-reenviar" id="btnReenviar">Reenviar código</button>' +
                  '</div>';

      html +=     '<div class="bloque-post-validacion" id="bloquePostValidacion" hidden>';

      var conocioConfirmado = !!state.conocioConfirmado && !!state.conocioSeleccionado;
      var conocioSeleccionadoTitulo = '';
      if (conocioConfirmado) {
        var itemSel = null;
        for (var k = 0; k < origenes.length; k++) {
          if (origenes[k].idOrigen === state.conocioSeleccionado) { itemSel = origenes[k]; break; }
        }
        conocioSeleccionadoTitulo = itemSel ? itemSel.titulo : state.conocioSeleccionado;
      }

      var verdeC  = conocioConfirmado ? 'border-color:#16a34a; background-color:#f0fdf4;' : '';
      var legendC = conocioConfirmado ? ' style="color:#16a34a; background-color:#f0fdf4;"' : '';

      html +=       '<fieldset class="form-fieldset revelar-item" id="conocioFieldset" ' +
                      'data-confirmado="' + (conocioConfirmado ? '1' : '0') + '" ' +
                      'style="animation-delay:0ms; ' + verdeC + '">' +
                      '<legend id="conocioLegend"' + legendC + '>¿Cómo te enteraste?</legend>' +

                      '<div id="conocioOpciones" style="display:' + (conocioConfirmado ? 'none' : '') + ';">' +
                        '<div class="form-chips" id="chipsConocio">';
      origenes.forEach(function (o) {
        html += '<button type="button" class="chip-form' + (conocioConfirmado && o.idOrigen === state.conocioSeleccionado ? ' activo' : '') + '" ' +
                      'data-valor="' + escapeHtml(o.idOrigen) + '" ' +
                      'data-titulo="' + escapeHtml(o.titulo) + '">' +
                  escapeHtml(o.titulo) +
                '</button>';
      });
      html +=           '</div>' +
                      '</div>' +

                      '<button type="button" id="btnResumenConocio" ' +
                        'style="width:100%; display:' + (conocioConfirmado ? 'flex' : 'none') + '; ' +
                               'align-items:center; justify-content:space-between; ' +
                               'padding:0; background:transparent; border:none; font-family:inherit; ' +
                               'cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent;">' +
                        '<span id="resumenConocioTexto" style="flex:1; font-weight:700; line-height:1.4; ' +
                          'font-size:0.82rem; color:#16a34a;">' +
                          (conocioConfirmado ? '✓ ' + escapeHtml(conocioSeleccionadoTitulo) : '—') +
                        '</span>' +
                        PENCIL_BTN +
                      '</button>' +

                      '<div class="form-field" id="fieldConocioOtro" ' +
                        ((conocioConfirmado && state.conocioSeleccionado === 'otro') ? '' : 'hidden ') +
                        'style="margin-top:10px">' +
                        '<input type="text" id="inputConocioOtro" placeholder=" " class="form-input">' +
                        '<label for="inputConocioOtro" class="form-label">¿Cuál medio?</label>' +
                        '<span class="field-check">' + CHECK_SVG + '</span>' +
                      '</div>' +
                    '</fieldset>';

      html +=       '<div class="revelar-item" style="animation-delay:80ms">' +
                      '<div class="form-check-wrap" id="checkPrivacidadWrap">' +
                        '<label class="form-check-inner">' +
                          '<input type="checkbox" id="inputPrivacidad">' +
                          '<span class="form-check-box">' + CHECK_SVG + '</span>' +
                        '</label>' +
                        '<span class="form-check-texto">' +
                          'Acepto la ' +
                          '<button type="button" class="link-privacidad" id="linkPrivacidad">política de privacidad</button>' +
                          ' de Centro Ceicca.' +
                        '</span>' +
                      '</div>' +
                    '</div>';

      html +=       '<div class="revelar-item" style="animation-delay:160ms">' +
                      '<button type="button" class="form-submit" id="btnConfirmarReserva" disabled>' +
                        '<span class="form-submit-texto">Enviar mi registro</span>' +
                        '<span class="form-submit-flecha" data-glifo="flecha"></span>' +
                      '</button>' +
                    '</div>';

      html +=     '</div>';
      html +=   '</div>';
      html += '</div>';
      html += '</div>';

      return html;
    }

    /* ============================================================
       Bind
       ============================================================ */
    function bind(state, el, cb) {

      function revelarBloque2() {
        if (state.bloqueDatosVisible) return;
        state.bloqueDatosVisible = true;

        var wrap = Sheet.getContent().querySelector('#bloqueRevelable');
        if (!wrap) return;
        if (wrap.classList.contains('abierto')) return;

        setTimeout(function () {
          wrap.classList.add('abierto');
          setTimeout(function () {
            if (el.inputNombre && typeof el.inputNombre.scrollIntoView === 'function') {
              el.inputNombre.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 200);
        }, 150);
      }

      /* ---------- HORARIO ---------- */
      (function bindHorario() {
        var fsH = el.bloqueDatos.querySelector('#horarioFieldset');
        if (!fsH) return;

        if (fsH.getAttribute('data-auto') === '1') {
          revelarBloque2();
          return;
        }

        var optH    = fsH.querySelector('#horarioOpciones');
        var btnResH = fsH.querySelector('#btnResumenHorario');
        var legendH = fsH.querySelector('#horarioLegend');
        var rDia    = fsH.querySelector('#resumenHorarioDia');
        var rHora   = fsH.querySelector('#resumenHorarioHora');
        var rCupos  = fsH.querySelector('#resumenHorarioCupos');

      /* ---------- CAMPOS DEL BLOQUE 2 ---------- */

        var v = this.value;
        el.fieldNombre.classList.toggle('activo', v.length > 0 || document.activeElement === this);
        var ok = validarNombre(v);
        el.fieldNombre.classList.toggle('validado', ok);
        el.fieldNombre.classList.remove('invalido');
        actualizarEstadoFormulario();
      });
      el.inputNombre.addEventListener('focus', function () { el.fieldNombre.classList.add('activo'); });

        el.fieldTelefono.classList.toggle('activo', v.length > 0 || document.activeElement === this);
        var ok = validarTelefono(v);
        el.fieldTelefono.classList.toggle('validado', ok);
        el.fieldTelefono.classList.remove('invalido');
        actualizarEstadoFormulario();
      });
      el.inputTelefono.addEventListener('focus', function () { el.fieldTelefono.classList.add('activo'); });
      el.inputTelefono.addEventListener('blur', function () { if (!this.value) el.fieldTelefono.classList.remove('activo'); });

      /* Correo */
      el.inputCorreo.addEventListener('input', function () {
        if (state.correoValidado) return;

        if (el.avisoReservaActiva) {
          el.avisoReservaActiva.style.display = 'none';

      el.inputCorreo.addEventListener('focus', function () { el.fieldCorreo.classList.add('activo'); });

      window.ReservaOTP.init(state, el, {

        banner:           cb.banner,
        onEstadoCambiado: actualizarEstadoFormulario

      /* ---------- ¿Cómo te enteraste? ---------- */
      (function bindConocio() {
        var fsC       = Sheet.getContent().querySelector('#conocioFieldset');
        if (!fsC) return;

        var optC      = fsC.querySelector('#conocioOpciones');
        var btnResC   = fsC.querySelector('#btnResumenConocio');
        var legendC   = fsC.querySelector('#conocioLegend');
        var resumenC  = fsC.querySelector('#resumenConocioTexto');
        var chips     = fsC.querySelectorAll('.chip-form');

        function setVerde(si) {
          fsC.setAttribute('data-confirmado', si ? '1' : '0');
          fsC.style.borderColor     = si ? '#16a34a' : '';
          fsC.style.backgroundColor = si ? '#f0fdf4' : '';
          legendC.style.color           = si ? '#16a34a' : '';
          legendC.style.backgroundColor = si ? '#f0fdf4' : '';

        function confirmar(valor, titulo) {
          state.conocioSeleccionado = valor;
          state.conocioConfirmado   = true;
          resumenC.textContent = '✓ ' + titulo;
          optC.style.display = 'none';
          btnResC.style.display = 'flex';
          setVerde(true);

          var item = cb.getOrigenPorId(valor);
          if (item && item.requiereTexto) {
            el.fieldConocioOtro.hidden = false;
            setTimeout(function () {
              if (el.inputConocioOtro) el.inputConocioOtro.focus();
            }, 80);
          } else {
            el.fieldConocioOtro.hidden = true;
            el.inputConocioOtro.value = '';
            el.fieldConocioOtro.classList.remove('activo', 'validado');
          }
          actualizarEstadoFormulario();
        }

        function reabrir() {
          state.conocioConfirmado = false;
          optC.style.display = '';
          btnResC.style.display = 'none';
          setVerde(false);

          var item = cb.getOrigenPorId(state.conocioSeleccionado);
          if (item && item.requiereTexto) {
            el.fieldConocioOtro.hidden = false;
          } else {
            el.fieldConocioOtro.hidden = true;
          }
          actualizarEstadoFormulario();
        }

        chips.forEach(function (chip) {
          chip.addEventListener('click', function () {
            cb.haptic(8);
            chips.forEach(function (c) { c.classList.remove('activo'); });
            this.classList.add('activo');
            var valor  = this.getAttribute('data-valor');
            var titulo = this.getAttribute('data-titulo') || this.textContent.trim();
            confirmar(valor, titulo);
          });
        });

        btnResC.addEventListener('click', function () {
          cb.haptic(8);
          reabrir();
        });

        if (state.conocioConfirmado && state.conocioSeleccionado) {
          var itemPrev = cb.getOrigenPorId(state.conocioSeleccionado);
          chips.forEach(function (c) {
            if (c.getAttribute('data-valor') === state.conocioSeleccionado) {
              c.classList.add('activo');
            }
          });
          confirmar(state.conocioSeleccionado, itemPrev ? itemPrev.titulo : state.conocioSeleccionado);
        }
      })();

      el.inputConocioOtro.addEventListener('input', function () {
        var v = this.value;
        el.fieldConocioOtro.classList.toggle('activo', v.length > 0 || document.activeElement === this);
        el.fieldConocioOtro.classList.toggle('validado', v.trim().length > 0);
        actualizarEstadoFormulario();
      });
      el.inputConocioOtro.addEventListener('focus', function () { el.fieldConocioOtro.classList.add('activo'); });
      el.inputConocioOtro.addEventListener('blur', function () { if (!this.value) el.fieldConocioOtro.classList.remove('activo'); });

      el.inputPrivacidad.addEventListener('change', function () {
        cb.haptic(6);
        if (this.checked) el.checkPrivacidadWrap.classList.remove('error');
        actualizarEstadoFormulario();
      });

      el.linkPrivacidad.addEventListener('click', function (e) {
        e.preventDefault();
        cb.mostrarPrivacidad();
      });

      el.btnConfirmar.addEventListener('click', cb.onEnviar);

      /* ---------- Validación del formulario ---------- */
      function actualizarEstadoFormulario() {
        if (!el.btnConfirmar) return;

        var ok = validarNombre(el.inputNombre.value)
              && validarTelefono(el.inputTelefono.value)
              && state.correoValidado
              && !!state.horarioConfirmado
              && !!state.conocioSeleccionado
              && el.inputPrivacidad.checked;

        if (state.conocioSeleccionado === 'otro') {
          if (!el.inputConocioOtro.value.trim()) ok = false;
        }

        el.btnConfirmar.disabled = !ok;

        if (el.btnEditarCorreo) {
          var correoOk = validarCorreo((el.inputCorreo.value || '').trim());
          var debeVerLapiz = !state.correoValidado && correoOk && state.otpEnviado;
          el.btnEditarCorreo.style.display = debeVerLapiz ? 'flex' : 'none';
        }

        if (el.btnSolicitar) {
          var cOk = validarCorreo((el.inputCorreo.value || '').trim());
          var hayAvisoC = el.avisoReservaActiva && el.avisoReservaActiva.style.display !== 'none';
          var ocultar   = state.otpEnviado || state.correoValidado || hayAvisoC;
          el.btnSolicitar.hidden = !cOk || ocultar;
        }
      }
    }

    return {
      getHTML: getHTML,
      bind:    bind
    };

  })();
</script>
<!--

PROYECTO:        INGeniusCloud | ServyCloud
RESPONSABILIDAD: Vista de confirmación. Tres modos: cargando / error / éxito.
                 Éxito: información de la reserva + aviso de que el
                 cupo se activa al pagar en oficina.
                 Título del post leído de seccionPresentacion.titulo
                 (con fallback a post.titulo del índice liviano).
VERSIÓN:         1.0
CAMBIOS:         R6: baseline de producción incorporado al espejo;
                 encabezado normalizado al estándar ═══ (6 campos).
DEPENDENCIAS:    Reserva_Sheet_Script.html (window.Sheet),
                 Global_Script.html (window.limpiarTelefono),
                 Index.html (TABLAS), Reserva_CSS.html (clases
                 reserva-root/sheet base), Reserva_Exito_CSS.html
                 (clases reserva-exito/exito-* · R10),
                 Reserva_Script.html (state + callbacks)
════════════════════════════════════════════════════════════════════
-->
<script>
  window.ReservaExito = (function () {

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    /* Título del post · lee del post enriquecido, con fallback */
    function tituloDelPost(post) {
      if (!post) return '';
      var sj = post.seccionJson || {};
      var sp = sj.seccionPresentacion || {};
      var t = String(sp.titulo || '').trim();
      if (t) return t;
      return String(post.titulo || '').trim();
    }

    /* ============================================================
       MODO CARGANDO · skeleton
       ============================================================ */
    function _htmlCargando(state) {
      var html = '<div class="reserva-exito reserva-exito-cargando">';
      html +=   '<div class="reserva-exito-icono"><span class="spinner-exito"></span></div>';
      html +=   '<h3 class="reserva-exito-titulo">Procesando tu reserva</h3>';
      html +=   '<p class="reserva-exito-sub">Estamos confirmando tu cupo. Esto toma unos segundos.</p>';
      html +=   '<ul class="exito-lista">';

      var anchos = ['78%', '62%', '70%', '55%', '66%'];
      for (var i = 0; i < anchos.length; i++) {
        html += '<li>' +
                  '<span class="exito-check skeleton-dot"></span>' +
                  '<span class="skeleton-line" style="width:' + anchos[i] + '"></span>' +
                '</li>';
      }

      html +=   '</ul>';
      html += '</div>';
      return html;
    }

    /* ============================================================
       MODO ERROR
       ============================================================ */
    function _htmlError(state) {
      var mensaje = state.reservaErrorTexto || 'No se pudo procesar tu reserva. Intenta de nuevo.';

      var html = '<div class="reserva-exito reserva-exito-error">';
      html +=   '<div class="reserva-exito-icono">⚠️</div>';
      html +=   '<h3 class="reserva-exito-titulo">No pudimos confirmar tu reserva</h3>';
      html +=   '<p class="reserva-exito-sub">' + escapeHtml(mensaje) + '</p>';
      html +=   '<div class="exito-acciones">';
      html +=     '<button type="button" class="exito-btn-primario" id="btnReintentarReserva">Intentar de nuevo</button>';
      html +=     '<button type="button" class="exito-btn-secundario" id="btnVolverFormulario">Volver al formulario</button>';
      html +=   '</div>';
      html += '</div>';
      return html;
    }

    /* ============================================================
       MODO ÉXITO
       ============================================================ */
    function _htmlExito(state, elDatos) {
      elDatos = elDatos || {};

      var post = state.postActivo || {};
      var nombrePost = tituloDelPost(post);

      var checkSvg = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';

      var plan = (state.planes || [])[state.turnoSeleccionado] || {};
      var dias = (plan.turno && plan.turno.dias && plan.turno.dias.join(' · ')) || '';
      var hora = (plan.turno && plan.turno.textoMostrar) || '';
      var turnoFull = dias + (hora ? ' · ' + hora : '');

      var origenTxt = state.origenTitulo || state.conocioSeleccionado || '';
      if (state.conocioSeleccionado === 'otro' && elDatos.inputConocioOtro && elDatos.inputConocioOtro.value.trim()) {
        origenTxt += ' · ' + elDatos.inputConocioOtro.value.trim();
      }

      var tel = (elDatos.inputTelefono && elDatos.inputTelefono.value || '').replace(/\D/g, '');
      var telFull = tel ? ('+58 ' + tel.replace(/^0/, '')) : '';

      /* WhatsApp del partner del post activo */
      var partner = null;
      var partners = (window.TABLAS && window.TABLAS.partners) || [];
      for (var k = 0; k < partners.length; k++) {
        if (partners[k].id === post.idPartner) { partner = partners[k]; break; }
      }

      var numeroInternacional = '';
      if (partner && partner.partnerJson && partner.partnerJson.whatsapp) {
        numeroInternacional = (typeof window.limpiarTelefono === 'function')
          ? window.limpiarTelefono(partner.partnerJson.whatsapp)
          : '';
      }

      var waMsg = 'Hola, acabo de reservar un cupo para ' + nombrePost +
                  '. ¿Me pueden dar más información?';
      var waHref = numeroInternacional
        ? ('https://wa.me/' + numeroInternacional + '?text=' + encodeURIComponent(waMsg))
        : '';

      function fila(k, v) {
        if (v === null || v === undefined || v === '') return '';
        return '<li>' +
          '<span class="exito-check">' + checkSvg + '</span>' +
          '<span class="exito-txt">' +
            '<span class="exito-k">' + escapeHtml(k) + '</span> ' +
            '<span class="exito-v">' + escapeHtml(v) + '</span>' +
          '</span>' +
        '</li>';
      }

      var html = '<div class="reserva-exito">';
      html += '<div class="reserva-exito-icono">🎉</div>';
      html += '<h3 class="reserva-exito-titulo">¡Felicitaciones!</h3>';
      html += '<p class="reserva-exito-sub">Hemos recibido tus datos correctamente.</p>';

      html += '<ul class="exito-lista">';
      html += fila('Publicación:', nombrePost);
      html += fila('Nombre:', (elDatos.inputNombre && elDatos.inputNombre.value || '').trim());
      html += fila('Teléfono:', telFull);
      html += fila('Correo:', (elDatos.inputCorreo && elDatos.inputCorreo.value || '').trim());
      html += fila('Horario:', turnoFull);
      html += fila('¿Cómo nos conociste?:', origenTxt);
      html += '</ul>';

      html += '<div class="exito-aviso warning">' +
                '<span class="exito-aviso-icono">⚠️</span>' +
                '<span>Tu cupo se activa al completar el pago en nuestras oficinas.</span>' +
              '</div>';

      html += '<div class="exito-nota">' +
                '<span class="exito-nota-icono">📧</span>' +
                '<span>Revisa tu correo (incluida la carpeta de spam): te enviamos las instrucciones de pago y los horarios.</span>' +
              '</div>';

      html += '<p class="exito-contacto">Para dudas o comentarios</p>';

      if (waHref) {
        html += '<a class="exito-whatsapp" href="' + waHref + '" target="_blank" rel="noopener">' +
          '<span class="exito-whatsapp-icono" data-glifo="whatsapp"></span>' +
          '<span class="exito-whatsapp-texto">Chatea con atención al cliente</span>' +
        '</a>';
      }

      html += '</div>';
      return html;
    }

    function getHTML(state, elDatos) {
      if (state.reservaCargando) return _htmlCargando(state);
      if (state.reservaError)    return _htmlError(state);
      return _htmlExito(state, elDatos);
    }

    function bind(state, el, cb) {
      var c = Sheet.getContent();
      if (!c) return;

      var btnReintentar = c.querySelector('#btnReintentarReserva');
      var btnVolver     = c.querySelector('#btnVolverFormulario');

      if (btnReintentar) {
        btnReintentar.addEventListener('click', function (e) {
          e.preventDefault();
          if (typeof cb.haptic === 'function') cb.haptic([15, 10, 15]);
          if (typeof cb.onReintentar === 'function') cb.onReintentar();
        });
      }

      if (btnVolver) {
        btnVolver.addEventListener('click', function (e) {
          e.preventDefault();
          if (typeof cb.haptic === 'function') cb.haptic([15, 10, 15]);
          if (typeof cb.onVolver === 'function') cb.onVolver();
        });
      }
    }

    return {
      getHTML: getHTML,
      bind:    bind
    };

  })();
</script>

<script>

    var state = {
      postActivo:          null,
      origenes:            [],
      planes:              [],
      conocioSeleccionado: null,
      conocioConfirmado:   false,
      turnoSeleccionado:   0,
      horarioConfirmado:   false,
      bloqueDatosVisible:  false,
      otpEnviado:          false,
      otpCooldownHasta:    0,
      correoValidado:      false,
      origenTitulo:        '',
      reservaCargando:     false,
      reservaError:        '',
      reservaErrorTexto:   '',
      reservaIdReserva:    '',
      payloadUltimo:       null,
      formSnapshot:        null
    };

    var el = {};
    var bannerTimeout = null;

    function haptic(v) {
      if (navigator.vibrate) { try { navigator.vibrate(v); } catch (e) {} }
    }

    function getPostActivo() {
      if (state.postActivo && state.postActivo.id) return state.postActivo;
      if (window.Lista && typeof window.Lista.getPostActivo === 'function') {
        return window.Lista.getPostActivo();
      }
      return null;
    }

    function getOrigenesActivos() {
      return ((window.SISTEMA && window.SISTEMA.origenes) || []).filter(function (o) {
        return o.estado !== false;
      });
    }
    function getOrigenPorId(id) {
      var arr = getOrigenesActivos();
      for (var i = 0; i < arr.length; i++) if (arr[i].idOrigen === id) return arr[i];
      return null;
    }
    function getPlanes() {
      var post = getPostActivo();
      if (!post || !post.planJson) return [];
      return post.planJson.planes || [];
    }
    function getTurnoPorIndice(i) {
      return (getPlanes())[i] || null;
    }

    function banner(texto, tipo) {
      var content = Sheet.getContent();
      if (!content) return;
      var b = content.querySelector('#reservaBanner');
      if (!b) return;
      b.textContent = texto;
      b.className = 'reserva-banner ' + (tipo || 'info');
      b.hidden = false;
      clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(function () { if (b) b.hidden = true; }, 3200);
    }

    function recogerEl() {
      var c = Sheet.getContent();
      if (!c) return;
      el = {
        banner:               c.querySelector('#reservaBanner'),
        bloqueDatos:          c.querySelector('#bloqueDatos'),
        inputNombre:          c.querySelector('#inputNombre'),
        fieldNombre:          c.querySelector('#fieldNombre'),
        inputTelefono:        c.querySelector('#inputTelefono'),
        fieldTelefono:        c.querySelector('#fieldTelefono'),
        inputCorreo:          c.querySelector('#inputCorreo'),
        fieldCorreo:          c.querySelector('#fieldCorreo'),
        avisoReservaActiva:   c.querySelector('#avisoReservaActiva'),
        btnEditarCorreo:      c.querySelector('#btnEditarCorreo'),
        inputOtp:             c.querySelector('#inputOtp'),
        fieldOtp:             c.querySelector('#fieldOtp'),
        btnSolicitar:         c.querySelector('#btnSolicitarCodigo'),
        btnReenviar:          c.querySelector('#btnReenviar'),
        zonaOtp:              c.querySelector('#zonaOtp'),
        bloquePost:           c.querySelector('#bloquePostValidacion'),
        chipsConocio:         c.querySelector('#chipsConocio'),
        fieldConocioOtro:     c.querySelector('#fieldConocioOtro'),
        inputConocioOtro:     c.querySelector('#inputConocioOtro'),
        inputPrivacidad:      c.querySelector('#inputPrivacidad'),
        checkPrivacidadWrap:  c.querySelector('#checkPrivacidadWrap'),
        btnConfirmar:         c.querySelector('#btnConfirmarReserva'),
        linkPrivacidad:       c.querySelector('#linkPrivacidad')
      };
    }

    function mostrarDatos() {
      Sheet.setContent(window.ReservaDatos.getHTML(state));
      if (typeof window.pintarGlifos === 'function') window.pintarGlifos(Sheet.getContent());
      recogerEl();

      window.ReservaDatos.bind(state, el, {
        haptic:              haptic,
        banner:              banner,
        onEnviar:            onEnviar,
        mostrarPrivacidad:   mostrarPrivacidad,
        getOrigenPorId:      getOrigenPorId
      });

      if (state.formSnapshot) {
        repoblarFormulario(state.formSnapshot);
      }

      Sheet.ocultarVolver();
      Sheet.desactivarGradientePrivacidad();
    }

    function repoblarFormulario(snap) {
      var V = window.ReservaValida;

      if (snap.nombre) {
        el.inputNombre.value = snap.nombre;
        el.fieldNombre.classList.add('activo');
        if (V.nombre(snap.nombre)) el.fieldNombre.classList.add('validado');
      }
      if (snap.telefono) {
        el.inputTelefono.value = snap.telefono;
        el.fieldTelefono.classList.add('activo');
        if (V.telefono(snap.telefono)) el.fieldTelefono.classList.add('validado');
      }
      if (snap.correo) {
        el.inputCorreo.value = snap.correo;
        el.fieldCorreo.classList.add('activo');
        if (state.correoValidado) {
          el.fieldCorreo.classList.add('validado');
          el.inputCorreo.readOnly = true;
        }
      }
      if (state.correoValidado) {
        el.zonaOtp.hidden = true;
        el.bloquePost.hidden = false;
        el.bloquePost.classList.add('revelando');
      }
      if (snap.conocioOtro) {
        el.fieldConocioOtro.hidden = false;
        el.inputConocioOtro.value = snap.conocioOtro;
        el.fieldConocioOtro.classList.add('activo', 'validado');
      }
      if (snap.privacidadChecked) {
        el.inputPrivacidad.checked = true;
      }

      el.inputNombre.dispatchEvent(new Event('input', { bubbles: true }));
      el.inputTelefono.dispatchEvent(new Event('input', { bubbles: true }));
      el.inputCorreo.dispatchEvent(new Event('input', { bubbles: true }));
      el.inputConocioOtro.dispatchEvent(new Event('input', { bubbles: true }));
      el.inputPrivacidad.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function mostrarExito() {
      var origenItem = getOrigenPorId(state.conocioSeleccionado);
      state.origenTitulo = origenItem ? origenItem.titulo : state.conocioSeleccionado;

      Sheet.setContent(window.ReservaExito.getHTML(state, el));
      if (typeof window.pintarGlifos === 'function') window.pintarGlifos(Sheet.getContent());

      window.ReservaExito.bind(state, el, {
        haptic:       haptic,
        onReintentar: onEnviar,
        onVolver:     volverAlFormulario
      });

      Sheet.ocultarVolver();
      Sheet.desactivarGradientePrivacidad();
    }

    function volverAlFormulario() {
      state.reservaError = '';
      state.reservaErrorTexto = '';
      state.reservaIdReserva = '';

      mostrarDatos();
    }

    function mostrarPrivacidad() {
      var getLegal = (window.Global && typeof window.Global.getLegalHTML === 'function')
        ? window.Global.getLegalHTML : null;
      if (!getLegal) { banner('No se pudo cargar la política de privacidad', 'error'); return; }

      var content = Sheet.getContent();
      var formWrap = content.querySelector('.sheet-form');
      var existing = content.querySelector('.reserva-legal-wrap');
      if (existing) existing.remove();

      var wrapper = document.createElement('div');
      wrapper.className = 'reserva-legal-wrap';
      wrapper.innerHTML = getLegal('privacidad');

      if (formWrap) formWrap.hidden = true;
      content.appendChild(wrapper);
      if (typeof window.pintarGlifos === 'function') window.pintarGlifos(wrapper);
      content.scrollTop = 0;

      Sheet.mostrarVolver();
      Sheet.activarGradientePrivacidad();
    }

    function onVolverClick() {
      var content = Sheet.getContent();
      if (!content) return;
      var legalWrap = content.querySelector('.reserva-legal-wrap');
      if (!legalWrap) return;
      var formWrap = content.querySelector('.sheet-form');
      legalWrap.remove();
      if (formWrap) formWrap.hidden = false;
      content.scrollTop = 0;
      Sheet.ocultarVolver();
      Sheet.desactivarGradientePrivacidad();
    }

    /* ============================================================
       ENVÍO
       ============================================================ */
    function onEnviar() {
      if (state.reservaError) {
        if (!state.payloadUltimo) {
          banner('No hay datos para reintentar. Vuelve al formulario.', 'error');
          return;
        }
        ejecutarEnvio(state.payloadUltimo);
        return;
      }

      var post = getPostActivo();
      if (!post) { banner('No hay publicación activa', 'error'); return; }

      var plan = getTurnoPorIndice(state.turnoSeleccionado);
      if (!plan || !plan.idTurno) { banner('Selecciona un horario válido', 'error'); return; }

      state.formSnapshot = {
        nombre:            (el.inputNombre.value || '').trim(),
        telefono:          (el.inputTelefono.value || '').replace(/\D/g, ''),
        correo:            (el.inputCorreo.value || '').trim(),
        conocidoOtro:      (el.inputConocioOtro.value || '').trim(),
        privacidadChecked: !!el.inputPrivacidad.checked
      };

      var contactoParaEnviar = state.conocioSeleccionado;
      if (state.conocioSeleccionado === 'otro') {
        var detalle = state.formSnapshot.conocidoOtro;
        if (detalle) contactoParaEnviar = 'otro: ' + detalle;
      }

      var payload = {
        post: post.id + '_' + plan.idTurno,
        correo: state.formSnapshot.correo,
        contactoIni: contactoParaEnviar,
        alumnoJson: {
          nombre:   state.formSnapshot.nombre,
          telefono: state.formSnapshot.telefono
        }
      };

      try {
        localStorage.setItem('academy_user', JSON.stringify({
          uid: (typeof getDeviceId === 'function') ? getDeviceId() : '',
          nombre: payload.alumnoJson.nombre
        }));
      } catch (_) {}

      state.payloadUltimo = payload;
      ejecutarEnvio(payload);
    }

    function ejecutarEnvio(payload) {
      state.reservaCargando = true;
      state.reservaError = '';
      state.reservaErrorTexto = '';

      mostrarExito();

      postBackend('reserva', payload)
        .then(function (data) {
          haptic([30, 20, 30]);
          state.reservaCargando = false;
          state.reservaIdReserva = (data && data.idReserva) || '';
          mostrarExito();
        })
        .catch(function (err) {
          var msg = err.message || '';
          haptic([30, 20, 30]);
          state.reservaCargando = false;
          state.reservaError = msg;

          if (msg === 'RESERVA_ACTIVA') {
            state.reservaErrorTexto = 'Ese correo ya tiene una reserva activa.';
          } else if (msg === 'SIN_CUPOS') {
            state.reservaErrorTexto = 'Este horario se quedó sin cupo. Elige otro turno.';
          } else if (msg.indexOf('RATE_LIMIT') === 0) {
            state.reservaErrorTexto = 'Demasiadas reservas seguidas. Intenta en unos minutos.';
          } else {
            state.reservaErrorTexto = 'No se pudo procesar tu reserva. Intenta de nuevo.';
          }

          mostrarExito();
          console.error('[Reserva] Error:', msg);
        });
    }

    /* ============================================================
       Abrir
       ============================================================ */
    function abrir() {
      state.postActivo = getPostActivo();
      if (!state.postActivo) return;

      /* GA4 (R12): apertura del flujo de reserva */
      if (window.Analitica) {
        window.Analitica.enviar('reserva_start', {
          post_id: state.postActivo.id || ''
        });
      }

      state.origenes = getOrigenesActivos();
      state.planes   = getPlanes();

      state.conocioSeleccionado = null;
      state.conocioConfirmado   = false;
      state.turnoSeleccionado   = 0;
      state.horarioConfirmado   = false;
      state.bloqueDatosVisible  = false;
      state.otpEnviado          = false;
      state.otpCooldownHasta    = 0;
      state.correoValidado      = false;
      state.origenTitulo        = '';
      state.reservaCargando     = false;
      state.reservaError        = '';
      state.reservaErrorTexto   = '';
      state.reservaIdReserva    = '';
      state.payloadUltimo       = null;
      state.formSnapshot        = null;

      haptic([15, 10, 15]);

      var sj = state.postActivo.seccionJson || {};
      var meta = sj.meta || {};
      var color = meta.colorOficial || '#1d4ed8';

      Sheet.abrir({
        color:   color,
        content: '',
        onClose: function () {}
      });

      mostrarDatos();
    }

    function cerrar() { Sheet.cerrar(); }

    document.addEventListener('post:change', function (e) {
      var post = e.detail && e.detail.post;
      if (post && post.id) state.postActivo = post;
    });

    function initDelegacionCta() {
      if (document.__reservaCtaDelegado === '1') return;
      document.__reservaCtaDelegado = '1';

      document.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest && e.target.closest('.cta-reservar');
        if (!btn) return;
        if (btn.disabled) return;
        e.preventDefault();
        abrir();
      });
    }

    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest && e.target.closest('.sheet-back');
      if (!btn) return;
      e.preventDefault();
      onVolverClick();
    });

    function pintar() {
      state.postActivo = getPostActivo();
      initDelegacionCta();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', pintar);
    } else {
      pintar();
    }

    return {
      pintar: pintar,
      abrir:  abrir,
      cerrar: cerrar
    };

  })();
</script>

<script>
  window.PartnerSheet = (function () {

    var UMBRAL_VELOCIDAD = 0.5;
    var UMBRAL_DRAG      = 6;
    var LIMITE_COLMENA   = 6;

    var raiz       = null;
    var backdrop   = null;
    var sheet      = null;
    var handleArea = null;
    var content    = null;
    var btnClose   = null;

    var abierto       = false;
    var postOrigen    = null;
    var partnerActivo = null;
    var verTodos      = false;
    var chipActivo    = null;

    var dragActivo = false;
    var dragMoved = false;
    var dragPointerId = null;
    var dragStartY = 0;
    var dragUltimoY = 0;
    var dragUltimoT = 0;
    var dragVelocidad = 0;
    var dragDesdeHandle = false;

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    function haptic(v) {
      if (navigator.vibrate) { try { navigator.vibrate(v); } catch (e) {} }
    }

    function buscarPartner(idPartner) {
      if (!idPartner) return null;
      var partners = (window.TABLAS && window.TABLAS.partners) || [];
      for (var i = 0; i < partners.length; i++) {
        if (partners[i].id === idPartner) return partners[i];
      }
      return null;
    }

    function postsDelPartner(idPartner) {
      if (!idPartner) return [];
      var posts = (window.TABLAS && window.TABLAS.posts) || [];
      return posts.filter(function (p) {
        return p.estado !== 'inactivo'
            && p.estado !== 'pausado'
            && p.idPartner === idPartner;
      });
    }

    function nombrePartner() {
      if (partnerActivo && partnerActivo.nombre) return String(partnerActivo.nombre).trim();
      return 'el partner';
    }

    function inicialPartner() {
      var n = nombrePartner();
      return (n.charAt(0) || 'P').toUpperCase();
    }

    function colorDelPostActual() {
      if (postOrigen && postOrigen.colorOficial) return postOrigen.colorOficial;
      if (postOrigen && postOrigen.seccionJson && postOrigen.seccionJson.meta) {
        return postOrigen.seccionJson.meta.colorOficial || '#475569';
      }
      return '#475569';
    }

    function tituloPostActual() {
      if (postOrigen && postOrigen.seccionJson && postOrigen.seccionJson.seccionPresentacion) {
        var t = String(postOrigen.seccionJson.seccionPresentacion.titulo || '').trim();
        if (t) return t;
      }
      if (postOrigen && postOrigen.titulo) return String(postOrigen.titulo).trim();
      return '';
    }

    function esPostServicio(p) {
      if (!p || !p.idChips) return false;
      return p.idChips.indexOf('se') !== -1;
    }

    function sumarStatsGlobales() {
      var posts = postsDelPartner(partnerActivo ? partnerActivo.id : null);
      var likes = 0, comentarios = 0, compartidos = 0;
      for (var i = 0; i < posts.length; i++) {
        likes        += Number(posts[i].like      || 0);
        comentarios  += Number(posts[i].comenta   || 0);
        compartidos  += Number(posts[i].comparte  || 0);
      }
      return { likes: likes, comentarios: comentarios, compartidos: compartidos };
    }

    function formatearNumero(n) {
      var v = Math.max(0, Math.floor(Number(n || 0)));
      if (v >= 1000000) {
        var m = v / 1000000;
        return ((m % 1 === 0) ? m.toFixed(0) : m.toFixed(1).replace('.', ',')) + 'M';
      }
      if (v >= 100000) return Math.floor(v / 1000) + 'K';
      return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function construir() {
      if (raiz) return;
      var area = document.querySelector('.area-contenido');
      if (!area) return;

      raiz = document.createElement('div');
      raiz.className = 'partner-root';
      raiz.innerHTML =
        '<div class="partner-backdrop"></div>' +
        '<div class="partner-sheet">' +
          '<div class="partner-handle-area"><div class="partner-handle"></div></div>' +
          '<button class="partner-close" type="button" aria-label="Cerrar">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="18" y1="6" x2="6" y2="18"/>' +
              '<line x1="6" y1="6" x2="18" y2="18"/>' +
            '</svg>' +
          '</button>' +
          '<div class="partner-content"></div>' +
        '</div>';

      area.appendChild(raiz);

      backdrop   = raiz.querySelector('.partner-backdrop');
      sheet      = raiz.querySelector('.partner-sheet');
      handleArea = raiz.querySelector('.partner-handle-area');
      content    = raiz.querySelector('.partner-content');
      btnClose   = raiz.querySelector('.partner-close');

      backdrop.addEventListener('click', cerrar);
      btnClose.addEventListener('click', cerrar);
      handleArea.addEventListener('pointerdown', onDragDown);
      content.addEventListener('pointerdown', onContentDown);
    }

    function chipsDisponibles() {
      var posts = postsDelPartner(partnerActivo ? partnerActivo.id : null);
      var tieneCursos = false, tieneServ = false;
      for (var i = 0; i < posts.length; i++) {
        var chips = posts[i].idChips || [];
        if (chips.indexOf('cu') !== -1) tieneCursos = true;
        if (chips.indexOf('se') !== -1) tieneServ   = true;
      }
      var lista = [];
      if (tieneCursos) lista.push({ id: 'cu', titulo: 'Cursos' });
      if (tieneServ)   lista.push({ id: 'se', titulo: 'Servicios' });
      return lista;
    }

    function chipInicialDesdeOrigen() {
      var chips = chipsDisponibles();
      if (!chips.length) return null;

      if (postOrigen && postOrigen.idChips && postOrigen.idChips.length) {
        var chipDelPost = postOrigen.idChips[0];
        for (var i = 0; i < chips.length; i++) {
          if (chips[i].id === chipDelPost) return chipDelPost;
        }
      }
      return chips[0].id;
    }

    function postsFiltrados() {
      var posts = postsDelPartner(partnerActivo ? partnerActivo.id : null);
      if (!chipActivo) return posts;
      return posts.filter(function (p) {
        return (p.idChips || []).indexOf(chipActivo) !== -1;
      });
    }

    function buildHeader() {
      var color = colorDelPostActual();
      var nombre = nombrePartner();
      var pj = partnerActivo && partnerActivo.partnerJson ? partnerActivo.partnerJson : {};
      var eslogan = String(pj.esloganPartner || '').trim();
      var inicial = inicialPartner();

      var html = '<div class="partner-header-sticky">';
      html +=   '<div class="partner-header-row">';
      html +=     '<div class="partner-avatar" style="color:' + color + '; border-color:' + color + ';">' +
                    escapeHtml(inicial) +
                  '</div>';
      html +=     '<div class="partner-header-text">';
      html +=       '<h2 class="partner-nombre">' + escapeHtml(nombre) + '</h2>';
      if (eslogan) {
        html += '<p class="partner-eslogan">' + escapeHtml(eslogan) + '</p>';
      }
      html +=     '</div>';
      html +=   '</div>';
      html += '</div>';
      return html;
    }

    function buildStats() {
      var s = sumarStatsGlobales();
      return '<div class="partner-stats">' +
        '<div class="partner-stat">' +
          '<div class="partner-stat-top">' +
            '<span class="partner-stat-icon rojo" data-glifo="like"></span>' +
            '<span class="partner-stat-numero">' + formatearNumero(s.likes) + '</span>' +
          '</div>' +
          '<span class="partner-stat-label">Me gusta</span>' +
        '</div>' +
        '<div class="partner-stat">' +
          '<div class="partner-stat-top">' +
            '<span class="partner-stat-icon azul" data-glifo="comment"></span>' +
            '<span class="partner-stat-numero">' + formatearNumero(s.comentarios) + '</span>' +
          '</div>' +
          '<span class="partner-stat-label">Comentarios</span>' +
        '</div>' +
        '<div class="partner-stat">' +
          '<div class="partner-stat-top">' +
            '<span class="partner-stat-icon verde" data-glifo="share"></span>' +
            '<span class="partner-stat-numero">' + formatearNumero(s.compartidos) + '</span>' +
          '</div>' +
          '<span class="partner-stat-label">Compartidos</span>' +
        '</div>' +
      '</div>';
    }

    function filaDatoDireccion(direccion, colorAcento) {
      var urlMaps = 'https://www.google.com/maps/dir/?api=1&destination=' +
                    encodeURIComponent(direccion);
      return '<li class="partner-dato-item">' +
        '<a class="partner-dato-maps" href="' + urlMaps + '" target="_blank" rel="noopener">' +
          '<span class="partner-dato-icon" data-glifo="ubicacion" ' +
                'style="color:' + colorAcento + ';"></span>' +
          '<div class="partner-dato-texto">' +
            '<span class="partner-dato-valor">' + escapeHtml(direccion) + '</span>' +
            '<span class="partner-maps-cta" style="color:' + colorAcento + ';">Cómo llegar →</span>' +
          '</div>' +
        '</a>' +
      '</li>';
    }

    function buildFilasDatos() {
      var pj = partnerActivo && partnerActivo.partnerJson ? partnerActivo.partnerJson : {};
      var colorAcento = colorDelPostActual();
      var direccion = String(pj.direccion || '').trim();

      if (!direccion) return '';

      return '<ul class="partner-datos">' +
               filaDatoDireccion(direccion, colorAcento) +
             '</ul>';
    }

    /* ============================================================
       Celda de post · lee del índice liviano
       ============================================================ */
    function celdaPost(p) {
      var nombre  = p.boton || p.titulo || p.id;
      var inicial = (nombre.charAt(0) || '?').toUpperCase();
      var color   = p.colorOficial || '#475569';
      var esPronto   = p.estado === 'pronto';
      var esServicio = esPostServicio(p);

      var borderStyle = esServicio ? 'border-radius:50%;' : '';

      var html = '<button type="button" class="partner-celda" data-post-id="' + escapeHtml(p.id) + '">';
      html +=   '<span class="partner-celda-icono" style="color:' + color + '; border-color:' + color + '; ' + borderStyle + '">' +
                  escapeHtml(inicial) +
                '</span>';
      html +=   '<span class="partner-celda-nombre">' + escapeHtml(nombre) + '</span>';
      if (esPronto) {
        html += '<span class="partner-celda-badge">Pronto</span>';
      }
      html += '</button>';
      return html;
    }

    function buildBloquePublicaciones() {
      var chips = chipsDisponibles();
      var html = '';

      if (chips.length) {
        html += '<div class="partner-chips">';
        chips.forEach(function (c) {
          var activo = (c.id === chipActivo) ? ' activo' : '';
          var solo   = (chips.length === 1) ? ' data-solo="1"' : '';
          html += '<button type="button" class="chip' + activo + '"' +
                  ' data-chip="' + c.id + '"' + solo + '>' +
                    escapeHtml(c.titulo) +
                  '</button>';
        });
        html += '</div>';
      }

      var filtrados = postsFiltrados();

      if (!filtrados.length) {
        html += '<div class="partner-vacia">Próximamente más contenido</div>';
        return html;
      }

      var hayMas = filtrados.length > LIMITE_COLMENA;
      var visibles = verTodos ? filtrados : filtrados.slice(0, LIMITE_COLMENA);

      html += '<div class="partner-colmena">';
      visibles.forEach(function (p) { html += celdaPost(p); });
      html += '</div>';

      if (hayMas) {
        var texto = verTodos ? 'Ver menos' : 'Ver todas las publicaciones';
        html += '<button type="button" class="partner-ver-todos" id="btnVerTodos">' + texto + '</button>';
      }

      return html;
    }

    function buildBotonWhatsapp() {
      var pj = partnerActivo && partnerActivo.partnerJson ? partnerActivo.partnerJson : {};
      var numero = String(pj.whatsapp || '').trim();
      if (!numero) return '';

      var textoBoton = String(pj.textoBotonWhatsapp || 'Enviar mensaje').trim();
      var tituloPost = tituloPostActual();

      var mensaje = tituloPost
        ? ('Hola, estoy viendo "' + tituloPost + '" en la app. ¿Me pueden dar más información?')
        : 'Hola, estoy viendo las publicaciones en la app. ¿Me pueden dar más información?';

      return '<a class="partner-whatsapp" href="#" id="btnPartnerWhatsapp" ' +
                'data-numero="' + escapeHtml(numero) + '" ' +
                'data-mensaje="' + escapeHtml(mensaje) + '">' +
        '<span class="partner-whatsapp-icono" data-glifo="whatsapp"></span>' +

    var backdrop   = null;

    var content    = null;

            String(b.titulo || ''), 'es', { sensitivity: 'base' }
          );

    function buscarPorId(id) {
      for (var i = 0; i < lista.length; i++) {
        if (lista[i].idCiudad === id) return lista[i];
      }

    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    /* ============================================================
       Pintar botón
       ============================================================ */
    function pintarBoton() {
      if (!btnCity || !ciudadTxt) return;

      if (!actual) {

        ciudadTxt.textContent = '—';

      btnCity.disabled = enDetalle;
    }

    /* ============================================================
       Aplicar ciudad · guarda, pinta, emite ciudad:change
       ============================================================ */

      actual = {
        idCiudad: ciudad.idCiudad,
        titulo:   ciudad.titulo
      };
      escribirStorage(actual);
      pendienteSeleccion = false;
      pintarBoton();

      document.dispatchEvent(new CustomEvent('ciudad:change', {

          titulo:   actual.titulo

      if (!lista.length) {

      if (guardada) {
        var c = buscarPorId(guardada.idCiudad);
        if (c) {
          actual = { idCiudad: c.idCiudad, titulo: c.titulo };

      actual = null;
      pendienteSeleccion = false;

      var html = '<h2 class="ciudad-titulo">Selecciona tu ciudad</h2>';
      html += '<ul class="ciudad-lista">';

        html += '<li>' +

                    '<input type="radio" name="ciudad" class="ciudad-radio" ' +

                    '<span class="ciudad-nombre">' + escapeHtml(c.titulo) + '</span>' +
                  '</label>' +

      html += '</ul>';
      content.innerHTML = html;

      content.querySelectorAll('.ciudad-radio').forEach(function (radio) {
        radio.addEventListener('change', function () {
          var id = this.value;
          var c = buscarPorId(id);

            aplicar(c);

            cerrar();
          }

    }

    /* ============================================================
       Sheet · abrir/cerrar
       obligatorio=true → modo bloqueado
       ============================================================ */
    function abrir(obligatorio) {
